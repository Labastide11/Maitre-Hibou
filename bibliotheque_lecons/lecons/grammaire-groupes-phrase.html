<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les groupes dans la phrase — Maître Hibou CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5fc;font-family:system-ui,Arial,sans-serif;color:#153253}main{width:100%;max-width:none;padding:clamp(6px,1vw,14px)}.back{display:inline-block;padding:10px 14px;margin:2px 0 10px;background:white;border-radius:12px;color:#145986;font-weight:800;text-decoration:none}.lesson-image{display:block;width:100%;height:auto;max-width:none;max-height:none;object-fit:contain;border-radius:16px}.practice{width:100%;max-width:none;margin:14px 0;background:white;border-radius:18px;padding:clamp(15px,2vw,28px);box-shadow:0 4px 18px #2139561c}h2{margin:0}.desc{color:#58708c}.bar{height:12px;border-radius:50px;background:#dce8f2;margin:18px 0;overflow:hidden}.fill{height:100%;background:#23a473;width:0;transition:width .2s}.question{font-size:clamp(20px,2.3vw,30px);font-weight:800;margin:12px 0 18px}.counter{font-weight:800;color:#4b6e91}.answers{display:flex;gap:12px;flex-wrap:wrap}.choice,.check,.next,.done,.restart{border:0;border-radius:12px;min-height:48px;padding:12px 17px;font-size:17px;font-weight:800;cursor:pointer}.choice{background:#e8f4ff;color:#17395f;border:2px solid #b2d2ed}.choice:disabled{cursor:default;opacity:.85}.entry{padding:13px 15px;min-height:48px;font-size:19px;border-radius:12px;border:2px solid #aec7df;max-width:100%}.check{background:#276fa6;color:white}.next,.done{background:#198259;color:white}.restart{background:#e3edf7;color:#174a70}.feedback{font-weight:750;margin:14px 0;min-height:27px}.feedback.bad{color:#b44725}.feedback.good{color:#13814e}.hidden{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid #efb03e;outline-offset:3px}</style></head><body><main><a class="back" href="../index.html">← Mes leçons de français</a><img class="lesson-image" src="../../images-lecons/francais/maitre-hibou-groupes-phrase.png" alt="Affiche de la leçon Les groupes dans la phrase"><section class="practice"><h2>Je m’entraîne — Les groupes dans la phrase</h2><p class="desc">Réussis les 10 exercices. Si tu te trompes, lis l’indice et réessaie.</p><div class="bar"><div class="fill" id="fill"></div></div><div class="counter" id="counter"></div><div class="question" id="question"></div><div class="answers" id="choices"></div><form id="entryForm" class="answers hidden"><label for="entry">Ta réponse :</label><input id="entry" class="entry" type="text" required autocomplete="off"><button class="check" id="check" type="submit">Vérifier</button></form><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next hidden" id="next" type="button">Question suivante →</button><p id="end" class="hidden">Bravo ! Tu as réussi les 10 exercices.</p><button class="done hidden" id="done" type="button">✅ J’ai compris cette leçon</button> <button class="restart hidden" id="restart" type="button">Recommencer</button></section></main><script src="../js/hibou-lecons.js"></script><script>(function(){'use strict';const tasks=[{"type": "c", "q": "Dans « Le petit chat dort sur le tapis », quel est le groupe sujet ?", "choices": ["Le petit chat", "dort", "sur le tapis"], "a": "Le petit chat", "tip": "De qui parle-t-on ?"}, {"type": "c", "q": "Quel est le verbe dans « Les enfants jouent dans la cour » ?", "choices": ["Les enfants", "jouent", "dans la cour"], "a": "jouent", "tip": "Que font les enfants ?"}, {"type": "i", "q": "Écris le groupe sujet : « Ma sœur lit un livre. »", "a": "Ma sœur", "tip": "Qui lit ?"}, {"type": "c", "q": "Dans « Ma sœur lit un livre », quel groupe complète le verbe ?", "choices": ["Ma sœur", "lit", "un livre"], "a": "un livre", "tip": "Que lit ma sœur ?"}, {"type": "i", "q": "Écris le groupe sujet : « Les oiseaux chantent le matin. »", "a": "Les oiseaux", "tip": "Qui chante ?"}, {"type": "c", "q": "Dans « Le chien court dans le jardin », quel groupe indique le lieu ?", "choices": ["Le chien", "court", "dans le jardin"], "a": "dans le jardin", "tip": "Où court le chien ?"}, {"type": "c", "q": "Quel groupe peut être déplacé au début : « Les enfants jouent dans la cour » ?", "choices": ["Les enfants", "jouent", "dans la cour"], "a": "dans la cour", "tip": "Quel groupe indique le lieu ?"}, {"type": "i", "q": "Écris le groupe sujet : « Mon frère et moi préparons le goûter. »", "a": "Mon frère et moi", "tip": "Qui prépare le goûter ?"}, {"type": "c", "q": "Dans « Ce matin, Léo dessine un arbre », quel groupe indique quand ?", "choices": ["Ce matin", "Léo", "un arbre"], "a": "Ce matin", "tip": "Quel groupe indique le moment ?"}, {"type": "c", "q": "Quelle phrase conserve son sens si on déplace « dans la cour » ?", "choices": ["Dans la cour, les enfants jouent.", "Les dans la cour enfants jouent.", "Les enfants dans jouent la cour."], "a": "Dans la cour, les enfants jouent.", "tip": "On peut placer le groupe de lieu au début de la phrase."}],title="Les groupes dans la phrase",domain='Grammaire';let idx=0,solved=0;const el=id=>document.getElementById(id),normalize=s=>String(s).toLocaleLowerCase('fr').normalize('NFC').replace(/[’']/g,"'").trim().replace(/\s+/g,' ');function render(){let t=tasks[idx];el('counter').textContent='Question '+(idx+1)+' sur 10';el('question').textContent=t.q;el('feedback').textContent='';el('feedback').className='feedback';el('choices').innerHTML='';el('entryForm').classList.add('hidden');el('next').classList.add('hidden');el('done').classList.add('hidden');el('restart').classList.add('hidden');el('fill').style.width=(solved*10)+'%';el('end').classList.add('hidden');if(t.type==='c'){t.choices.forEach(choice=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=choice;b.addEventListener('click',()=>submit(choice,b));el('choices').append(b)});}else{el('entryForm').classList.remove('hidden');el('entry').value='';el('entry').disabled=false;el('check').disabled=false;el('entry').focus()}}function submit(value,btn){if(solved>idx)return;let t=tasks[idx];if(normalize(value)===normalize(t.a)){solved++;el('feedback').className='feedback good';el('feedback').textContent='✅ Bravo, c’est la bonne réponse !';el('fill').style.width=(solved*10)+'%';el('entry').disabled=true;el('check').disabled=true;el('choices').querySelectorAll('button').forEach(b=>b.disabled=true);if(btn)btn.style.background='#d5f5e3';if(idx===9){el('end').classList.remove('hidden');el('done').classList.remove('hidden');el('restart').classList.remove('hidden')}else el('next').classList.remove('hidden')}else{el('feedback').className='feedback bad';el('feedback').textContent='Essaie encore ! Indice : '+t.tip;if(btn){btn.disabled=true;btn.style.background='#ffe9e5'}}}el('entryForm').addEventListener('submit',e=>{e.preventDefault();submit(el('entry').value,null)});el('next').addEventListener('click',()=>{if(solved!==idx+1)return;idx++;render()});el('restart').addEventListener('click',()=>{idx=0;solved=0;render()});el('done').addEventListener('click',function(){if(solved!==10)return;if(typeof window.HibouLesson==='object'&&typeof window.HibouLesson.complete==='function'){window.HibouLesson.complete({id:"grammaire-groupes-phrase",titre:title,domaine:domain},this)}else{this.textContent='✅ Leçon terminée';this.disabled=true}});render()})();</script></body></html>
