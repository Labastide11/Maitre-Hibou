<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’accord sujet-verbe — Maître Hibou CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#142f50;font-family:system-ui,Arial,sans-serif}main{width:100%;padding:clamp(6px,1vw,14px)}a.back{display:inline-block;background:white;padding:10px 14px;border-radius:12px;margin-bottom:10px;color:#165c92;font-weight:800;text-decoration:none}.poster{display:block;width:100%;height:auto;max-height:none;border-radius:16px}.practice{width:100%;background:white;border-radius:18px;padding:clamp(15px,2vw,28px);margin:15px 0}h2{margin:0 0 6px}.muted{color:#4e6887}.progress{height:12px;border-radius:8px;background:#e2eaf2;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#21a16e}.question{font-size:clamp(21px,2.3vw,30px);font-weight:750;margin:16px 0}.choices{display:flex;gap:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 20px;min-height:48px;font-size:17px;font-weight:750;cursor:pointer}.option{background:#e8f3ff;border:2px solid #abc9e4;color:#143e69}.option:disabled{opacity:.65}.entry{padding:12px 15px;border-radius:10px;border:2px solid #abc9e4;font-size:19px;width:min(100%,340px)}.check{background:#176fa6;color:white}.next,.finish{background:#148058;color:white}.feedback{min-height:32px;margin-top:12px;font-weight:750}.bad{color:#a14022}.good{color:#11784c}.hidden{display:none!important}.counter{font-weight:750;color:#47698c}.end{padding:16px;background:#e2f6e7;border-radius:12px;margin:10px 0}button:focus-visible,input:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><main><a class="back" href="../index.html">← Mes leçons de français</a><img class="poster" src="../../images-lecons/francais/maitre-hibou-accord-sujet-verbe.png" alt="Affiche pédagogique : L’accord sujet-verbe"><section class="practice"><h2>À toi de jouer !</h2><p class="muted">10 exercices : vérifie ta réponse et corrige si besoin.</p><div class="progress"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><form id="inputForm"><input id="answer" class="entry" autocomplete="off" aria-label="Ta réponse" required><button class="check" id="check" type="submit">Vérifier</button></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next hidden" id="next">Question suivante →</button><div class="end hidden" id="end">Bravo, tu as réussi les dix exercices !</div><button class="finish hidden" id="finish">J’ai compris cette leçon</button></section></main><script src="../js/hibou-lecons.js"></script><script>(()=>{'use strict';const tasks=[{"type": "choice", "q": "Complète : Le chat …", "choices": ["mange", "mangent", "mangeons"], "a": "mange", "tip": "Un chat : il mange."}, {"type": "choice", "q": "Complète : Les chats …", "choices": ["mange", "mangent", "manges"], "a": "mangent", "tip": "Plusieurs chats : ils mangent."}, {"type": "input", "q": "Écris le verbe : Je … (jouer).", "a": "joue", "tip": "Avec je, jouer se termine par e."}, {"type": "input", "q": "Écris le verbe : Nous … (jouer).", "a": "jouons", "tip": "Avec nous, jouer se termine par ons."}, {"type": "choice", "q": "Quel est le sujet de « Les enfants chantent. » ?", "choices": ["chantent", "Les enfants", "enfants chantent"], "a": "Les enfants", "tip": "Qui chantent ?"}, {"type": "input", "q": "Écris le verbe : Tu … (chanter).", "a": "chantes", "tip": "Avec tu, on ajoute souvent un s."}, {"type": "choice", "q": "Choisis la phrase correcte.", "choices": ["Les filles danse.", "Les filles dansent.", "Les filles danses."], "a": "Les filles dansent.", "tip": "Les filles = elles."}, {"type": "input", "q": "Écris le verbe : Ils … (marcher).", "a": "marchent", "tip": "Avec ils, la terminaison est ent."}, {"type": "choice", "q": "Quel sujet convient : … jouons.", "choices": ["Je", "Nous", "Ils"], "a": "Nous", "tip": "La terminaison ons correspond à nous."}, {"type": "input", "q": "Écris le verbe : La petite fille … (dessiner).", "a": "dessine", "tip": "La petite fille = elle."}];const $=id=>document.getElementById(id);let index=0,completed=0;function normalize(x){return String(x).trim().toLocaleLowerCase('fr').normalize('NFC').replace(/\s+/g,' ')}function draw(){const t=tasks[index];$('counter').textContent=`Exercice ${index+1} sur 10`;$('question').textContent=t.q;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('end').classList.add('hidden');$('finish').classList.add('hidden');$('fill').style.width=(completed*10)+'%';$('inputForm').classList.toggle('hidden',t.type==='choice');$('choices').classList.toggle('hidden',t.type!=='choice');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('choices').replaceChildren();if(t.type==='choice')for(const answer of t.choices){const b=document.createElement('button');b.type='button';b.className='option';b.textContent=answer;b.onclick=()=>verify(answer,b);$('choices').append(b)}}function verify(value,button){const t=tasks[index];if(normalize(value)===normalize(t.a)){completed++;$('feedback').textContent='✅ Bravo !';$('feedback').className='feedback good';$('fill').style.width=completed*10+'%';if(t.type==='choice')for(const b of $('choices').children)b.disabled=true;else{$('answer').disabled=true;$('check').disabled=true}if(index===9){$('end').classList.remove('hidden');$('finish').classList.remove('hidden')}else $('next').classList.remove('hidden')}else{$('feedback').textContent='Essaie encore. Indice : '+t.tip;$('feedback').className='feedback bad';if(button){button.disabled=true;button.style.background='#ffe5e5'}}}$('inputForm').onsubmit=e=>{e.preventDefault();verify($('answer').value)};$('next').onclick=()=>{if(completed!==index+1)return;index++;draw()};$('finish').onclick=function(){if(completed!==10)return;try{if(window.HibouLesson&&typeof window.HibouLesson.complete==='function'){window.HibouLesson.complete({titre:"L’accord sujet-verbe",domaine:'Orthographe'},this);return}}catch(e){console.warn(e)}this.textContent='✅ Leçon terminée';this.disabled=true};draw()})();</script></body></html>
