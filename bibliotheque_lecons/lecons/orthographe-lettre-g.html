<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La lettre G — Maître Hibou CE2</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5fc;font-family:system-ui,Arial,sans-serif;color:#153253}
main{width:100%;max-width:none;padding:clamp(6px,1vw,14px)}
.back{display:inline-block;padding:10px 14px;margin:2px 0 10px;background:white;border-radius:12px;color:#145986;font-weight:800;text-decoration:none}
.lesson-image{display:block;width:100%;height:auto;max-width:none;max-height:none;object-fit:contain;border-radius:16px}
.practice{width:100%;max-width:none;margin:14px 0;background:white;border-radius:18px;padding:clamp(15px,2vw,28px);box-shadow:0 4px 18px #2139561c}
h2{margin:0}.desc{color:#58708c}.bar{height:12px;border-radius:50px;background:#dce8f2;margin:18px 0;overflow:hidden}.fill{height:100%;background:#23a473;width:0;transition:width .2s}
.question{font-size:clamp(20px,2.3vw,30px);font-weight:800;margin:12px 0 18px}.counter{font-weight:800;color:#4b6e91}.sub{color:#58708c;margin-top:-8px;margin-bottom:12px}
.answers{display:flex;gap:12px;flex-wrap:wrap}.choice,.check,.next,.done,.restart{border:0;border-radius:12px;min-height:48px;padding:12px 17px;font-size:17px;font-weight:800;cursor:pointer}
.choice{background:#e8f4ff;color:#17395f;border:2px solid #b2d2ed}.choice:disabled{cursor:default;opacity:.85}.entry{padding:13px 15px;min-height:48px;font-size:19px;border-radius:12px;border:2px solid #aec7df;max-width:100%;min-width:230px}
.check{background:#276fa6;color:white}.next,.done{background:#198259;color:white}.restart{background:#e3edf7;color:#174a70}.feedback{font-weight:750;margin:14px 0;min-height:27px}.feedback.bad{color:#b44725}.feedback.good{color:#13814e}.hidden{display:none!important}
.result{margin-top:16px;padding:14px;border-radius:14px;background:#e4f7eb}.tip{margin-top:14px;padding:12px 14px;border-left:4px solid #e4ae35;background:#fff8e8;border-radius:10px;color:#35516b}
button:focus-visible,input:focus-visible{outline:3px solid #efb03e;outline-offset:3px}
@media(max-width:700px){.entry{min-width:150px;width:100%}}
</style></head><body><main><a class="back" href="../index.html">← Mes leçons de français</a><img class="lesson-image" src="../../images-lecons/francais/maitre-hibou-lettre-g.png" alt="Leçon illustrée : La lettre G"><section class="practice"><h2>À toi de jouer !</h2><p class="desc">10 exercices interactifs. Vérifie ta réponse avant de passer à la suivante.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="sub" class="sub"></div><div id="choices" class="answers hidden"></div><form id="form" class="answers"><input id="entry" class="entry" type="text" autocomplete="off"><button id="check" class="check" type="submit">Vérifier</button></form><div id="feedback" class="feedback"></div><button id="next" class="next hidden" type="button">Question suivante →</button><div id="result" class="result hidden"><strong>Bravo !</strong> Tu as réussi les 10 questions.</div><button id="done" class="done hidden" type="button">✅ J’ai compris cette leçon</button><button id="restart" class="restart hidden" type="button">Recommencer</button><div class="tip">Je regarde la lettre qui vient après g pour choisir g, ge ou gu.</div></section></main><script>(function(){const tasks=[{"type": "choice", "q": "Dans quel mot la lettre g fait le son [g] ?", "choices": ["girafe", "gare", "genou"], "a": "gare", "tip": "Devant a, o, u, g fait [g].", "ok": "Oui, dans “gare”, g fait [g]."}, {"type": "choice", "q": "Pour garder le son [g] devant e ou i, on écrit…", "choices": ["ge", "gu", "gi"], "a": "gu", "tip": "Pense à guitare.", "ok": "Oui, on écrit “gu”."}, {"type": "choice", "q": "Dans quel mot g fait le son [j] ?", "choices": ["gomme", "orangeade", "guide"], "a": "orangeade", "tip": "Devant e, i, y, g fait souvent [j]. Ici regarde ge.", "ok": "Oui, dans “orangeade”, ge fait [j]."}, {"type": "input", "q": "Complète : gui___are", "a": "t", "tip": "Pense au mot “guitare”.", "ok": "Oui : guitare."}, {"type": "choice", "q": "Quelle écriture est correcte ?", "choices": ["girafe", "guirafe", "gerafe"], "a": "girafe", "tip": "Le son [j] devant i s’écrit g.", "ok": "Oui, on écrit “girafe”."}, {"type": "input", "q": "Complète avec g ou gu : ___ide", "a": ["gu", "GU"], "tip": "Devant i, pour entendre [g], il faut ajouter un u.", "ok": "Oui : guide."}, {"type": "choice", "q": "Dans quel mot entend-on [g] ?", "choices": ["géant", "goûter", "gilet"], "a": "goûter", "tip": "Regarde la lettre après g.", "ok": "Oui, dans “goûter”, g fait [g]."}, {"type": "input", "q": "Complète avec ge ou gu : oran___ade", "a": ["ge", "GE"], "tip": "On veut entendre [j].", "ok": "Oui : orangeade."}, {"type": "choice", "q": "Quel mot est bien écrit ?", "choices": ["guenou", "genou", "gueno"], "a": "genou", "tip": "Devant e, g fait déjà [j], mais ici on veut [ʒ] : genou.", "ok": "Oui, on écrit “genou”."}, {"type": "choice", "q": "La bonne règle est :", "choices": ["g fait [g] devant a, o, u", "g fait [j] devant a, o, u", "gu fait [j] devant e, i"], "a": "g fait [g] devant a, o, u", "tip": "C’est la règle de base.", "ok": "Oui, c’est la bonne règle."}];const $=id=>document.getElementById(id);let i=0,ok=0;function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim();}function render(){const t=tasks[i];$('counter').textContent='Exercice '+(i+1)+' sur 10';$('question').textContent=t.q;$('sub').textContent=t.sub||'';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('entry').value='';$('entry').disabled=false;$('check').disabled=false;$('result').classList.add('hidden');$('done').classList.add('hidden');$('restart').classList.add('hidden');$('fill').style.width=(ok*10)+'%';if(t.type==='choice'){$('form').classList.add('hidden');$('choices').classList.remove('hidden');$('choices').innerHTML='';t.choices.forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=ch;b.onclick=()=>checkChoice(ch,b);$('choices').appendChild(b);});}else{$('choices').classList.add('hidden');$('choices').innerHTML='';$('form').classList.remove('hidden');$('entry').focus();}}function success(msg){$('feedback').textContent='✅ '+msg;$('feedback').className='feedback good';ok++;$('fill').style.width=(ok*10)+'%';if(i===tasks.length-1){$('result').classList.remove('hidden');$('done').classList.remove('hidden');$('restart').classList.remove('hidden');}else $('next').classList.remove('hidden');}function fail(msg){$('feedback').textContent='Essaie encore. Indice : '+msg;$('feedback').className='feedback bad';}function checkChoice(ch,btn){const t=tasks[i];if(norm(ch)===norm(t.a)){Array.from($('choices').children).forEach(x=>x.disabled=true);btn.style.background='#d8f5e2';success(t.ok||'Bonne réponse !');}else{btn.disabled=true;btn.style.background='#ffe0df';fail(t.tip||'Regarde bien la règle.');}}$('form').onsubmit=function(e){e.preventDefault();const t=tasks[i];const answers=(Array.isArray(t.a)?t.a:[t.a]).map(norm);if(answers.includes(norm($('entry').value))){$('entry').disabled=true;$('check').disabled=true;success(t.ok||'Bonne réponse !');}else fail(t.tip||'Regarde bien la règle.');};$('next').onclick=function(){if(ok!==i+1)return;i++;render();};$('restart').onclick=function(){i=0;ok=0;render();};$('done').onclick=function(){this.textContent='✅ Leçon terminée';this.disabled=true;};render();})();</script></body></html>
