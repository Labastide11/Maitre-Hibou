<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le déterminant — Maître Hibou CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf2fa;color:#123251;font-family:system-ui,Arial,sans-serif}main{width:100%;max-width:none;padding:clamp(7px,1vw,14px)}nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 10px}nav a{color:#125984;background:#fff;border-radius:10px;padding:10px;text-decoration:none;font-weight:750}nav span{font-weight:750}.poster{display:block;width:100%;height:auto;max-height:none;object-fit:contain;border-radius:16px;box-shadow:0 6px 26px #0002}.practice{width:100%;max-width:none;background:#fff;border-radius:16px;margin-top:14px;padding:clamp(15px,3vw,34px);box-shadow:0 5px 18px #0001}h1{font-size:clamp(22px,3vw,32px);margin:0}p{line-height:1.45}.bar{height:13px;background:#e1e9f0;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#24985a;width:0;transition:width .2s}.count{font-weight:800;color:#3d6383}.question{font-size:clamp(20px,2.7vw,28px);font-weight:750;margin:16px 0}.answers{display:flex;flex-wrap:wrap;gap:12px}.answers button{background:#e5f3ff;color:#123251;border:2px solid #a8cfeb}.answers button,.check,.next,.done,.restart{font:inherit;font-weight:760;border-radius:12px;padding:13px 20px;min-height:52px;cursor:pointer}.inputline{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.inputline input{border:2px solid #9eb7d0;border-radius:10px;padding:12px 14px;font-size:22px;max-width:100%}.check{background:#126ca1;color:#fff;border:0}.next,.done{background:#20814e;color:white;border:0}.restart{background:#e8eff7;color:#153453;border:0}.feedback{min-height:35px;margin:16px 0;font-weight:750}.bad{color:#a04423}.good{color:#16834f}.hidden{display:none!important}.donepanel{background:#e5f8ee;border-radius:14px;padding:22px}button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #edb536;outline-offset:2px}@media(max-width:650px){main{padding:5px}.practice{padding:14px}.inputline input{width:170px}}</style></head><body><main><nav><a href="../index.html">← Mes leçons de français</a><span>Grammaire · CE2</span></nav><img class="poster" src="../../images-lecons/francais/maitre-hibou-determinant.png" alt="Affiche pédagogique : Le déterminant"><section class="practice"><h1>À toi de jouer !</h1><p>Réponds aux 10 questions. Si tu te trompes, lis l'indice et réessaie. Tu passes à la question suivante après une bonne réponse.</p><div class="bar"><div class="fill" id="fill"></div></div><div class="count" id="count"></div><div class="question" id="question"></div><div class="answers hidden" id="choices"></div><form class="inputline hidden" id="inputbox"><label for="answer">Ta réponse :</label><input id="answer" autocomplete="off" required><button class="check" id="check" type="submit">Vérifier</button></form><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button class="next hidden" id="next">Question suivante →</button><div class="donepanel hidden" id="donepanel"><h2>Bravo, 10 réponses réussies !</h2><p>Tu peux maintenant valider la leçon.</p><button id="done" class="done">✅ J’ai compris cette leçon</button><button id="restart" class="restart">Recommencer</button></div></section></main><script src="../js/hibou-lecons.js"></script><script>(()=>{'use strict';const tasks=[{"type": "choice", "q": "Quel est le déterminant dans « Le chat dort. » ?", "options": ["Le", "chat", "dort"], "a": "Le", "h": "Il est placé devant chat."}, {"type": "choice", "q": "Quel groupe commence par un déterminant ?", "options": ["petit chien", "une maison", "court vite"], "a": "une maison", "h": "Un déterminant accompagne un nom."}, {"type": "input", "q": "Écris le déterminant dans « Des oiseaux chantent. ».", "a": "Des", "h": "Il précède oiseaux."}, {"type": "choice", "q": "Quel déterminant convient : « ... fleur » ?", "options": ["le", "la", "les"], "a": "la", "h": "Fleur est féminin et singulier."}, {"type": "choice", "q": "Quel déterminant convient : « ... crayons » ?", "options": ["un", "une", "des"], "a": "des", "h": "Crayons est pluriel."}, {"type": "input", "q": "Complète : « ... chien » (masculin, singulier).", "a": "un", "h": "Tu peux dire un chien."}, {"type": "choice", "q": "Quel déterminant correspond au pluriel de « le » ?", "options": ["les", "la", "une"], "a": "les", "h": "Le pluriel de le est les."}, {"type": "input", "q": "Écris le déterminant dans « Mon vélo roule. ».", "a": "Mon", "h": "Il est placé devant vélo."}, {"type": "choice", "q": "Quel mot est un déterminant possessif ?", "options": ["ma", "jolie", "maison"], "a": "ma", "h": "Ma accompagne un nom."}, {"type": "input", "q": "Écris le déterminant dans « Une étoile brille. ».", "a": "Une", "h": "Il est juste devant étoile."}],el=id=>document.getElementById(id);let i=0,passed=0;function norm(s){return String(s).trim().toLocaleLowerCase('fr').replace(/\s+/g,' ').normalize('NFC')}function render(){let t=tasks[i];el('count').textContent=`Question ${i+1} / 10`;el('question').textContent=t.q;el('fill').style.width=`${passed*10}%`;el('feedback').textContent='';el('feedback').className='feedback';el('next').classList.add('hidden');el('donepanel').classList.add('hidden');el('choices').innerHTML='';el('inputbox').classList.add('hidden');el('choices').classList.add('hidden');el('answer').value='';el('answer').disabled=false;el('check').disabled=false;if(t.type==='choice'){el('choices').classList.remove('hidden');for(const answer of t.options){let b=document.createElement('button');b.type='button';b.textContent=answer;b.addEventListener('click',()=>verify(answer));el('choices').append(b)}}else{el('inputbox').classList.remove('hidden');el('answer').focus()}}function verify(answer){let t=tasks[i];if(passed!==i)return;if(norm(answer)===norm(t.a)){passed++;el('feedback').textContent='✅ Bravo ! Bonne réponse.';el('feedback').className='feedback good';el('fill').style.width=`${passed*10}%`;el('choices').querySelectorAll('button').forEach(x=>x.disabled=true);el('answer').disabled=true;el('check').disabled=true;if(i===9){el('donepanel').classList.remove('hidden')}else{el('next').classList.remove('hidden')}}else{el('feedback').textContent='💡 Essaie encore : '+t.h;el('feedback').className='feedback bad'}}el('inputbox').addEventListener('submit',event=>{event.preventDefault();verify(el('answer').value)});el('next').addEventListener('click',()=>{if(passed!==i+1)return;i++;render()});el('restart').addEventListener('click',()=>{i=0;passed=0;el('done').disabled=false;el('done').textContent='✅ J’ai compris cette leçon';render()});el('done').addEventListener('click',function(){if(passed!==10)return;try{if(window.HibouLesson&&typeof window.HibouLesson.complete==='function'){window.HibouLesson.complete({id:"grammaire-determinant",titre:"Le déterminant",domaine:'Grammaire'},this);return}}catch(e){console.warn(e)}this.disabled=true;this.textContent='✅ Leçon terminée'});render()})()</script></body></html>
