<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les formes de phrases — Maître Hibou</title><style>*{box-sizing:border-box}html,body{margin:0;background:#edf4fc;font-family:system-ui,-apple-system,Arial,sans-serif;color:#16304e}main{width:100%;max-width:none;margin:auto;padding:clamp(5px,1vw,14px)}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px;gap:10px;font-weight:750}.top a{color:#1b527c;background:#fff;border-radius:11px;padding:9px 13px;text-decoration:none}.lesson-image{display:block;width:100%;max-width:100%;max-height:none;height:auto;border-radius:15px;box-shadow:0 5px 18px #24456223}.practice{width:100%;max-width:none;background:white;padding:clamp(18px,3vw,35px);margin:16px auto 28px;border-radius:18px;box-shadow:0 5px 20px #24456222}.practice h2{margin:0 0 8px;color:#154a72;font-size:clamp(23px,3vw,34px)}.detail{color:#416782}.progress{background:#e4edf5;height:12px;border-radius:15px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#23875d;transition:width .2s}.counter{font-weight:800;color:#245c7e}.prompt{font-size:clamp(20px,2.3vw,29px);font-weight:780;margin:15px 0 18px;line-height:1.4}.choices{display:flex;flex-wrap:wrap;gap:12px}.choice{font:700 18px system-ui;min-height:51px;border-radius:13px;padding:12px 17px;border:2px solid #a7c8e2;background:#edf7ff;color:#163a58;cursor:pointer}.choice.wrong{background:#fff0ed;border-color:#e89383}.choice:disabled{cursor:default}.input-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input-line input{min-width:200px;max-width:100%;padding:14px;font-size:19px;border:2px solid #9bbcd4;border-radius:12px}.primary,.next,.finish,.reset{font:800 17px system-ui;min-height:50px;border:0;padding:11px 19px;border-radius:12px;cursor:pointer}.primary{background:#136b99;color:white}.next,.finish{background:#187b4e;color:white}.reset{background:#e8f1f7;color:#173e56}.feedback{min-height:38px;margin:16px 0;font-size:18px;font-weight:720}.feedback.error{color:#9b3d1e}.feedback.success{color:#16734c}.hidden{display:none!important}.complete{background:#e5f6e8;border-radius:12px;padding:16px 20px;font-size:20px;font-weight:800}.hintbox{margin-top:15px;background:#fff8e9;border-left:4px solid #e3b143;padding:12px;border-radius:8px;color:#36516c}.done-area{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ea991f;outline-offset:2px}@media(max-width:600px){.choice{width:100%}.top{font-size:13px}.input-line input{width:100%}}</style></head><body><main><nav class="top"><a href="../index.html">← Mes leçons de français</a><span>CE2 · Grammaire</span></nav><img class="lesson-image" src="../../images-lecons/francais/maitre-hibou-formes-phrases.png" alt="Affiche Maître Hibou : Les formes de phrases"><section class="practice"><h2>À toi de jouer !</h2><p class="detail">10 questions interactives. Tu avances lorsque ta réponse est juste.</p><div class="progress"><div id="bar" class="fill"></div></div><div id="activity"><div id="count" class="counter"></div><div class="prompt" id="question"></div><div id="choices" class="choices"></div><form id="form" class="input-line"><div id="inputRow" class="input-line hidden"><label for="entry">Ta réponse :</label><input id="entry" aria-label="Ta réponse" autocomplete="off"><button id="check" class="primary" type="submit">Vérifier</button></div></form><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button class="next hidden" id="next" type="button">Question suivante →</button></div><div id="end" class="hidden"><div class="complete">Bravo ! Tu as réussi les 10 questions.</div><div class="done-area"><button class="finish" id="done" type="button">✅ J’ai compris cette leçon</button><button class="reset" id="retry" type="button">Recommencer</button></div></div><div class="hintbox">Conseil de Maître Hibou : relis l’affiche en haut de la page si tu as un doute.</div></section></main><script src="../js/hibou-lecons.js"></script><script>(function(){"use strict";const tasks=[["choice", "« Le chat dort. » est une phrase…", ["affirmative", "négative"], "affirmative", "Elle affirme quelque chose."], ["choice", "« Le chat ne dort pas. » est une phrase…", ["affirmative", "négative"], "négative", "Observe « ne…pas »."], ["choice", "Quels mots servent souvent à former une négation ?", ["et…ou", "ne…pas", "plus…moins"], "ne…pas", "Ils entourent souvent le verbe."], ["input", "Transforme « Je chante. » à la forme négative.", null, "Je ne chante pas.", "Entoure « chante » avec « ne » et « pas »."], ["choice", "Quelle phrase est affirmative ?", ["Elle ne joue pas.", "Elle joue.", "Elle ne joue jamais."], "Elle joue.", "Elle ne contient pas de négation."], ["choice", "Quelle phrase est négative ?", ["Il aime lire.", "Il joue souvent.", "Il n’aime pas lire."], "Il n’aime pas lire.", "Cherche les mots de négation."], ["input", "Transforme « Nous parlons. » à la forme négative.", null, "Nous ne parlons pas.", "Place « ne » avant le verbe et « pas » après."], ["choice", "Quelle est la forme affirmative de « Tu ne cours pas. » ?", ["Tu cours.", "Tu ne cours jamais.", "Cours-tu ?"], "Tu cours.", "Supprime les mots de négation."], ["choice", "Quelle phrase contient la négation « ne…plus » ?", ["Je joue toujours.", "Je ne joue plus.", "Je ne joue pas."], "Je ne joue plus.", "Repère le second mot de la négation."], ["input", "Transforme « Elle ne danse pas. » à la forme affirmative.", null, "Elle danse.", "Enlève « ne » et « pas »."]];let index=0,solved=0;const el=id=>document.getElementById(id);const normalize=s=>String(s).normalize('NFC').toLocaleLowerCase('fr').trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'').replace(/’/g,"'");function render(){const t=tasks[index];el('count').textContent=`Question ${index+1} sur 10`;el('question').textContent=t[1];el('bar').style.width=`${solved*10}%`;el('feedback').textContent='';el('feedback').className='feedback';el('next').classList.add('hidden');el('choices').replaceChildren();el('inputRow').classList.add('hidden');el('choices').classList.add('hidden');if(t[0]==='choice'){el('choices').classList.remove('hidden');t[2].forEach(option=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=option;b.onclick=()=>answer(option,b);el('choices').append(b);});}else{el('inputRow').classList.remove('hidden');el('entry').value='';el('entry').disabled=false;el('check').disabled=false;}}function success(){solved++;el('bar').style.width=`${solved*10}%`;el('feedback').className='feedback success';el('feedback').textContent='Bravo, c’est juste !';if(index===9){el('activity').classList.add('hidden');el('end').classList.remove('hidden');}else el('next').classList.remove('hidden');}function answer(val,btn){const t=tasks[index];if(solved!==index)return;if(normalize(val)===normalize(t[3])){if(t[0]==='choice')el('choices').querySelectorAll('button').forEach(b=>b.disabled=true);else{el('entry').disabled=true;el('check').disabled=true;}success();}else{el('feedback').className='feedback error';el('feedback').textContent='Essaie encore ! Indice : '+t[4];if(btn){btn.classList.add('wrong');btn.disabled=true;}}}el('form').onsubmit=e=>{e.preventDefault();if(el('entry').value.trim())answer(el('entry').value)};el('next').onclick=()=>{if(solved===index+1){index++;render();}};el('retry').onclick=()=>{index=0;solved=0;el('end').classList.add('hidden');el('activity').classList.remove('hidden');render();};el('done').onclick=function(){if(solved!==10)return;try{if(window.HibouLesson&&typeof window.HibouLesson.complete==='function'){window.HibouLesson.complete({id:"grammaire-formes-phrases",titre:"Les formes de phrases",domaine:'Grammaire'},this);return;}}catch(err){console.warn(err)}this.textContent='✅ Leçon terminée';this.disabled=true;};render();})();</script></body></html>
