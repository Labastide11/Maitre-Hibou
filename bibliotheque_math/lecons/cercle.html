<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le cercle — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fa;color:#143152;font:18px system-ui,Arial}main{width:min(1400px,100%);padding:12px;margin:auto}nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}nav a{background:#fff;border-radius:12px;padding:10px 15px;text-decoration:none;color:#164d84;font-weight:800}.poster{display:block;width:100%;height:auto;object-fit:contain;border-radius:18px;max-height:calc(100dvh - 92px);background:white}.practice{width:100%;border-radius:18px;background:white;margin:14px 0 24px;padding:clamp(16px,2.5vw,32px);box-shadow:0 3px 15px #2343a01a}.practice h2{margin:0 0 8px}.progress{height:10px;background:#e4edf5;border-radius:10px;overflow:hidden;margin:18px 0}.progress>div{width:0;height:100%;background:#23865b;transition:width .15s}#counter{color:#466889;font-weight:800}#question{font-weight:800;font-size:clamp(1.15rem,2.3vw,1.6rem);margin:14px 0}.visual{display:flex;align-items:center;justify-content:center;background:#f1f7fc;border:1px solid #bed3e9;border-radius:16px;padding:12px;min-height:215px;margin:14px 0}.visual svg{width:min(100%,560px);height:220px}.options{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.option,.primary{border-radius:12px;min-height:48px;padding:11px 17px;font:800 1rem system-ui;cursor:pointer}.option{background:#ecf5ff;border:2px solid #abcae6;color:#173651}.option.selected{background:#cce9ff;border-color:#1167a5}.option.correct{background:#d2f4df;border-color:#23865b}.option.wrong{background:#ffe1df;border-color:#b54b38}.primary{background:#1773a9;color:white;border:none}.green{background:#218158}button:disabled{opacity:.67;cursor:default}.feedback{min-height:35px;font-weight:750;margin:12px 0;line-height:1.45}.feedback.ok{color:#117444}.feedback.no{color:#9f4127}[hidden]{display:none!important}button:focus-visible{outline:4px solid #edb548;outline-offset:2px}@media(max-width:600px){main{padding:6px}.practice{padding:14px}.visual svg{height:178px}.poster{max-height:none}nav{font-size:14px}}</style></head><body><main><nav><a href="../index.html">← Mes leçons de maths</a><strong>Géométrie CE2</strong></nav><img class="poster" src="../../images-lecons/maths/maitre-hibou-cercle.png" alt="Leçon illustrée : Le cercle"><section class="practice"><h2>À toi de jouer !</h2><p>Observe les dessins puis réponds aux 10 questions. Vérifie avant de continuer.</p><div class="progress"><div id="fill"></div></div><div id="counter"></div><div id="question"></div><div id="visual" class="visual"></div><div id="options" class="options"></div><button class="primary" id="verify" type="button">Vérifier</button><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary green" type="button" hidden>Exercice suivant →</button><button id="done" class="primary green" type="button" hidden>✅ J’ai compris cette leçon</button><button id="restart" class="primary" type="button" hidden>Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>(()=>{const tasks=[{"q": "Quel point indique le centre du cercle ?", "a": "Le point rouge au milieu", "opts": ["Le point rouge au milieu", "Le bord du cercle", "Un sommet"], "tip": "Le centre est au milieu du cercle.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><text x=\"180\" y=\"100\" font-size=\"20\" fill=\"#154577\">O</text></svg>"}, {"q": "Le segment coloré est un…", "a": "Rayon", "opts": ["Rayon", "Diamètre", "Côté"], "tip": "Il part du centre et va jusqu’au cercle.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><path d=\"M170 108 L252 108\" stroke=\"#e84a70\" stroke-width=\"5\"/><text x=\"190\" y=\"99\" font-size=\"17\" fill=\"#154577\">r</text></svg>"}, {"q": "Le segment coloré est un…", "a": "Diamètre", "opts": ["Diamètre", "Rayon", "Côté"], "tip": "Il joint deux points du cercle en passant par le centre.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><path d=\"M88 108 H252\" stroke=\"#e84a70\" stroke-width=\"5\"/><text x=\"200\" y=\"99\" font-size=\"17\" fill=\"#154577\">d</text></svg>"}, {"q": "Le point A est-il à l’intérieur du cercle ?", "a": "Non", "opts": ["Oui", "Non"], "tip": "Il est à l’extérieur.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><circle cx=\"290\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><text x=\"296\" y=\"97\" font-size=\"19\">A</text></svg>"}, {"q": "Où se trouve le point C ?", "a": "Sur le cercle", "opts": ["Sur le cercle", "Au centre", "À l’extérieur"], "tip": "Le point est sur le trait qui forme le cercle.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><circle cx=\"170\" cy=\"26\" r=\"6\" fill=\"#e34b7f\"/><text x=\"181\" y=\"24\" font-size=\"19\">C</text></svg>"}, {"q": "Le point B est-il à l’intérieur du cercle ?", "a": "Oui", "opts": ["Oui", "Non"], "tip": "Il est dans la région entourée par le cercle.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><circle cx=\"200\" cy=\"125\" r=\"6\" fill=\"#e34b7f\"/><text x=\"210\" y=\"145\" font-size=\"19\">B</text></svg>"}, {"q": "Combien de rayons colorés vois-tu ?", "a": "2", "opts": ["1", "2", "3"], "tip": "Compte les segments du centre vers le bord.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><path d=\"M170 108 L252 108 M170 108 L170 26\" stroke=\"#e84a70\" stroke-width=\"5\"/></svg>"}, {"q": "Le segment coloré passe-t-il par le centre ?", "a": "Non", "opts": ["Oui", "Non"], "tip": "Regarde la position du point rouge.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><path d=\"M112 50 L228 50\" stroke=\"#e84a70\" stroke-width=\"5\"/></svg>"}, {"q": "Un diamètre mesure combien de fois un rayon ?", "a": "Deux fois", "opts": ["Deux fois", "Une fois", "Trois fois"], "tip": "Un diamètre est constitué de deux rayons.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><path d=\"M88 108 H252\" stroke=\"#e84a70\" stroke-width=\"5\"/><text x=\"200\" y=\"99\" font-size=\"17\" fill=\"#154577\">d</text></svg>"}, {"q": "Un rayon va du centre jusqu’à…", "a": "Un point du cercle", "opts": ["Un point du cercle", "Un autre centre", "L’extérieur uniquement"], "tip": "Observe ses deux extrémités.", "visual": "<svg viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"Schéma du cercle\"><circle cx=\"170\" cy=\"108\" r=\"82\" fill=\"#e5f5ff\" stroke=\"#1869af\" stroke-width=\"4\"/><circle cx=\"170\" cy=\"108\" r=\"6\" fill=\"#e34b7f\"/><path d=\"M170 108 L252 108\" stroke=\"#e84a70\" stroke-width=\"5\"/><text x=\"190\" y=\"99\" font-size=\"17\" fill=\"#154577\">r</text></svg>"}];let i=0,passed=0,choice=null;const $=id=>document.getElementById(id);function render(){let t=tasks[i];$('counter').textContent='Exercice '+(i+1)+' sur 10';$('question').textContent=t.q;$('visual').innerHTML=t.visual;$('fill').style.width=(passed*10)+'%';$('options').replaceChildren();choice=null;for(let option of t.opts){let b=document.createElement('button');b.type='button';b.className='option';b.textContent=option;b.onclick=()=>{choice=option;for(let old of $('options').children)old.classList.remove('selected');b.classList.add('selected')};$('options').appendChild(b)}$('verify').hidden=false;$('next').hidden=true;$('done').hidden=true;$('restart').hidden=true;$('feedback').className='feedback';$('feedback').textContent=''}$('verify').onclick=()=>{let t=tasks[i];if(choice===null){$('feedback').textContent='Choisis une réponse.';return}if(choice===t.a){passed++;$('fill').style.width=(passed*10)+'%';$('feedback').className='feedback ok';$('feedback').textContent='Bravo ! Bonne réponse.';$('verify').hidden=true;for(let b of $('options').children){b.disabled=true;if(b.textContent===choice)b.classList.add('correct')}if(i===9){$('done').hidden=false;$('restart').hidden=false}else $('next').hidden=false}else{$('feedback').className='feedback no';$('feedback').textContent='Essaie encore. Indice : '+t.tip;for(let b of $('options').children)if(b.textContent===choice)b.classList.add('wrong')}};$('next').onclick=()=>{if(passed!==i+1)return;i++;render()};$('restart').onclick=()=>{i=0;passed=0;render()};$('done').onclick=function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof window.HibouMathLesson.complete==='function')window.HibouMathLesson.complete({titre:"Le cercle",domaine:'Géométrie'},this);else{this.textContent='✅ Leçon terminée';this.disabled=true}};render()})();</script></body></html>
