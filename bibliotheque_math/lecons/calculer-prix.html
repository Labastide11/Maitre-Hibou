<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculer avec des prix — Maître Hibou</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}
main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.toolbar a{background:white;color:#154875;text-decoration:none;font-weight:800;padding:10px 15px;border-radius:12px}.toolbar span{font-weight:800}
.lesson-image{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:white;border-radius:18px;box-shadow:0 4px 18px #17304f20}
.practice{width:100%;margin:14px 0 28px;padding:clamp(16px,2.3vw,32px);border-radius:18px;background:white;box-shadow:0 3px 15px #17304f15}
.practice h2{margin:0 0 5px}.hint{color:#48647f}.bar{height:10px;border-radius:12px;background:#e3ecf3;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#247e5b;transition:width .2s}
.counter{font-weight:800;color:#41658a}.question{font-size:clamp(1.25rem,2vw,1.65rem);font-weight:800;margin:15px 0}.subquestion{font-size:1rem;color:#4d6f8f;margin-top:-8px;margin-bottom:12px;line-height:1.45}
.reply{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reply input{padding:13px;font-size:1.2rem;border:2px solid #a4bdd7;border-radius:12px;width:180px;max-width:100%}
.reply button,.next,.done,.restart,.choicebtn{min-height:48px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer}
.reply button{background:#17659d;color:white}.reply button:disabled{opacity:.5}.next,.done{background:#187552;color:white}.restart{background:#edf3fa;color:#154875}
.feedback{font-weight:750;min-height:2rem;margin:12px 0;line-height:1.4}.feedback.bad{color:#a1441f}.feedback.good{color:#147243}
.next,.done,.restart,.result,.reply.hidden,#choices.hidden{display:none}.visible{display:inline-block}.result.visible{display:block;padding:14px;border-radius:12px;background:#e4f7eb;margin:16px 0}
#choices{display:flex;gap:10px;flex-wrap:wrap}.choicebtn{background:#ebf5ff;color:#17304f;border:2px solid #aec9e5}.choicebtn.correct{background:#d8f5e2;border-color:#22834d}.choicebtn.wrong{background:#ffe2e2;border-color:#bd4343}
.footnote{font-size:.95rem;color:#345775;background:#fff8e6;border-left:4px solid #ddad43;margin-top:12px;padding:11px;border-radius:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e6a139;outline-offset:3px}
@media(max-width:700px){main{padding:6px}.practice{padding:14px}.toolbar a{padding:9px}.reply input{width:140px}}
</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Grandeurs et mesures</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-calculer-prix.png" alt="Leçon illustrée : Calculer avec des prix" loading="eager"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">10 questions. Vérifie ta réponse avant de passer à la suivante.</p><div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="subquestion" class="subquestion"></div><form id="reply" class="reply" autocomplete="off"><label for="answer">Ta réponse :</label><input id="answer" type="text" inputmode="text" required><button id="check" type="submit">Vérifier</button></form><div id="choices" class="hidden" role="group" aria-label="Choisis une réponse"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next" id="next" type="button">Question suivante →</button><div class="result" id="result"><strong>Bravo ! Tu as réussi les 10 questions.</strong><p>Tu peux maintenant valider ta leçon.</p></div><button class="done" id="done" type="button">✅ J’ai compris cette leçon</button><button class="restart" id="restart" type="button">Recommencer</button><div class="footnote">Pour trouver le total, j’additionne. Pour rendre la monnaie, je soustrais.</div></section></main><script src="../js/math-lecons.js"></script><script>(function(){'use strict';const tasks=[{"type": "choice", "q": "Quel calcul permet de connaître le prix de deux objets ?", "sub": "Un cahier coûte 3 € et un stylo coûte 2 €.", "choices": ["3 € + 2 €", "3 € − 2 €", "3 € × 2 €"], "a": "3 € + 2 €", "tip": "Pour trouver le total, on additionne les prix.", "ok": "Oui ! On additionne les deux prix."}, {"type": "input", "q": "Une pomme coûte 2 € et un cahier coûte 3 €. Combien paies-tu en tout ?", "a": "5", "sub": "Écris seulement le nombre d’euros.", "tip": "Ajoute 2 et 3.", "ok": "2 € + 3 € = 5 €."}, {"type": "input", "q": "Tu achètes une gomme à 1 € et un livre à 6 €. Quel est le prix total ?", "a": "7", "sub": "Réponds en euros.", "tip": "Additionne 1 € et 6 €.", "ok": "1 € + 6 € = 7 €."}, {"type": "choice", "q": "Tu donnes 10 € pour un achat à 7 €. Quel calcul donne la monnaie à rendre ?", "choices": ["10 − 7", "10 + 7", "7 − 10"], "a": "10 − 7", "tip": "On retire le prix payé de la somme donnée.", "ok": "Oui, on calcule 10 − 7 = 3 €."}, {"type": "input", "q": "Tu paies avec 10 € un jouet qui coûte 8 €. Combien te rend-on ?", "a": "2", "sub": "Réponds en euros.", "tip": "Combien manque-t-il à 8 pour arriver à 10 ?", "ok": "On te rend 2 €."}, {"type": "input", "q": "Une boisson coûte 2 € et un sandwich coûte 5 €. Tu donnes 10 €. Quelle monnaie reçois-tu ?", "a": "3", "sub": "Réponds en euros.", "tip": "D’abord le total : 2 + 5. Ensuite, calcule 10 − ce total.", "ok": "Le total est 7 € ; on te rend 3 €."}, {"type": "input", "q": "Un crayon coûte 50 centimes et une gomme 30 centimes. Quel est le prix total ?", "a": "80", "sub": "Écris la réponse en centimes.", "tip": "Ajoute 50 centimes et 30 centimes.", "ok": "50 c + 30 c = 80 centimes."}, {"type": "choice", "q": "Quel est le prix le plus élevé ?", "choices": ["1 € 20 c", "90 c", "1 € 05 c"], "a": "1 € 20 c", "tip": "1 euro vaut 100 centimes. Compare 120 c, 90 c et 105 c.", "ok": "Oui : 1 € 20 c vaut 120 centimes."}, {"type": "input", "q": "Tu achètes un objet à 1 € 40 c et un autre à 2 € 30 c. Combien cela coûte-t-il ?", "a": ["3,70", "3.70", "3€70", "3€70c", "3,7"], "sub": "Réponds en euros, par exemple : 2,50", "tip": "Additionne les euros entre eux, puis les centimes.", "ok": "1 € 40 c + 2 € 30 c = 3 € 70 c."}, {"type": "input", "q": "Tu donnes 5 € pour un achat de 3 € 50 c. Quelle monnaie reçois-tu ?", "a": ["1,50", "1.50", "1,5", "1€50", "1€50c"], "sub": "Réponds en euros, par exemple : 2,50", "tip": "De 3,50 € à 4 € : 50 c ; puis jusqu’à 5 € : 1 €.", "ok": "5 € − 3,50 € = 1,50 €."}];const $=id=>document.getElementById(id);let i=0,passed=0;function render(){const t=tasks[i];$('counter').textContent='Question '+(i+1)+' sur 10';$('question').textContent=t.q;$('subquestion').textContent=t.sub||'';$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('done').classList.remove('visible');$('result').classList.remove('visible');$('restart').classList.remove('visible');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('reply').classList.remove('hidden');$('choices').innerHTML='';$('choices').className='hidden';if(t.type==='choice'){$('reply').classList.add('hidden');$('choices').className='';t.choices.forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='choicebtn';b.textContent=ch;b.addEventListener('click',()=>checkChoice(ch,b));$('choices').appendChild(b);});}}function finishIfNeeded(){if(i===9){$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible');}else{$('next').classList.add('visible');}}function good(msg){$('feedback').textContent='✅ Bravo ! '+msg;$('feedback').className='feedback good';passed++;$('fill').style.width=(passed*10)+'%';finishIfNeeded();}function bad(msg){$('feedback').textContent='Essaie encore. Indice : '+msg;$('feedback').className='feedback bad';}$('reply').addEventListener('submit',function(e){e.preventDefault();const t=tasks[i];const raw=$('answer').value.trim();if(!raw)return;const normalized=raw.toLowerCase().replace(/\s+/g,'');const answers=(Array.isArray(t.a)?t.a:[t.a]).map(v=>String(v).toLowerCase().replace(/\s+/g,''));if(answers.includes(normalized)){$('answer').disabled=true;$('check').disabled=true;good(t.ok||('La bonne réponse est '+(Array.isArray(t.a)?t.a[0]:t.a)+'.'));}else bad(t.tip);});function checkChoice(choice,btn){const t=tasks[i];if(String(choice)===String(t.a)){Array.from($('choices').children).forEach(x=>x.disabled=true);btn.classList.add('correct');good(t.ok||'C’est la bonne réponse.');}else{btn.classList.add('wrong');btn.disabled=true;bad(t.tip);}}$('next').addEventListener('click',()=>{if(passed!==i+1)return;i++;render();});$('restart').addEventListener('click',()=>{i=0;passed=0;render();});$('done').addEventListener('click',function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function'){HibouMathLesson.complete({titre:"Calculer avec des prix",domaine:"Grandeurs et mesures"},this)}else{this.textContent='✅ Leçon terminée';this.disabled=true;}});render();})();</script></body></html>
