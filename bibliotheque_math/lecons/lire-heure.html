<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lire l’heure — Maître Hibou</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}
main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.toolbar a{background:white;color:#154875;text-decoration:none;font-weight:800;padding:10px 15px;border-radius:12px}.toolbar span{font-weight:800}
.lesson-image{display:block;width:100%;height:auto;max-height:calc(100dvh - 90px);object-fit:contain;background:white;border-radius:18px;box-shadow:0 4px 18px #17304f20}
.practice{width:100%;margin:14px 0 28px;padding:clamp(16px,2.3vw,32px);border-radius:18px;background:white;box-shadow:0 3px 15px #17304f15}
.practice h2{margin:0 0 5px}.hint{color:#48647f}.bar{height:10px;border-radius:12px;background:#e3ecf3;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#247e5b;transition:width .2s}
.counter{font-weight:800;color:#41658a}.question{font-size:clamp(1.3rem,2vw,1.7rem);font-weight:800;margin:15px 0}.subquestion{font-size:1rem;color:#4d6f8f;margin-top:-8px;margin-bottom:12px}
.reply{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reply input{padding:13px;font-size:1.25rem;border:2px solid #a4bdd7;border-radius:12px;width:170px;max-width:100%}
.reply button,.next,.done,.restart,.choicebtn{min-height:48px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer}
.reply button{background:#17659d;color:white}.reply button:disabled{opacity:.5}.next,.done{background:#187552;color:white}.restart{background:#edf3fa;color:#154875}
.feedback{font-weight:750;min-height:2rem;margin:12px 0;line-height:1.4}.feedback.bad{color:#a1441f}.feedback.good{color:#147243}
.next,.done,.restart,.result,.reply.hidden,#choices.hidden{display:none}.visible{display:inline-block}.result.visible{display:block;padding:14px;border-radius:12px;background:#e4f7eb;margin:16px 0}
#choices{display:flex;gap:10px;flex-wrap:wrap}.choicebtn{background:#ebf5ff;color:#17304f;border:2px solid #aec9e5}.choicebtn.correct{background:#d8f5e2;border-color:#22834d}.choicebtn.wrong{background:#ffe2e2;border-color:#bd4343}
.footnote{font-size:.95rem;color:#345775;background:#fff8e6;border-left:4px solid #ddad43;margin-top:12px;padding:11px;border-radius:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e6a139;outline-offset:3px}
@media(max-width:700px){main{padding:6px}.practice{padding:14px}.toolbar a{padding:9px}.lesson-image{max-height:none}.reply input{width:140px}}
</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Grandeurs et mesures</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-lire-heure.png" alt="Leçon illustrée : Lire l’heure" loading="eager"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">10 exercices. Vérifie ta réponse avant de passer à la suivante.</p><div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="subquestion" class="subquestion"></div><form id="reply" class="reply" autocomplete="off"><label for="answer">Ta réponse :</label><input id="answer" type="number" inputmode="numeric" min="0" step="1" required><button id="check" type="submit">Vérifier</button></form><div id="choices" class="hidden" role="group" aria-label="Choisis une réponse"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next" id="next" type="button">Exercice suivant →</button><div class="result" id="result"><strong>Bravo ! Tu as réussi les 10 exercices.</strong><p>Tu peux maintenant valider ta leçon.</p></div><button class="done" id="done" type="button">✅ J’ai compris cette leçon</button><button class="restart" id="restart" type="button">Recommencer</button><div class="footnote">Pour réussir, lis bien la question et vérifie ton unité.</div></section></main><script src="../js/math-lecons.js"></script><script>(function(){'use strict';const tasks=[{"type":"choice","q":"La petite aiguille indique…","choices":["les heures","les minutes","les secondes"],"a":"les heures","tip":"Elle est plus courte.","ok":"La petite aiguille indique les heures."},{"type":"choice","q":"La grande aiguille indique…","choices":["les heures","les minutes","le jour"],"a":"les minutes","tip":"Elle parcourt le cadran en une heure.","ok":"La grande aiguille indique les minutes."},{"type":"choice","q":"La grande aiguille est sur le 12 et la petite sur le 4.","choices":["4 h 00","4 h 30","12 h 04"],"a":"4 h 00","tip":"Sur le 12, il est pile.","ok":"Il est 4 h pile."},{"type":"choice","q":"La grande aiguille est sur le 3 et la petite juste après le 7.","choices":["7 h 15","7 h 30","3 h 07"],"a":"7 h 15","tip":"Chaque nombre représente cinq minutes.","ok":"3 × 5 = 15 minutes."},{"type":"choice","q":"La grande aiguille est sur le 6 et la petite entre le 2 et le 3.","choices":["2 h 30","6 h 02","3 h 30"],"a":"2 h 30","tip":"Sur le 6, cela fait 30 minutes.","ok":"Il est 2 h 30."},{"type":"choice","q":"La grande aiguille est sur le 9 et la petite entre le 5 et le 6.","choices":["5 h 45","9 h 05","6 h 45"],"a":"5 h 45","tip":"9 × 5 = 45 minutes.","ok":"Il est 5 h 45."},{"type":"input","q":"Combien de minutes indiquent 4 intervalles de 5 minutes ?","a":"20","tip":"4 × 5 = ?","ok":"4 × 5 = 20 minutes.","sub":""},{"type":"choice","q":"La grande aiguille est sur le 2 et la petite juste après le 10.","choices":["10 h 10","10 h 20","2 h 10"],"a":"10 h 10","tip":"2 × 5 = 10 minutes.","ok":"Il est 10 h 10."},{"type":"choice","q":"Quelle heure correspond à « huit heures moins le quart » ?","choices":["7 h 45","8 h 15","8 h 45"],"a":"7 h 45","tip":"Un quart d’heure avant 8 h.","ok":"C’est 7 h 45."},{"type":"choice","q":"La grande aiguille est sur le 8 et la petite entre le 11 et le 12.","choices":["11 h 40","8 h 11","12 h 40"],"a":"11 h 40","tip":"8 × 5 = 40 minutes.","ok":"Il est 11 h 40."}];const $=id=>document.getElementById(id);let i=0,passed=0;function render(){const t=tasks[i];$('counter').textContent='Exercice '+(i+1)+' sur 10';$('question').textContent=t.q;$('subquestion').textContent=t.sub||'';$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('done').classList.remove('visible');$('result').classList.remove('visible');$('restart').classList.remove('visible');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('reply').classList.remove('hidden');$('choices').innerHTML='';$('choices').className='hidden';if(t.type==='choice'){$('reply').classList.add('hidden');$('choices').className='';t.choices.forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='choicebtn';b.textContent=ch;b.addEventListener('click',()=>checkChoice(ch,b));$('choices').appendChild(b);});}}function finishIfNeeded(){if(i===9){$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible');}else{$('next').classList.add('visible');}}function good(msg){$('feedback').textContent='✅ Bravo ! '+msg;$('feedback').className='feedback good';passed++;$('fill').style.width=(passed*10)+'%';finishIfNeeded();}function bad(msg){$('feedback').textContent='Essaie encore. Indice : '+msg;$('feedback').className='feedback bad';}$('reply').addEventListener('submit',function(e){e.preventDefault();const t=tasks[i];const raw=$('answer').value.trim();if(!raw)return;const normalized=raw.replace(/\s+/g,'');const expected=String(t.a).replace(/\s+/g,'');if(normalized===expected){$('answer').disabled=true;$('check').disabled=true;good(t.ok||('La bonne réponse est '+t.a+'.'));}else bad(t.tip);});function checkChoice(choice,btn){const t=tasks[i];if(String(choice)===String(t.a)){Array.from($('choices').children).forEach(x=>x.disabled=true);btn.classList.add('correct');good(t.ok||'C’est la bonne réponse.');}else{btn.classList.add('wrong');btn.disabled=true;bad(t.tip);}}$('next').addEventListener('click',()=>{if(passed!==i+1)return;i++;render();});$('restart').addEventListener('click',()=>{i=0;passed=0;render();});$('done').addEventListener('click',function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function'){HibouMathLesson.complete({titre:"Lire l’heure",domaine:"Grandeurs et mesures"},this)}else{this.textContent='✅ Leçon terminée';this.disabled=true;}});render();})();</script></body></html>
