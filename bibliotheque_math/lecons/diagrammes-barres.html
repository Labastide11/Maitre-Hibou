<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lire un diagramme en barres — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#153455;font-family:system-ui,Arial,sans-serif}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar a{background:white;border-radius:12px;padding:11px 15px;text-decoration:none;color:#11588c;font-weight:800}.toolbar span{font-weight:700}.lesson-image{display:block;width:100%;height:auto;object-fit:contain;background:white;border-radius:16px}.practice{width:100%;background:white;border-radius:18px;padding:clamp(16px,2.5vw,34px);margin:12px 0 26px;box-shadow:0 4px 18px #1234561c}.practice h2{margin:0 0 4px}.hint{margin:0 0 12px;color:#49667f}.bar{height:11px;border-radius:20px;background:#e0eaf4;overflow:hidden;margin:15px 0}.fill{height:100%;width:0;background:#21835e;transition:width .2s}.counter{font-weight:800;color:#49667f}.question{font-size:clamp(1.2rem,2.1vw,1.65rem);font-weight:800;margin:18px 0}.answer-form{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.answer-form input{width:160px;border-radius:12px;border:2px solid #a4c0d8;padding:12px;font-size:1.3rem;font-weight:700}.answer-form button,.next,.done,.restart,.choice{min-height:48px;cursor:pointer;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:750}.answer-form button{border:0;background:#165e98;color:white}.next,.done{background:#197b54;color:white;border:0}.restart{border:1px solid #b9cadc;background:#f3f7fd}.choices{display:flex;flex-wrap:wrap;gap:12px}.choice{border:2px solid #b2cce4;background:#edf6ff;color:#153455}.choice.wrong{border-color:#b95656;background:#ffeded}.choice.correct{border-color:#338158;background:#dff6e9}.feedback{font-weight:750;min-height:1.8em;margin:15px 0}.feedback.good{color:#137345}.feedback.bad{color:#a34224}.next,.done,.restart,.result{display:none}.visible{display:inline-block}.result.visible{display:block;background:#e4f7ec;padding:14px;border-radius:12px;margin-bottom:14px}.reference{margin:12px 0;padding:12px;border:2px solid #dce8f4;border-radius:12px;background:#fbfdff;overflow-x:auto}.reference table{border-collapse:collapse;margin:auto;min-width:460px;text-align:center}.reference th,.reference td{border:1px solid #9eacbb;padding:10px}.reference th{background:#def0ff}.chart{width:min(100%,650px);display:block;margin:auto}.schema{display:flex;margin:auto;width:min(100%,650px);height:45px;border:2px solid #286797;border-radius:6px;overflow:hidden}.schema span{display:grid;place-items:center;font-size:1.25rem;font-weight:800}.schema .s1{background:#95d4fd;flex:5}.schema .s2{background:#a5e99d;flex:3}.reference-label{text-align:center;font-size:.9rem;color:#58728d;margin:7px 0 0}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid orange;outline-offset:3px}@media(max-width:700px){main{padding:6px}.toolbar span{font-size:.8rem}.practice{padding:15px}.lesson-image{border-radius:8px}}</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Organisation de données / Problèmes</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-diagramme-barres.png" alt="Affiche Maître Hibou : Lire un diagramme en barres" loading="eager"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">Observe, réponds, puis vérifie. Tu passes à la suite quand tu as trouvé.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="count" class="counter"></div><div class="reference"><svg class="chart" viewBox="0 0 600 320" role="img" aria-label="Livres empruntés : Romans 12, bandes dessinées 18, documentaires 9, albums 15"><line x1="60" y1="260" x2="570" y2="260" stroke="#1c3654" stroke-width="3"/><line x1="60" y1="25" x2="60" y2="260" stroke="#1c3654" stroke-width="3"/><g font-family="Arial" font-size="18" fill="#253e59" text-anchor="end"><text x="50" y="264">0</text><text x="50" y="214">5</text><text x="50" y="164">10</text><text x="50" y="114">15</text><text x="50" y="64">20</text></g><g stroke="#c5d2df" stroke-dasharray="4 5"><path d="M60 210 H570 M60 160 H570 M60 110 H570 M60 60 H570"/></g><g font-size="23" font-weight="bold" text-anchor="middle" fill="#102f54"><text x="119" y="130">12</text><text x="243" y="70">18</text><text x="367" y="160">9</text><text x="491" y="100">15</text></g><rect x="86" y="140" width="65" height="120" fill="#42a5f5"/><rect x="210" y="80" width="65" height="180" fill="#ed6652"/><rect x="334" y="170" width="65" height="90" fill="#5dc96c"/><rect x="458" y="110" width="65" height="150" fill="#facb43"/><g font-family="Arial" font-size="16" fill="#123456" text-anchor="middle"><text x="119" y="285">Romans</text><text x="243" y="285">BD</text><text x="367" y="285">Documentaires</text><text x="491" y="285">Albums</text></g></svg><p class="reference-label">Nombre de livres empruntés à la bibliothèque</p></div><div id="question" class="question"></div><form id="answer-form" class="answer-form" autocomplete="off"><label for="answer">Ta réponse :</label><input id="answer" type="number" step="1" inputmode="numeric" required><button id="check" type="submit">Vérifier</button></form><div class="choices" id="choices" hidden></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="next" type="button">Exercice suivant →</button><div id="result" class="result"><strong>Bravo, les 10 exercices sont réussis !</strong><p>Tu peux valider cette leçon.</p></div><button id="done" class="done" type="button">J’ai compris cette leçon</button><button id="restart" class="restart" type="button">Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>(function(){'use strict';
const tasks=[["input", "Combien de romans ont été empruntés ?", null, "12", "Lis la hauteur de la barre bleue « Romans ».", "12 romans."], ["choice", "Quelle catégorie a la plus haute barre ?", ["Albums", "Bandes dessinées", "Documentaires"], "Bandes dessinées", "Cherche la barre qui monte le plus haut.", "Les bandes dessinées : 18 livres."], ["input", "Combien de documentaires ont été empruntés ?", null, "9", "La barre verte « Documentaires » indique 9.", "9 documentaires."], ["choice", "Quelle catégorie a la plus petite quantité ?", ["Romans", "Albums", "Documentaires"], "Documentaires", "Compare les hauteurs des quatre barres.", "Les documentaires : 9 livres."], ["input", "Combien d’albums ont été empruntés ?", null, "15", "Lis la barre jaune « Albums ».", "15 albums."], ["input", "Combien de bandes dessinées de plus que de romans ?", null, "6", "Calcule 18 − 12.", "18 − 12 = 6."], ["choice", "Quelle catégorie représente 15 livres ?", ["Albums", "Romans", "Documentaires"], "Albums", "Cherche la barre qui atteint 15.", "Ce sont les albums."], ["input", "Combien de romans et d’albums en tout ?", null, "27", "Ajoute 12 et 15.", "12 + 15 = 27."], ["input", "Combien de livres ont été empruntés au total ?", null, "54", "Ajoute 12, 18, 9 et 15.", "12 + 18 + 9 + 15 = 54."], ["input", "Combien de documentaires de moins que d’albums ?", null, "6", "Compare 9 documentaires et 15 albums.", "15 − 9 = 6."]];const $=id=>document.getElementById(id);let i=0,passed=0,locked=false;
function render(){const t=tasks[i];locked=false;$('count').textContent='Exercice '+(i+1)+' sur 10';$('question').textContent=t[1];$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('done').classList.remove('visible');$('restart').classList.remove('visible');$('result').classList.remove('visible');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('choices').innerHTML='';$('answer-form').hidden=t[0]==='choice';$('choices').hidden=t[0]!=='choice';if(t[0]==='choice'){t[2].forEach(v=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=v;b.addEventListener('click',()=>verify(v,b));$('choices').append(b)})}}
function verify(value,button){if(locked)return;const t=tasks[i],correct=String(value).trim()===String(t[3]);if(correct){locked=true;passed++;$('fill').style.width=(passed*10)+'%';$('feedback').textContent='Bravo ! '+t[5];$('feedback').className='feedback good';$('answer').disabled=true;$('check').disabled=true;for(const b of $('choices').children)b.disabled=true;if(button)button.classList.add('correct');if(i===9){$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible')}else $('next').classList.add('visible')}else{$('feedback').textContent='Essaie encore. Indice : '+t[4];$('feedback').className='feedback bad';if(button){button.classList.add('wrong');button.disabled=true}else{$('answer').focus();$('answer').select()}}}
$('answer-form').addEventListener('submit',e=>{e.preventDefault();const value=$('answer').value;if(value.trim())verify(String(Number(value)),null)});
$('next').addEventListener('click',()=>{if(!locked||i===9)return;i++;render()});$('restart').addEventListener('click',()=>{i=0;passed=0;render()});$('done').addEventListener('click',function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function')HibouMathLesson.complete({titre:"Lire un diagramme en barres",domaine:'Organisation et gestion de données'},this);else{this.disabled=true;this.textContent='Leçon terminée'}});render()})();</script></body></html>
