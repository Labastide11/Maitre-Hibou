<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconnaître et décrire les solides — Maître Hibou</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}
main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.toolbar a{background:white;color:#154875;text-decoration:none;font-weight:800;padding:10px 15px;border-radius:12px}.toolbar span{font-weight:800}
.lesson-image{display:block;width:100%;height:auto;max-height:calc(100dvh - 90px);object-fit:contain;background:white;border-radius:18px;box-shadow:0 4px 18px #17304f20}
.practice{width:100%;margin:14px 0 28px;padding:clamp(16px,2.3vw,32px);border-radius:18px;background:white;box-shadow:0 3px 15px #17304f15}
.practice h2{margin:0 0 5px}.hint{color:#48647f}.bar{height:10px;border-radius:12px;background:#e3ecf3;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#247e5b;transition:width .2s}
.counter{font-weight:800;color:#41658a}.question{font-size:clamp(1.3rem,2vw,1.7rem);font-weight:800;margin:15px 0}.subquestion{font-size:1rem;color:#4d6f8f;margin-top:-8px;margin-bottom:12px}
.reply{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reply input{padding:13px;font-size:1.25rem;border:2px solid #a4bdd7;border-radius:12px;width:170px;max-width:100%}
.reply button,.next,.done,.restart,.choicebtn{min-height:48px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer}
.reply button{background:#17659d;color:white}.reply button:disabled{opacity:.5}.next,.done{background:#187552;color:white}.restart{background:#edf3fa;color:#154875}
.feedback{font-weight:750;min-height:2rem;margin:12px 0;line-height:1.4}.feedback.bad{color:#a1441f}.feedback.good{color:#147243}
.next,.done,.restart,.result,.reply.hidden,#choices.hidden{display:none}.visible{display:inline-block}.result.visible{display:block;padding:14px;border-radius:12px;background:#e4f7eb;margin:16px 0}
#choices{display:flex;gap:10px;flex-wrap:wrap}.choicebtn{background:#ebf5ff;color:#17304f;border:2px solid #aec9e5}.choicebtn.correct{background:#d8f5e2;border-color:#22834d}.choicebtn.wrong{background:#ffe2e2;border-color:#bd4343}
.footnote{font-size:.95rem;color:#345775;background:#fff8e6;border-left:4px solid #ddad43;margin-top:12px;padding:11px;border-radius:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e6a139;outline-offset:3px}
@media(max-width:700px){main{padding:6px}.practice{padding:14px}.toolbar a{padding:9px}.lesson-image{max-height:none}.reply input{width:140px}}
.exercise-visual{display:none;justify-content:center;align-items:center;background:#f8fbff;border:2px solid #d4e5f4;border-radius:16px;padding:14px;margin:12px 0 18px;min-height:220px}.exercise-visual.shown{display:flex}.exercise-visual svg{width:min(100%,270px);height:auto} </style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Géométrie</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-solides.png" alt="Leçon illustrée : Reconnaître et décrire les solides" loading="eager"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">10 exercices. Vérifie ta réponse avant de passer à la suivante.</p><div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="subquestion" class="subquestion"></div><div id="visual" class="exercise-visual" aria-label="Illustration de la figure"></div><form id="reply" class="reply" autocomplete="off"><label for="answer">Ta réponse :</label><input id="answer" type="number" inputmode="numeric" required><button id="check" type="submit">Vérifier</button></form><div id="choices" class="hidden" role="group" aria-label="Choisis une réponse"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next" id="next" type="button">Exercice suivant →</button><div class="result" id="result"><strong>Bravo ! Tu as réussi les 10 exercices.</strong><p>Tu peux maintenant valider ta leçon.</p></div><button class="done" id="done" type="button">✅ J’ai compris cette leçon</button><button class="restart" id="restart" type="button">Recommencer</button><div class="footnote">Observe bien la forme avant de répondre.</div></section></main><script src="../js/math-lecons.js"></script><script>(function(){'use strict';const tasks=[{"type": "choice", "q": "Observe la figure. Quel est son nom ?", "choices": ["Le pavé droit", "Le cube", "Le cylindre"], "a": "Le cube", "tip": "Observe bien sa forme et ses caractéristiques.", "ok": "Tu as reconnu le cube.", "drawing": "cube"}, {"type": "choice", "q": "Observe la figure. Quel est son nom ?", "choices": ["La sphère", "Le pavé droit", "Le cône"], "a": "Le pavé droit", "tip": "Observe bien sa forme et ses caractéristiques.", "ok": "Tu as reconnu le pavé droit.", "drawing": "pave"}, {"type": "choice", "q": "Observe la figure. Quel est son nom ?", "choices": ["Le cône", "Le cylindre", "La sphère"], "a": "La sphère", "tip": "Observe bien sa forme et ses caractéristiques.", "ok": "Tu as reconnu la sphère.", "drawing": "sphere"}, {"type": "choice", "q": "Observe la figure. Quel est son nom ?", "choices": ["Le cylindre", "La sphère", "Le cube"], "a": "Le cylindre", "tip": "Observe bien sa forme et ses caractéristiques.", "ok": "Tu as reconnu le cylindre.", "drawing": "cylindre"}, {"type": "choice", "q": "Observe la figure. Quel est son nom ?", "choices": ["Le cube", "Le cône", "Le pavé droit"], "a": "Le cône", "tip": "Observe bien sa forme et ses caractéristiques.", "ok": "Tu as reconnu le cône.", "drawing": "cone"}, {"type": "choice", "q": "Combien de faces possède un cube ?", "choices": ["4", "6", "8"], "a": "6", "tip": "Tu peux compter la face du haut, du bas et les quatre autour.", "ok": "Bonne réponse : 6."}, {"type": "choice", "q": "Quelle est la forme des faces d’un cube ?", "choices": ["Des triangles", "Des carrés", "Des cercles"], "a": "Des carrés", "tip": "Toutes ses faces sont identiques.", "ok": "Bonne réponse : Des carrés."}, {"type": "choice", "q": "Quel solide n’a ni arête ni sommet ?", "choices": ["Le cube", "Le cône", "La sphère"], "a": "La sphère", "tip": "Il est entièrement arrondi.", "ok": "Bonne réponse : La sphère."}, {"type": "choice", "q": "Combien de sommets possède un cube ?", "choices": ["6", "8", "12"], "a": "8", "tip": "Compte les quatre sommets du haut et les quatre du bas.", "ok": "Bonne réponse : 8."}, {"type": "choice", "q": "Quel solide possède deux bases circulaires ?", "choices": ["La sphère", "Le cylindre", "Le cône"], "a": "Le cylindre", "tip": "Il a un cercle en haut et un autre en bas.", "ok": "Bonne réponse : Le cylindre."}];const $=id=>document.getElementById(id);let i=0,passed=0;const drawings={"carre": "<rect x=\"50\" y=\"25\" width=\"130\" height=\"130\" fill=\"#68bef8\" stroke=\"#163c69\" stroke-width=\"5\"/>", "rectangle": "<rect x=\"25\" y=\"47\" width=\"180\" height=\"90\" fill=\"#ffcb72\" stroke=\"#163c69\" stroke-width=\"5\"/>", "triangle": "<polygon points=\"115,20 205,160 25,160\" fill=\"#f48f94\" stroke=\"#163c69\" stroke-width=\"5\"/>", "cercle": "<circle cx=\"115\" cy=\"90\" r=\"72\" fill=\"#9ce5a4\" stroke=\"#163c69\" stroke-width=\"5\"/>", "pentagone": "<polygon points=\"115,16 204,79 172,167 58,167 26,79\" fill=\"#cda9f8\" stroke=\"#163c69\" stroke-width=\"5\"/>", "cube": "<polygon points=\"52,48 113,15 179,48 118,81\" fill=\"#a2dcff\" stroke=\"#163c69\" stroke-width=\"4\"/><polygon points=\"52,48 118,81 118,159 52,123\" fill=\"#3999e5\" stroke=\"#163c69\" stroke-width=\"4\"/><polygon points=\"118,81 179,48 179,122 118,159\" fill=\"#1774c4\" stroke=\"#163c69\" stroke-width=\"4\"/>", "pave": "<polygon points=\"25,61 79,30 205,54 151,84\" fill=\"#ffc3a8\" stroke=\"#163c69\" stroke-width=\"4\"/><polygon points=\"25,61 151,84 151,152 25,129\" fill=\"#f48c70\" stroke=\"#163c69\" stroke-width=\"4\"/><polygon points=\"151,84 205,54 205,121 151,152\" fill=\"#ce654d\" stroke=\"#163c69\" stroke-width=\"4\"/>", "sphere": "<defs><radialGradient id=\"ball\" cx=\"30%\" cy=\"27%\"><stop stop-color=\"#d9ffd7\"/><stop offset=\"1\" stop-color=\"#29955e\"/></radialGradient></defs><circle cx=\"115\" cy=\"90\" r=\"70\" fill=\"url(#ball)\" stroke=\"#185a46\" stroke-width=\"4\"/>", "cylindre": "<rect x=\"55\" y=\"47\" width=\"120\" height=\"95\" fill=\"#9e84f1\" stroke=\"#45377f\" stroke-width=\"4\"/><ellipse cx=\"115\" cy=\"47\" rx=\"60\" ry=\"23\" fill=\"#d8c9ff\" stroke=\"#45377f\" stroke-width=\"4\"/><path d=\"M55 142 A60 23 0 0 0 175 142\" fill=\"none\" stroke=\"#45377f\" stroke-width=\"4\"/>", "cone": "<path d=\"M115 18 L37 145 Q115 174 193 145 Z\" fill=\"#f8ae5e\" stroke=\"#9b542a\" stroke-width=\"4\"/><ellipse cx=\"115\" cy=\"145\" rx=\"78\" ry=\"19\" fill=\"#e98932\" stroke=\"#9b542a\" stroke-width=\"4\"/>"};function render(){const t=tasks[i];$('counter').textContent='Exercice '+(i+1)+' sur 10';$('question').textContent=t.q;$('subquestion').textContent=t.sub||'';$('visual').innerHTML=t.drawing?"<svg viewBox=\"0 0 230 185\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Figure \u00e0 identifier\">"+drawings[t.drawing]+'</svg>':'';$('visual').classList.toggle('shown',!!t.drawing);$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('done').classList.remove('visible');$('result').classList.remove('visible');$('restart').classList.remove('visible');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('reply').classList.remove('hidden');$('choices').innerHTML='';$('choices').className='hidden';if(t.type==='choice'){$('reply').classList.add('hidden');$('choices').className='';t.choices.forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='choicebtn';b.textContent=ch;b.addEventListener('click',()=>checkChoice(ch,b));$('choices').appendChild(b);});}}function finishIfNeeded(){if(i===9){$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible');}else{$('next').classList.add('visible');}}function good(msg){$('feedback').textContent='✅ Bravo ! '+msg;$('feedback').className='feedback good';passed++;$('fill').style.width=(passed*10)+'%';finishIfNeeded();}function bad(msg){$('feedback').textContent='Essaie encore. Indice : '+msg;$('feedback').className='feedback bad';}$('reply').addEventListener('submit',function(e){e.preventDefault();const t=tasks[i];const raw=$('answer').value.trim();if(!raw)return;const normalized=raw.replace(/\s+/g,'');const expected=String(t.a).replace(/\s+/g,'');if(normalized===expected){$('answer').disabled=true;$('check').disabled=true;good(t.ok||('La bonne réponse est '+t.a+'.'));}else bad(t.tip);});function checkChoice(choice,btn){const t=tasks[i];if(String(choice)===String(t.a)){Array.from($('choices').children).forEach(x=>x.disabled=true);btn.classList.add('correct');good(t.ok||'C’est la bonne réponse.');}else{btn.classList.add('wrong');btn.disabled=true;bad(t.tip);}}$('next').addEventListener('click',()=>{if(passed!==i+1)return;i++;render();});$('restart').addEventListener('click',()=>{i=0;passed=0;render();});$('done').addEventListener('click',function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function'){HibouMathLesson.complete({titre:"Reconnaître et décrire les solides",domaine:"Géométrie"},this)}else{this.textContent='✅ Leçon terminée';this.disabled=true;}});render();})();</script></body></html>
