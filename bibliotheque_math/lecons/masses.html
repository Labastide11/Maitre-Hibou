<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesurer des masses — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#183651;font-family:system-ui,Arial,sans-serif}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.toolbar a{background:white;padding:10px 16px;border-radius:12px;text-decoration:none;color:#164776;font-weight:800}.toolbar span{font-weight:800}.lesson-image{width:100%;max-height:calc(100dvh - 90px);object-fit:contain;height:auto;display:block;background:white;border-radius:18px;box-shadow:0 4px 18px #17304f20}.practice{width:100%;background:white;margin:14px 0 28px;padding:clamp(16px,2.3vw,32px);border-radius:18px;box-shadow:0 3px 15px #17304f15}.practice h2{margin:0}.hint{color:#496984}.bar{width:100%;height:10px;background:#e2ebf4;border-radius:8px;overflow:hidden;margin:16px 0}.fill{background:#267d5b;height:100%;width:0;transition:width .2s}.counter{font-weight:800;color:#476a86}.question{font-size:clamp(1.3rem,2.1vw,1.8rem);font-weight:800;margin:16px 0}.reply{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.reply input{width:175px;padding:12px;font-size:1.35rem;border:2px solid #9ebbd5;border-radius:12px}.reply button,.choice,.next,.done,.restart{cursor:pointer;padding:12px 18px;min-height:48px;font-size:1.05rem;font-weight:800;border-radius:12px;border:0}.reply button{background:#17659d;color:white}.choice{background:#eaf4ff;color:#17304f;border:2px solid #afcce7;margin:0 10px 10px 0}.choice:disabled,.reply button:disabled{opacity:.65;cursor:default}.next,.done{background:#187752;color:white}.restart{background:#e9eff5;color:#194568}.feedback{font-weight:750;min-height:2em;margin:13px 0}.feedback.good{color:#147243}.feedback.bad{color:#a24419}.next,.done,.restart,.result,.hidden{display:none!important}.visible{display:inline-block!important}.result.visible{display:block!important;background:#e3f6ea;padding:14px;border-radius:12px;margin:14px 0}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #edac33;outline-offset:3px}@media(max-width:700px){main{padding:6px}.practice{padding:15px}.lesson-image{max-height:none}.toolbar span{font-size:.85rem}.reply input{width:140px}}</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Grandeurs et mesures</span></nav><img class="lesson-image" alt="Leçon illustrée : Mesurer des masses" src="../../images-lecons/maths/maitre-hibou-masses.png"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">10 exercices. Écris ou choisis ta réponse, vérifie, puis avance.</p><div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div><div class="counter" id="counter"></div><div class="question" id="question"></div><form id="form" class="reply"><label for="answer">Ta réponse :</label><input type="number" inputmode="numeric" id="answer" required min="0" step="1"><button type="submit" id="check">Vérifier</button></form><div id="choices" role="group" aria-label="Choisis une réponse"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button type="button" id="next" class="next">Exercice suivant →</button><div id="result" class="result"><strong>Bravo ! Tu as terminé les 10 exercices.</strong><p>Tu peux maintenant valider ta leçon.</p></div><button type="button" id="done" class="done">✅ J’ai compris cette leçon</button><button type="button" id="restart" class="restart">Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>(()=>{'use strict';const tasks=[{"q": "Pour mesurer la masse d’une gomme, quelle unité choisir ?", "options": ["g", "kg"], "answer": "g", "hint": "Une gomme se mesure en grammes.", "reason": "Une gomme se mesure en grammes."}, {"q": "Pour mesurer la masse d’un cartable, quelle unité choisir ?", "options": ["g", "kg"], "answer": "kg", "hint": "Un cartable se mesure plutôt en kilogrammes.", "reason": "Un cartable se mesure plutôt en kilogrammes."}, {"q": "Combien de grammes y a-t-il dans 1 kg ?", "options": null, "answer": "1000", "hint": "1 kg = 1 000 g.", "reason": "1 kg = 1 000 g."}, {"q": "Quelle masse est la plus grande ?", "options": ["500 g", "1 kg"], "answer": "1 kg", "hint": "1 kg = 1 000 g, donc plus que 500 g.", "reason": "1 kg = 1 000 g, donc plus que 500 g."}, {"q": "Complète : 2 kg = … g.", "options": null, "answer": "2000", "hint": "2 × 1 000 = 2 000 g.", "reason": "2 × 1 000 = 2 000 g."}, {"q": "Un paquet pèse 300 g et un autre 200 g. Quelle est la masse totale en grammes ?", "options": null, "answer": "500", "hint": "300 + 200 = 500 g.", "reason": "300 + 200 = 500 g."}, {"q": "Complète : 1 kg = … fois 100 g.", "options": null, "answer": "10", "hint": "10 × 100 g = 1 000 g.", "reason": "10 × 100 g = 1 000 g."}, {"q": "Un paquet de farine pèse 1 kg. On utilise 250 g. Quelle masse reste en grammes ?", "options": null, "answer": "750", "hint": "1 000 − 250 = 750 g.", "reason": "1 000 − 250 = 750 g."}, {"q": "Complète : 3 kg = … g.", "options": null, "answer": "3000", "hint": "3 × 1 000 = 3 000 g.", "reason": "3 × 1 000 = 3 000 g."}, {"q": "Un sac pèse 1 kg et 500 g. Quelle est sa masse en grammes ?", "options": null, "answer": "1500", "hint": "1 000 + 500 = 1 500 g.", "reason": "1 000 + 500 = 1 500 g."}],meta={"titre": "Mesurer des masses", "domaine": "Grandeurs et mesures"};const $=id=>document.getElementById(id);let i=0,passed=0,locked=false;function render(){const t=tasks[i];locked=false;$('counter').textContent='Exercice '+(i+1)+' sur '+tasks.length;$('question').textContent=t.q;$('fill').style.width=(passed/tasks.length*100)+'%';$('feedback').textContent='';$('feedback').className='feedback';for(const id of ['next','done','restart','result'])$(id).classList.remove('visible');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;const isChoice=!!t.options;$('form').classList.toggle('hidden',isChoice);$('choices').classList.toggle('hidden',!isChoice);$('choices').replaceChildren();if(isChoice){for(const option of t.options){const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=option;b.addEventListener('click',()=>verify(option));$('choices').appendChild(b)}}}function verify(value){if(locked)return;const t=tasks[i];if(String(value).trim().replace(/\s/g,'')===String(t.answer).replace(/\s/g,'')){locked=true;passed++;$('fill').style.width=(passed/tasks.length*100)+'%';$('feedback').textContent='✅ Bravo ! '+t.reason;$('feedback').className='feedback good';$('answer').disabled=true;$('check').disabled=true;$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);if(i===tasks.length-1){for(const id of ['done','restart','result'])$(id).classList.add('visible')}else $('next').classList.add('visible')}else{$('feedback').textContent='Essaie encore. Indice : '+t.hint;$('feedback').className='feedback bad';if(!t.options){$('answer').focus();$('answer').select()}}}$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('answer').value;if(v!=='')verify(v)});$('next').addEventListener('click',()=>{if(!locked||i===tasks.length-1)return;i++;render();});$('restart').addEventListener('click',()=>{i=0;passed=0;render()});$('done').addEventListener('click',function(){if(passed!==tasks.length)return;if(window.HibouMathLesson&&typeof window.HibouMathLesson.complete==='function')window.HibouMathLesson.complete(meta,this);else{this.textContent='✅ Leçon enregistrée';this.disabled=true}});render()})();</script></body></html>
