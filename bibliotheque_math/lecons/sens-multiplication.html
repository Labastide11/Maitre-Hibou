<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprendre la multiplication — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}main{--lesson-width:min(100%, calc((100dvh - 85px) * 4 / 3));max-width:1400px;margin:auto;padding:12px}.toolbar{max-width:var(--lesson-width);margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.toolbar a{background:white;color:#154875;padding:10px 14px;border-radius:12px;font-weight:800;text-decoration:none}.toolbar span{font-weight:800}.lesson-image{display:block;width:100%;max-width:var(--lesson-width);margin:auto;height:auto;max-height:calc(100dvh - 85px);object-fit:contain;border-radius:16px;background:white}.practice{background:white;max-width:var(--lesson-width);width:100%;margin:16px auto 30px;padding:24px;border-radius:20px;box-shadow:0 3px 15px #1232}.practice h2{margin:0;font-size:clamp(22px,2.5vw,30px)}.intro{color:#4d647a}.bar{height:10px;border-radius:20px;background:#e1ebf4;overflow:hidden}.bar span{display:block;width:0;height:100%;background:#28885d;transition:width .2s}.count{margin-top:12px;font-weight:800;color:#426384}.question{font-size:clamp(22px,3vw,32px);font-weight:850;margin:16px 0}.answer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.answer input{width:160px;max-width:100%;border:2px solid #a1bed7;border-radius:12px;font-size:26px;padding:12px;color:#183450}.answer button,.next,.done,.restart{border:0;border-radius:12px;padding:13px 18px;font-size:17px;font-weight:800;cursor:pointer;min-height:49px}.answer button{background:#3778b4;color:white}.next{display:none;background:#207b56;color:white;margin-top:16px}.next.visible{display:inline-block}.done{display:none;background:#137a55;color:white;margin-top:16px}.done.visible{display:inline-block}.restart{display:none;background:#e3edf6;color:#17304f;margin:16px 0 0 8px}.restart.visible{display:inline-block}button:disabled{opacity:.55;cursor:default}.feedback{font-size:18px;line-height:1.5;min-height:35px;margin-top:12px;font-weight:750}.feedback.good{color:#147143}.feedback.try{color:#a34a17}.result{display:none;background:#e3f7ea;border-radius:14px;padding:16px;margin-top:16px}.result.visible{display:block}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffb52e;outline-offset:3px}@media(max-width:700px){main{padding:6px}.practice{padding:16px}.toolbar a{padding:8px}.toolbar span{font-size:14px}.lesson-image{max-height:none;border-radius:9px}}@media(orientation:landscape){.lesson-image{max-height:calc(100dvh - 85px)}}</style></head><body><main><nav class="toolbar" aria-label="Navigation de la leçon"><a href="../index.html">← Mes leçons de maths</a><span>Calcul</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-comprendre-multiplication.png" alt="Leçon illustrée : Comprendre la multiplication" loading="eager"><section class="practice" aria-labelledby="practice-title"><h2 id="practice-title">À toi de jouer !</h2><p class="intro">Écris ta réponse puis appuie sur « Vérifier ». Tu passes à la suite quand tu as trouvé.</p><div class="bar" aria-hidden="true"><span id="bar-fill"></span></div><div class="count" id="count"></div><div class="question" id="question"></div><form id="form" class="answer"><label for="field">Ta réponse :</label><input id="field" type="number" min="0" max="9999" step="1" inputmode="numeric" required aria-describedby="feedback"><button id="check" type="submit">Vérifier</button></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button id="next" type="button" class="next">Exercice suivant →</button><div id="result" class="result"><strong>Bravo ! Tu as terminé les 10 exercices.</strong><p>Tu peux maintenant valider ta leçon.</p></div><button type="button" class="done" id="done">✅ J’ai compris cette leçon</button><button type="button" class="restart" id="restart">Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>window.lessonTasks=[["3 groupes de 4 pommes : combien de pommes en tout ?", 12, "Compte 4 + 4 + 4.", "4 + 4 + 4 = 12."], ["2 groupes de 5 étoiles : combien d’étoiles ?", 10, "Compte 5 + 5.", "5 + 5 = 10."], ["4 groupes de 3 billes : combien de billes ?", 12, "Additionne quatre fois 3.", "3 + 3 + 3 + 3 = 12."], ["3 rangées de 4 carrés de chocolat : combien de carrés ?", 12, "Observe les trois rangées de 4.", "3 × 4 = 12."], ["5 groupes de 2 crayons : combien de crayons ?", 10, "Fais 2 + 2 + 2 + 2 + 2.", "5 × 2 = 10."], ["6 + 6 + 6 : combien de groupes de 6 ?", 3, "Compte les nombres 6 dans l’addition.", "Il y a 3 groupes de 6."], ["4 + 4 + 4 + 4 + 4 : combien de groupes de 4 ?", 5, "Compte combien de fois le 4 apparaît.", "Il y a 5 groupes de 4."], ["7 groupes de 3 fleurs : combien de fleurs ?", 21, "Compte de 3 en 3, sept fois.", "7 × 3 = 21."], ["4 rangées de 6 chaises : combien de chaises ?", 24, "Calcule 6 + 6 + 6 + 6.", "4 × 6 = 24."], ["8 groupes de 5 cubes : combien de cubes ?", 40, "Compte de 5 en 5, huit fois.", "8 × 5 = 40."]];window.lessonMeta={"titre": "Comprendre la multiplication", "domaine": "Calcul"};(function(){'use strict';const tasks=window.lessonTasks;let index=0,done=0,attemptedWrong=false;const el=id=>document.getElementById(id);function show(){const t=tasks[index];el('count').textContent='Exercice '+(index+1)+' sur '+tasks.length;el('question').textContent=t[0];el('field').value='';el('field').disabled=false;el('check').disabled=false;el('feedback').textContent='';el('feedback').className='feedback';el('next').classList.remove('visible');el('result').classList.remove('visible');el('done').classList.remove('visible');el('restart').classList.remove('visible');el('form').hidden=false;el('bar-fill').style.width=(done/tasks.length*100)+'%';attemptedWrong=false}el('form').addEventListener('submit',function(e){e.preventDefault();let raw=el('field').value.trim();if(!raw)return;const t=tasks[index];if(!/^\d+$/.test(raw)){el('feedback').textContent='Écris un nombre entier.';return}if(Number(raw)===t[1]){done++;el('field').disabled=true;el('check').disabled=true;el('feedback').className='feedback good';el('feedback').textContent='✅ Bravo ! '+t[3];el('bar-fill').style.width=(done/tasks.length*100)+'%';if(index<tasks.length-1){el('next').classList.add('visible')}else{el('form').hidden=true;el('result').classList.add('visible');el('done').classList.add('visible');el('restart').classList.add('visible')}}else{attemptedWrong=true;el('feedback').className='feedback try';el('feedback').textContent='Essaie encore. Indice : '+t[2];el('field').focus();el('field').select()}});el('next').addEventListener('click',()=>{if(done!==index+1)return;index++;show();el('field').focus()});el('restart').addEventListener('click',()=>{index=0;done=0;show();el('field').focus()});el('done').addEventListener('click',function(){if(done!==tasks.length)return;if(window.HibouMathLesson&&typeof window.HibouMathLesson.complete==='function'){window.HibouMathLesson.complete(window.lessonMeta,this)}else{this.textContent='✅ Leçon terminée';this.disabled=true}});show()})();</script></body></html>
