<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcul mental : additionner rapidement — Maître Hibou</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}.toolbar a{background:white;color:#154875;padding:11px 16px;text-decoration:none;border-radius:12px;font-weight:800}.lesson-image{width:100%;display:block;height:auto;max-height:calc(100dvh - 90px);object-fit:contain;background:white;border-radius:18px}.practice{width:100%;background:white;margin:14px 0 30px;padding:clamp(16px,3vw,34px);border-radius:18px;box-shadow:0 4px 14px #1234}.practice h2{margin:0}.hint{color:#56708a}.progress{height:10px;background:#e0ebf4;border-radius:20px;margin:18px 0;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#26875b}.counter{font-weight:800;color:#356287}.question{font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:800;margin:16px 0}form{display:flex;align-items:center;gap:12px;flex-wrap:wrap}input{width:155px;font-size:1.5rem;padding:12px;border:2px solid #aac5dc;border-radius:12px}button{font:700 1rem system-ui;min-height:46px;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:#20639c;color:white}button:disabled{opacity:.5;cursor:default}.choices{display:flex;flex-wrap:wrap;gap:10px}.choices button{background:#eaf3fc;color:#193958;border:2px solid #a6c4dc}.choices button[aria-pressed=true]{background:#d7f4e4}.feedback{min-height:2em;margin:14px 0;font-weight:700}.feedback.good{color:#147243}.feedback.bad{color:#a3471e}.next,.done,.restart{display:none;background:#207952}.visible{display:inline-block}.result{display:none;background:#e4f8ee;border-radius:12px;padding:16px}.result.visible{display:block}.drawing{max-width:410px;width:100%;margin:8px auto 20px;display:block;background:#f4f9fe;border-radius:12px}.drawing svg{width:100%;height:auto;max-height:230px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid orange;outline-offset:2px}@media(max-width:700px){main{padding:6px}.practice{padding:14px}.toolbar span{font-size:.85rem}.lesson-image{max-height:none}}</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Calcul</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-calcul-mental-addition.png" alt="Leçon illustrée : Calcul mental : additionner rapidement"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">10 questions. Réponds puis vérifie. Une bonne réponse te permet de continuer.</p><div class="progress"><span id="fill"></span></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="drawing" class="drawing" hidden></div><form id="form" autocomplete="off"><label for="answer">Ta réponse :</label><input id="answer" type="number" min="0" step="1" inputmode="numeric" required><button id="check">Vérifier</button></form><div id="choices" class="choices" hidden></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="next" class="next">Exercice suivant →</button><div id="result" class="result"><strong>Bravo, tu as terminé les 10 questions !</strong><p>Tu peux maintenant valider cette leçon.</p></div><button id="done" class="done">✅ J’ai compris cette leçon</button><button id="restart" class="restart">Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>(function(){'use strict';const tasks=[{"q": "Calcule : 30 + 20 = …", "a": "50", "tip": "Additionne 3 dizaines et 2 dizaines.", "ok": "30 + 20 = 50.", "kind": "number"}, {"q": "Calcule : 40 + 30 = …", "a": "70", "tip": "4 dizaines + 3 dizaines.", "ok": "40 + 30 = 70.", "kind": "number"}, {"q": "Calcule : 6 + 6 = …", "a": "12", "tip": "Cherche le double de 6.", "ok": "6 + 6 = 12.", "kind": "number"}, {"q": "Calcule : 8 + 8 = …", "a": "16", "tip": "Cherche le double de 8.", "ok": "8 + 8 = 16.", "kind": "number"}, {"q": "Calcule : 27 + 3 = …", "a": "30", "tip": "Complète la dizaine suivante.", "ok": "27 + 3 = 30.", "kind": "number"}, {"q": "Calcule : 24 + 5 = …", "a": "29", "tip": "Fais 24 + 1 + 4.", "ok": "24 + 5 = 29.", "kind": "number"}, {"q": "Calcule : 36 + 9 = …", "a": "45", "tip": "Fais 36 + 4 + 5.", "ok": "36 + 9 = 45.", "kind": "number"}, {"q": "Calcule : 48 + 20 = …", "a": "68", "tip": "Ajoute 2 dizaines.", "ok": "48 + 20 = 68.", "kind": "number"}, {"q": "Calcule : 59 + 11 = …", "a": "70", "tip": "Ajoute 1 puis 10.", "ok": "59 + 11 = 70.", "kind": "number"}, {"q": "Calcule : 38 + 27 = …", "a": "65", "tip": "Ajoute 20 puis 7.", "ok": "38 + 27 = 65.", "kind": "number"}];const $=id=>document.getElementById(id);let index=0,passed=0,selected=null;
const shapes={triangle:'<polygon points="150,25 265,187 38,187"/>',tri2:'<polygon points="60,35 255,175 35,175"/>',square:'<polygon points="80,35 220,35 220,175 80,175"/>',rectangle:'<polygon points="40,55 260,55 260,165 40,165"/>',circle:'<circle cx="150" cy="110" r="85"/>',oval:'<ellipse cx="150" cy="110" rx="118" ry="67"/>',pentagon:'<polygon points="150,20 258,92 218,190 82,190 42,92"/>',hexagon:'<polygon points="88,31 212,31 274,110 212,189 88,189 26,110"/>',quad:'<polygon points="45,185 83,36 246,52 271,185"/>',open:'<polyline points="32,60 120,170 205,70 270,160"/>'};
function draw(shape){return '<svg viewBox="0 0 300 220" role="img" aria-label="Figure géométrique à identifier"><g fill="'+(shape==='open'?'none':'#a5d8fa')+'" stroke="#164c86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">'+(shapes[shape]||'')+'</g></svg>'}
function render(){let t=tasks[index];selected=null;$('counter').textContent='Question '+(index+1)+' sur 10';$('question').textContent=t.q;$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('done').classList.remove('visible');$('restart').classList.remove('visible');$('result').classList.remove('visible');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=t.kind==='choice';$('choices').hidden=t.kind!=='choice';$('choices').innerHTML='';$('drawing').hidden=!t.shape;$('drawing').innerHTML=t.shape?draw(t.shape):'';if(t.kind==='choice'){t.choices.forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.addEventListener('click',()=>{if(passed!==index)return;selected=c;[...$('choices').children].forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));verify(c)});$('choices').appendChild(b)})}}
function verify(v){let t=tasks[index];if(passed!==index)return;if(String(v)===String(t.a)){passed++;$('feedback').textContent='✅ Bravo ! '+t.ok;$('feedback').className='feedback good';$('fill').style.width=(passed*10)+'%';$('answer').disabled=true;$('check').disabled=true;[...$('choices').children].forEach(b=>b.disabled=true);if(index===9){$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible')}else $('next').classList.add('visible')}else{$('feedback').textContent='Essaie encore. Indice : '+t.tip;$('feedback').className='feedback bad';if(t.kind==='number'){$('answer').focus();$('answer').select()}}}
$('form').addEventListener('submit',e=>{e.preventDefault();const val=$('answer').value.trim();if(val!=='')verify(Number(val))});$('next').addEventListener('click',()=>{if(passed!==index+1)return;index++;render()});$('restart').addEventListener('click',()=>{index=0;passed=0;render()});$('done').addEventListener('click',function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function'){HibouMathLesson.complete({titre:"Calcul mental : additionner rapidement",domaine:"Calcul"},this)}else{this.textContent='✅ Leçon terminée';this.disabled=true}});render()})();</script></body></html>
