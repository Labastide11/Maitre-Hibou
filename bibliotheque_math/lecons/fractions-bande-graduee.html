<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placer des fractions sur une bande graduée — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.toolbar a{background:white;color:#154875;text-decoration:none;font-weight:800;padding:10px 15px;border-radius:12px}.toolbar span{font-weight:800}.lesson-image{display:block;width:100%;height:auto;max-height:calc(100dvh - 90px);object-fit:contain;background:white;border-radius:18px;box-shadow:0 4px 18px #17304f20}.practice{width:100%;margin:14px 0 28px;padding:clamp(16px,2.3vw,32px);border-radius:18px;background:white;box-shadow:0 3px 15px #17304f15}.practice h2{margin:0 0 5px}.hint{color:#48647f}.bar{height:10px;border-radius:12px;background:#e3ecf3;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#247e5b;transition:width .2s}.counter{font-weight:800;color:#41658a}.question{font-size:clamp(1.3rem,2vw,1.7rem);font-weight:800;margin:15px 0}.reply{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reply input{padding:13px;font-size:1.25rem;border:2px solid #a4bdd7;border-radius:12px;width:145px;max-width:100%}.reply button,.next,.done,.restart{min-height:48px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer}.reply button{background:#17659d;color:white}.reply button:disabled{opacity:.5}.next,.done{background:#187552;color:white}.restart{background:#edf3fa;color:#154875}.feedback{font-weight:750;min-height:2rem;margin:12px 0;line-height:1.4}.feedback.bad{color:#a1441f}.feedback.good{color:#147243}.next,.done,.restart,.result{display:none}.visible{display:inline-block}.result.visible{display:block;padding:14px;border-radius:12px;background:#e4f7eb;margin:16px 0}.numberline{display:flex;gap:0;max-width:850px;margin:16px 0 24px}.tick{background:#f0f6fc;border:2px solid #b4cbe0;border-right:0;padding:14px 0;min-width:0;flex:1;color:#17304f;font-size:1rem;font-weight:800;cursor:pointer}.tick:first-child{border-radius:12px 0 0 12px}.tick:last-child{border-right:2px solid #b4cbe0;border-radius:0 12px 12px 0}.tick.selected{background:#ffdae9;border-color:#bc3473;color:#86254d}.tick.correct{background:#cbf1d9;border-color:#217d4d}.fraction-help{font-size:.92rem;color:#52708b;margin-top:5px}.footnote{font-size:.95rem;color:#345775;background:#fff8e6;border-left:4px solid #ddad43;margin-top:12px;padding:11px;border-radius:8px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e6a139;outline-offset:3px}@media(max-width:700px){main{padding:6px}.practice{padding:14px}.toolbar a{padding:9px}.lesson-image{max-height:none}.tick{padding:12px 0;font-size:.8rem}}</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Nombres et fractions</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-fractions-bande-graduee.png" alt="Leçon illustrée : Placer des fractions sur une bande graduée" loading="eager"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">10 exercices. Vérifie ta réponse avant de passer à la suivante.</p><div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="numberline" class="numberline" role="group" aria-label="Choisis une graduation"></div><div class="fraction-help" id="fhelp">Touche la graduation correspondant à la fraction.</div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next" id="next" type="button">Exercice suivant →</button><div class="result" id="result"><strong>Bravo ! Tu as réussi les 10 exercices.</strong><p>Tu peux maintenant valider ta leçon.</p></div><button class="done" id="done" type="button">✅ J’ai compris cette leçon</button><button class="restart" id="restart" type="button">Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>(function(){'use strict';const tasks=[{"q": "Sur une unité partagée en 2, où places-tu 1/2 ?", "n": 1, "d": 2, "tip": "Le numérateur vaut 1, le dénominateur vaut 2."}, {"q": "Sur une unité partagée en 4, où places-tu 3/4 ?", "n": 3, "d": 4, "tip": "Compte 3 graduations à partir de 0."}, {"q": "Sur une unité partagée en 5, où places-tu 2/5 ?", "n": 2, "d": 5, "tip": "Avance de deux cinquièmes."}, {"q": "Sur une unité partagée en 10, où places-tu 7/10 ?", "n": 7, "d": 10, "tip": "Compte 7 graduations sur 10."}, {"q": "Sur une unité partagée en 4, où places-tu 1/4 ?", "n": 1, "d": 4, "tip": "C’est la première graduation."}, {"q": "Sur une unité partagée en 8, où places-tu 5/8 ?", "n": 5, "d": 8, "tip": "Le dénominateur indique 8 parts."}, {"q": "Sur une unité partagée en 6, où places-tu 4/6 ?", "n": 4, "d": 6, "tip": "Compte les graduations : 1, 2, 3, 4."}, {"q": "Sur une unité partagée en 10, où places-tu 9/10 ?", "n": 9, "d": 10, "tip": "C’est la graduation juste avant 1."}, {"q": "Sur une unité partagée en 4, où places-tu 4/4 ?", "n": 4, "d": 4, "tip": "4 parts sur 4 : tu arrives à 1."}, {"q": "Sur une unité partagée en 8, où places-tu 6/8 ?", "n": 6, "d": 8, "tip": "Compte 6 parts égales depuis 0."}];const $=id=>document.getElementById(id);let i=0,passed=0,chosen=null;
function render(){let t=tasks[i];$('counter').textContent='Exercice '+(i+1)+' sur 10';$('question').textContent=t.q;$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('done').classList.remove('visible');$('result').classList.remove('visible');$('restart').classList.remove('visible');chosen=null;
let n=$('numberline');n.innerHTML='';for(let k=0;k<=t.d;k++){let b=document.createElement('button');b.type='button';b.className='tick';b.textContent=k===0?'0':(k===t.d?'1':k+'/'+t.d);b.addEventListener('click',()=>{if(passed!==i)return;chosen=k;n.querySelectorAll('.tick').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');verify(k)});n.appendChild(b)}
}
function verify(value){let t=tasks[i],right=true?t.n:t.a;if(value===right){$('feedback').textContent='✅ Bravo ! '+(true?'Tu as bien compté '+t.n+' graduation'+(t.n>1?'s':'')+' sur '+t.d+'.':t.tip);$('feedback').className='feedback good';passed++;$('fill').style.width=(passed*10)+'%';$('numberline').querySelectorAll('.tick').forEach(b=>b.disabled=true);if(i===9){$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible')}else{$('next').classList.add('visible')}}else{$('feedback').textContent='Essaie encore. Indice : '+t.tip;$('feedback').className='feedback bad';}}

$('next').addEventListener('click',()=>{if(passed!==i+1)return;i++;render()});$('restart').addEventListener('click',()=>{i=0;passed=0;render()});$('done').addEventListener('click',function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function'){HibouMathLesson.complete({titre:"Placer des fractions sur une bande graduée",domaine:"Nombres et fractions"},this)}else{this.textContent='✅ Leçon terminée';this.disabled=true}});render()})();</script></body></html>
