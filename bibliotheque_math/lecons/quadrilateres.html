<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconnaître les quadrilatères — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.toolbar a{background:#fff;border-radius:12px;padding:11px 15px;font-weight:800;color:#154875;text-decoration:none}.lesson-image{display:block;width:100%;height:auto;max-height:calc(100dvh - 92px);object-fit:contain;border-radius:16px;background:white}.practice{background:white;margin-top:14px;padding:clamp(15px,3vw,32px);border-radius:18px;width:100%;box-shadow:0 4px 20px #17304f18}.practice h2{margin:0}.bar{height:11px;background:#e4edf5;border-radius:12px;margin:16px 0;overflow:hidden}.bar i{display:block;height:100%;background:#24845b;width:0%}.counter{color:#496c91;font-weight:800}.question{font-size:clamp(1.2rem,2.1vw,1.6rem);font-weight:800;margin:14px 0}.visual{background:#f2f7fd;border:1px solid #c4d9ed;border-radius:14px;margin:16px auto;max-width:620px;display:flex;justify-content:center;align-items:center;min-height:210px;padding:14px}.visual svg{width:min(100%,510px);height:205px}.options{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.option,.verify,.next,.done,.again{min-height:48px;border-radius:12px;padding:10px 17px;font-weight:800;font-size:1rem;cursor:pointer;border:2px solid #b7cfe8;background:#eff6ff;color:#183653}.option.selected{background:#cce8fa;border-color:#1974bf}.option.bad{background:#ffe2e2;border-color:#c44848}.option.good{background:#ddf9e5;border-color:#208750}.verify{background:#155f9b;color:white;border:0}.next,.done{background:#167853;color:white;border:0}.next[hidden],.done[hidden],.again[hidden],.verify[hidden]{display:none}.feedback{min-height:32px;font-weight:750;margin:12px 0;color:#315879}.feedback.good{color:#166c43}.feedback.bad{color:#a24121}.input{font-size:1.3rem;border-radius:11px;padding:12px;border:2px solid #a8c5df;width:140px}.grid{display:grid;grid-template-columns:35px repeat(5,minmax(30px,1fr));max-width:410px;width:100%;gap:3px}.grid .head{text-align:center;font-weight:800;padding:8px}.cell{aspect-ratio:1;min-width:0;border:2px solid #9db7ca;background:white;border-radius:5px;cursor:pointer;font-size:1.3rem}.cell.focused{background:#ffeeb3;border-color:#f08b1b}.cell.mark{background:#b8e5ff}.grid-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}.status{font-size:.9rem;color:#46617d}@media(max-width:600px){main{padding:6px}.toolbar{font-size:.85rem}.toolbar a{padding:9px}.visual{min-height:180px}.visual svg{height:175px}.practice{padding:14px}}</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><b>Géométrie</b></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-quadrilateres.png" alt="Leçon illustrée : Reconnaître les quadrilatères"><section class="practice"><h2>À toi de jouer !</h2><p>Observe, choisis ta réponse puis vérifie. Une bonne réponse permet de continuer.</p><div class="bar"><i id="fill"></i></div><div class="counter" id="count"></div><div class="question" id="question"></div><div class="visual" id="visual"></div><div id="options" class="options"></div><button type="button" id="verify" class="verify">Vérifier</button><div id="feedback" class="feedback" aria-live="polite"></div><button type="button" class="next" id="next" hidden>Exercice suivant →</button><button type="button" id="done" class="done" hidden>✅ J’ai compris cette leçon</button><button type="button" class="again" id="again" hidden>Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>
(()=>{const tasks=[{"shape": "square", "q": "Quel est le nom de cette figure ?", "opts": ["Carré", "Losange", "Triangle"], "a": "Carré", "tip": "Elle a quatre côtés égaux et quatre angles droits."}, {"shape": "rectangle", "q": "Quel est le nom de cette figure ?", "opts": ["Rectangle", "Triangle", "Cercle"], "a": "Rectangle", "tip": "Elle possède quatre angles droits."}, {"shape": "rhombus", "q": "Quel est le nom de cette figure ?", "opts": ["Losange", "Carré", "Triangle"], "a": "Losange", "tip": "Ses quatre côtés sont égaux ; ici, aucun angle n’est droit."}, {"shape": "irregular", "q": "Combien de côtés a cette figure ?", "opts": ["3", "4", "5"], "a": "4", "tip": "Compte les côtés."}, {"shape": "square-rot", "q": "Ce carré est tourné. Reste-t-il un carré ?", "opts": ["Oui", "Non"], "a": "Oui", "tip": "Tourner une figure ne change pas ses propriétés."}, {"shape": "rectangle", "q": "Combien d’angles droits a un rectangle ?", "opts": ["2", "3", "4"], "a": "4", "tip": "Cherche les quatre coins."}, {"shape": "rhombus", "q": "Combien de côtés de même longueur possède un losange ?", "opts": ["2", "3", "4"], "a": "4", "tip": "Les quatre petites marques sont identiques."}, {"shape": "irregular", "q": "Comment s’appelle une figure à quatre côtés ?", "opts": ["Triangle", "Quadrilatère", "Pentagone"], "a": "Quadrilatère", "tip": "Son nom indique quatre côtés."}, {"shape": "square", "q": "Quelle propriété distingue un carré du losange dessiné ?", "opts": ["4 angles droits", "3 côtés", "Aucun sommet"], "a": "4 angles droits", "tip": "Observe le petit carré dans chaque angle."}, {"shape": "rectangle-rot", "q": "Le rectangle est incliné. Combien a-t-il d’angles droits ?", "opts": ["0", "2", "4"], "a": "4", "tip": "L’orientation ne change pas ses angles."}];const drawings={"triangle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><polygon points=\"105,175 240,38 384,175\" fill=\"#bbe0ff\" stroke=\"#16518b\" stroke-width=\"5\"/></svg>", "right": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><polygon points=\"105,172 105,48 360,172\" fill=\"#ffd58f\" stroke=\"#16518b\" stroke-width=\"5\"/><path d=\"M105 150 H127 V172\" fill=\"none\" stroke=\"#ed4781\" stroke-width=\"5\"/></svg>", "rightrot": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><g transform=\"rotate(29 230 112)\"><polygon points=\"115,172 115,50 375,172\" fill=\"#ffd58f\" stroke=\"#16518b\" stroke-width=\"5\"/><path d=\"M115 151 H136 V172\" fill=\"none\" stroke=\"#ed4781\" stroke-width=\"5\"/></g></svg>", "iso": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><polygon points=\"100,174 240,25 380,174\" fill=\"#e5d1ff\" stroke=\"#16518b\" stroke-width=\"5\"/><path d=\"M158 115 L176 132 M305 132 L322 115\" stroke=\"#ef3f72\" stroke-width=\"5\"/></svg>", "equil": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><polygon points=\"110,176 240,28 370,176\" fill=\"#d5f2d2\" stroke=\"#16518b\" stroke-width=\"5\"/><path d=\"M159 100 L176 116 M306 116 L323 100 M235 175 V157\" stroke=\"#ef3f72\" stroke-width=\"5\"/></svg>", "scalene": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><polygon points=\"70,172 161,35 407,172\" fill=\"#bbe0ff\" stroke=\"#16518b\" stroke-width=\"5\"/></svg>", "square": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><rect x=\"168\" y=\"36\" width=\"150\" height=\"150\" fill=\"#c8e7ff\" stroke=\"#164f89\" stroke-width=\"5\"/><path d=\"M168 55 H187 V36 M299 36 V55 H318 M318 167 H299 V186 M187 186 V167 H168\" stroke=\"#f13c6f\" fill=\"none\" stroke-width=\"4\"/></svg>", "square-rot": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><rect x=\"178\" y=\"41\" width=\"145\" height=\"145\" transform=\"rotate(45 250 114)\" fill=\"#c8e7ff\" stroke=\"#164f89\" stroke-width=\"5\"/></svg>", "rectangle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><rect x=\"95\" y=\"50\" width=\"300\" height=\"132\" fill=\"#f9d6a7\" stroke=\"#164f89\" stroke-width=\"5\"/><path d=\"M95 70 H115 V50 M375 50 V70 H395 M395 162 H375 V182 M115 182 V162 H95\" stroke=\"#f13c6f\" stroke-width=\"4\" fill=\"none\"/></svg>", "rectangle-rot": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><rect x=\"95\" y=\"52\" width=\"300\" height=\"120\" transform=\"rotate(-19 245 112)\" fill=\"#f9d6a7\" stroke=\"#164f89\" stroke-width=\"5\"/></svg>", "rhombus": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><polygon points=\"250,22 400,112 250,202 100,112\" fill=\"#d6f2ba\" stroke=\"#164f89\" stroke-width=\"5\"/><path d=\"M163 72 l10 17 M325 90 l10 -17 M163 151 l10 -17 M327 133 l10 17\" stroke=\"#ef477b\" stroke-width=\"5\"/></svg>", "irregular": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 220\" role=\"img\" aria-label=\"Figure à observer\"><polygon points=\"130,48 342,26 401,173 94,180\" fill=\"#ded1fa\" stroke=\"#164f89\" stroke-width=\"5\"/></svg>"};let index=0,passed=0,choice=null;const $=id=>document.getElementById(id);function render(){const t=tasks[index];$('count').textContent='Exercice '+(index+1)+' sur 10';$('question').textContent=t.q;$('visual').innerHTML=drawings[t.shape];$('options').replaceChildren();choice=null;for(const opt of t.opts){const b=document.createElement('button');b.className='option';b.textContent=opt;b.type='button';b.onclick=()=>{choice=opt;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)}$('verify').hidden=false;$('feedback').textContent='';$('feedback').className='feedback';$('next').hidden=true;$('done').hidden=true;$('again').hidden=true;$('fill').style.width=(passed*10)+'%'}$('verify').onclick=()=>{const t=tasks[index];if(choice===null){$('feedback').textContent='Choisis d’abord une réponse.';return}if(choice===t.a){passed++;$('fill').style.width=(passed*10)+'%';$('feedback').className='feedback good';$('feedback').textContent='Bravo ! Bonne réponse.';$('verify').hidden=true;$('options').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===choice)b.classList.add('good')});if(index===9){$('done').hidden=false;$('again').hidden=false}else $('next').hidden=false}else{$('feedback').className='feedback bad';$('feedback').textContent='Essaie encore. Indice : '+t.tip;$('options').querySelectorAll('button').forEach(b=>{if(b.textContent===choice)b.classList.add('bad')})}};$('next').onclick=()=>{if(passed!==index+1)return;index++;render()};$('again').onclick=()=>{index=0;passed=0;render()};$('done').onclick=function(){if(passed!==10)return;if(window.HibouMathLesson?.complete)HibouMathLesson.complete({titre:"Reconnaître les quadrilatères",domaine:'Géométrie'},this);else{this.disabled=true;this.textContent='Leçon terminée'}};render()})();
</script></body></html>
