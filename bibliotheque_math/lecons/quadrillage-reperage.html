<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Se repérer sur un quadrillage — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.toolbar a{background:#fff;border-radius:12px;padding:11px 15px;font-weight:800;color:#154875;text-decoration:none}.lesson-image{display:block;width:100%;height:auto;max-height:calc(100dvh - 92px);object-fit:contain;border-radius:16px;background:white}.practice{background:white;margin-top:14px;padding:clamp(15px,3vw,32px);border-radius:18px;width:100%;box-shadow:0 4px 20px #17304f18}.practice h2{margin:0}.bar{height:11px;background:#e4edf5;border-radius:12px;margin:16px 0;overflow:hidden}.bar i{display:block;height:100%;background:#24845b;width:0%}.counter{color:#496c91;font-weight:800}.question{font-size:clamp(1.2rem,2.1vw,1.6rem);font-weight:800;margin:14px 0}.visual{background:#f2f7fd;border:1px solid #c4d9ed;border-radius:14px;margin:16px auto;max-width:620px;display:flex;justify-content:center;align-items:center;min-height:210px;padding:14px}.visual svg{width:min(100%,510px);height:205px}.options{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.option,.verify,.next,.done,.again{min-height:48px;border-radius:12px;padding:10px 17px;font-weight:800;font-size:1rem;cursor:pointer;border:2px solid #b7cfe8;background:#eff6ff;color:#183653}.option.selected{background:#cce8fa;border-color:#1974bf}.option.bad{background:#ffe2e2;border-color:#c44848}.option.good{background:#ddf9e5;border-color:#208750}.verify{background:#155f9b;color:white;border:0}.next,.done{background:#167853;color:white;border:0}.next[hidden],.done[hidden],.again[hidden],.verify[hidden]{display:none}.feedback{min-height:32px;font-weight:750;margin:12px 0;color:#315879}.feedback.good{color:#166c43}.feedback.bad{color:#a24121}.input{font-size:1.3rem;border-radius:11px;padding:12px;border:2px solid #a8c5df;width:140px}.grid{display:grid;grid-template-columns:35px repeat(5,minmax(30px,1fr));max-width:410px;width:100%;gap:3px}.grid .head{text-align:center;font-weight:800;padding:8px}.cell{aspect-ratio:1;min-width:0;border:2px solid #9db7ca;background:white;border-radius:5px;cursor:pointer;font-size:1.3rem}.cell.focused{background:#ffeeb3;border-color:#f08b1b}.cell.mark{background:#b8e5ff}.grid-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}.status{font-size:.9rem;color:#46617d}@media(max-width:600px){main{padding:6px}.toolbar{font-size:.85rem}.toolbar a{padding:9px}.visual{min-height:180px}.visual svg{height:175px}.practice{padding:14px}}</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><b>Géométrie</b></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-quadrillage.png" alt="Leçon illustrée : Se repérer sur un quadrillage"><section class="practice"><h2>À toi de jouer !</h2><p>10 exercices pour trouver une case ou suivre un déplacement. Vérifie avant de passer au suivant.</p><div class="bar"><i id="fill"></i></div><div id="count" class="counter"></div><div id="question" class="question"></div><div class="grid-wrap"><div id="grid" class="grid"></div><div class="status" id="hint"></div><div id="answerbox" hidden><label for="answer">Nom de la case : </label><input class="input" id="answer" placeholder="Ex. B3" maxlength="2" spellcheck="false" autocapitalize="characters"></div></div><p><button class="verify" type="button" id="verify">Vérifier</button></p><div id="feedback" class="feedback" aria-live="polite"></div><button type="button" id="next" class="next" hidden>Exercice suivant →</button><button type="button" id="done" class="done" hidden>✅ J’ai compris cette leçon</button><button type="button" id="again" class="again" hidden>Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>(()=>{const tasks=[{"type": "point", "a": "B3", "q": "Clique sur la case B3.", "start": null}, {"type": "point", "a": "D1", "q": "Clique sur la case D1.", "start": null}, {"type": "point", "a": "A5", "q": "Clique sur la case A5.", "start": null}, {"type": "name", "a": "C2", "q": "Quelle est la case colorée ?", "start": null}, {"type": "name", "a": "E4", "q": "Quelle est la case colorée ?", "start": null}, {"type": "point", "a": "D5", "q": "Clique sur la case D5.", "start": null}, {"type": "move", "a": "C2", "q": "Départ B2 : avance d’une case à droite. Clique sur l’arrivée.", "start": "B2"}, {"type": "move", "a": "D3", "q": "Départ D1 : descends de deux cases. Clique sur l’arrivée.", "start": "D1"}, {"type": "move", "a": "A2", "q": "Départ C2 : recule de deux cases à gauche. Clique sur l’arrivée.", "start": "C2"}, {"type": "move", "a": "E5", "q": "Départ D4 : avance d’une case à droite et d’une case en bas. Clique sur l’arrivée.", "start": "D4"}];const $=id=>document.getElementById(id);let index=0,passed=0,selected='';function render(){const t=tasks[index];$('count').textContent='Exercice '+(index+1)+' sur 10';$('question').textContent=t.q;$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').hidden=true;$('done').hidden=true;$('again').hidden=true;$('verify').hidden=false;selected='';$('answerbox').hidden=t.type!=='name';$('answer').value='';$('hint').textContent=t.type==='name'?'Observe la case jaune, puis écris sa lettre et son numéro.':'Touche la case d’arrivée sur le quadrillage.';const grid=$('grid');grid.replaceChildren();const blank=document.createElement('div');grid.appendChild(blank);for(const c of 'ABCDE'){const e=document.createElement('div');e.className='head';e.textContent=c;grid.appendChild(e)}for(let r=1;r<=5;r++){let head=document.createElement('div');head.className='head';head.textContent=r;grid.appendChild(head);for(const col of 'ABCDE'){const code=col+r;let cell=document.createElement('button');cell.type='button';cell.className='cell';cell.setAttribute('aria-label','Case '+code);if(t.type==='name'&&code===t.a){cell.classList.add('focused');cell.textContent='★';cell.disabled=true}else if(code===t.start){cell.classList.add('mark');cell.textContent='●'}cell.onclick=()=>{if(t.type==='name')return;selected=code;grid.querySelectorAll('.cell').forEach(e=>e.classList.remove('focused'));cell.classList.add('focused')};grid.appendChild(cell)}}}$('verify').onclick=()=>{const t=tasks[index];const a=t.type==='name'?$('answer').value.trim().toUpperCase():selected;if(!a){$('feedback').textContent='Réponds d’abord.';return}if(a===t.a){passed++;$('feedback').className='feedback good';$('feedback').textContent='Bravo ! La bonne case est '+t.a+'.';$('fill').style.width=(passed*10)+'%';$('verify').hidden=true;$('grid').querySelectorAll('button').forEach(b=>b.disabled=true);$('answer').disabled=true;if(index===9){$('done').hidden=false;$('again').hidden=false}else $('next').hidden=false}else{$('feedback').className='feedback bad';$('feedback').textContent='Essaie encore. Regarde d’abord la colonne (lettre), puis la ligne (nombre).'}};$('next').onclick=()=>{if(passed!==index+1)return;index++;$('answer').disabled=false;render()};$('again').onclick=()=>{index=0;passed=0;$('answer').disabled=false;render()};$('done').onclick=function(){if(passed!==10)return;if(window.HibouMathLesson?.complete)HibouMathLesson.complete({titre:'Se repérer sur un quadrillage',domaine:'Géométrie'},this);else{this.disabled=true;this.textContent='Leçon terminée'}};render()})();</script></body></html>
