<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poser et effectuer une soustraction — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.toolbar a{background:#fff;color:#154875;padding:10px 15px;border-radius:12px;text-decoration:none;font-weight:800}.toolbar span{font-weight:800}.lesson-image{display:block;width:100%;height:auto;object-fit:contain;border-radius:17px;background:#fff;box-shadow:0 3px 15px #17304f20}.practice{width:100%;background:#fff;border-radius:17px;padding:clamp(18px,3vw,36px);margin:14px 0 28px;box-shadow:0 3px 15px #17304f20}.practice h2{font-size:clamp(23px,3vw,36px);margin:0}.intro{color:#506a82;font-size:17px}.bar{height:11px;border-radius:30px;overflow:hidden;background:#dce8f1;margin:18px 0}.bar span{height:100%;width:0;background:#23845d;display:block;transition:width .25s}.count{font-weight:850;color:#466b8c}.question{font-size:clamp(23px,3vw,34px);font-weight:850;line-height:1.35;margin:20px 0}.illustration{display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 0;font-size:18px}.illustration.visible{display:flex}.fraction-strip{display:inline-flex;width:220px;max-width:100%;height:55px;border:2px solid #17304f;border-radius:4px;overflow:hidden}.fraction-strip i{flex:1;border-right:2px solid #17304f;background:#fff}.fraction-strip i:last-child{border-right:0}.fraction-strip i.filled{background:#58b2eb}.fraction-caption{font-size:16px;margin:0 8px;font-weight:850}.reply{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reply input{width:170px;max-width:100%;padding:12px 14px;border-radius:12px;border:2px solid #8eafcd;font-size:25px;color:#17304f}.reply button,.next,.done,.restart{font-size:17px;min-height:48px;padding:12px 19px;font-weight:850;border:0;border-radius:12px;cursor:pointer}.reply button{background:#256caa;color:white}.next{display:none;background:#1c7852;color:white;margin-top:12px}.next.visible,.done.visible,.restart.visible{display:inline-block}.done{display:none;background:#167554;color:white;margin-top:13px}.restart{display:none;background:#e0ebf5;color:#17304f;margin:13px 0 0 9px}.feedback{font-size:18px;font-weight:750;min-height:2.3em;line-height:1.4;margin:12px 0}.feedback.good{color:#167046}.feedback.try{color:#a04e18}.result{display:none;background:#e5f7ec;border-radius:14px;padding:15px;font-size:18px}.result.visible{display:block}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #efae27;outline-offset:3px}@media(max-width:700px){main{padding:6px}.lesson-image{border-radius:9px}.practice{padding:16px}.toolbar a{padding:8px}.toolbar span{font-size:14px}}</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Calcul</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-soustraction-posee.png" alt="Leçon illustrée : Poser et effectuer une soustraction" loading="eager"><section class="practice" aria-labelledby="practice-title"><h2 id="practice-title">À toi de jouer !</h2><p class="intro">10 exercices progressifs. Écris ta réponse et clique sur « Vérifier ». Tu passes au suivant après une bonne réponse.</p><div class="bar" aria-hidden="true"><span id="bar-fill"></span></div><div class="count" id="count"></div><div class="question" id="question"></div><div id="illustration" class="illustration" aria-label="Représentation colorée des parts égales"></div><form id="form" class="reply" autocomplete="off"><label for="value">Ta réponse :</label><input id="value" type="text" inputmode="text" required aria-describedby="feedback" placeholder="ex. 42"><button id="check" type="submit">Vérifier</button></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button id="next" type="button" class="next">Exercice suivant →</button><div id="result" class="result"><strong>Bravo ! Tu as terminé les 10 exercices.</strong><p>Tu peux maintenant valider cette leçon.</p></div><button id="done" class="done" type="button">✅ J’ai compris cette leçon</button><button id="restart" class="restart" type="button">Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>window.lessonTasks=[{"q": "38 − 12 = ?", "a": 26, "hint": "Soustrais les unités, puis les dizaines.", "why": "8 − 2 = 6 et 3 − 1 = 2."}, {"q": "67 − 24 = ?", "a": 43, "hint": "7 − 4 et 6 − 2.", "why": "67 − 24 = 43."}, {"q": "95 − 53 = ?", "a": 42, "hint": "Commence par les unités.", "why": "5 − 3 = 2 et 9 − 5 = 4."}, {"q": "538 − 216 = ?", "a": 322, "hint": "Aligne C, D et U.", "why": "538 − 216 = 322."}, {"q": "76 − 38 = ?", "a": 38, "hint": "Échange une dizaine pour avoir 16 unités.", "why": "16 − 8 = 8 et 6 − 3 = 3."}, {"q": "84 − 57 = ?", "a": 27, "hint": "Échange 1 dizaine : 14 − 7.", "why": "14 − 7 = 7 et 7 − 5 = 2."}, {"q": "143 − 28 = ?", "a": 115, "hint": "Échange une dizaine contre 10 unités.", "why": "13 − 8 = 5 et 3 − 2 = 1."}, {"q": "352 − 176 = ?", "a": 176, "hint": "Il faut échanger aux unités et aux dizaines.", "why": "352 − 176 = 176."}, {"q": "403 − 175 = ?", "a": 228, "hint": "Quand il n’y a pas de dizaines, échange une centaine en dizaines.", "why": "403 − 175 = 228."}, {"q": "621 − 284 = ?", "a": 337, "hint": "Vérifie : résultat + 284 = 621.", "why": "337 + 284 = 621."}];window.lessonMeta={"titre": "Poser et effectuer une soustraction", "domaine": "Calcul"};(function(){"use strict";const tasks=window.lessonTasks,$=id=>document.getElementById(id);let index=0,success=0;function render(){const t=tasks[index];$('count').textContent='Exercice '+(index+1)+' sur '+tasks.length;$('question').textContent=t.q;$('bar-fill').style.width=(success/tasks.length*100)+'%';$('value').value='';$('value').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('result').classList.remove('visible');$('done').classList.remove('visible');$('restart').classList.remove('visible');const vis=$('illustration');vis.replaceChildren();vis.classList.remove('visible');if(t.bar){const bar=document.createElement('span');bar.className='fraction-strip';for(let i=0;i<t.bar[1];i++){const cell=document.createElement('i');if(i<t.bar[0])cell.className='filled';bar.appendChild(cell)}vis.appendChild(bar);vis.classList.add('visible')}}function normalize(v){return v.trim().replace(/\s+/g,'').replace(/⁄/g,'/').toLowerCase()}$('form').addEventListener('submit',function(e){e.preventDefault();const t=tasks[index],raw=normalize($('value').value),correct=normalize(String(t.a));if(!raw)return;if(raw===correct){success++;$('value').disabled=true;$('check').disabled=true;$('feedback').className='feedback good';$('feedback').textContent='✅ Bravo ! '+t.why;$('bar-fill').style.width=(success/tasks.length*100)+'%';if(index<tasks.length-1){$('next').classList.add('visible')}else{$('form').hidden=true;$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible')}}else{$('feedback').className='feedback try';$('feedback').textContent='Essaie encore. Indice : '+t.hint;$('value').focus();$('value').select()}});$('next').addEventListener('click',()=>{if(success!==index+1)return;index++;render();$('value').focus()});$('restart').addEventListener('click',()=>{index=0;success=0;render();$('value').focus()});$('done').addEventListener('click',function(){if(success!==tasks.length)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function'){HibouMathLesson.complete(window.lessonMeta,this)}else{this.textContent='✅ Leçon terminée';this.disabled=true}});render()})();</script></body></html>
