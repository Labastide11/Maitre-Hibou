<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Résoudre un problème de groupes égaux — Maître Hibou</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}
main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.toolbar a{background:white;color:#154875;text-decoration:none;font-weight:800;padding:10px 15px;border-radius:12px}.toolbar span{font-weight:800}
.lesson-image{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:white;border-radius:18px;box-shadow:0 4px 18px #17304f20}
.practice{width:100%;margin:14px 0 28px;padding:clamp(16px,2.3vw,32px);border-radius:18px;background:white;box-shadow:0 3px 15px #17304f15}
.practice h2{margin:0 0 5px}.hint{color:#48647f}.bar{height:10px;border-radius:12px;background:#e3ecf3;overflow:hidden;margin:16px 0}.fill{height:100%;width:0;background:#247e5b;transition:width .2s}
.counter{font-weight:800;color:#41658a}.question{font-size:clamp(1.25rem,2vw,1.65rem);font-weight:800;margin:15px 0}.subquestion{font-size:1rem;color:#4d6f8f;margin-top:-8px;margin-bottom:12px;line-height:1.45}
.reply{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reply input{padding:13px;font-size:1.2rem;border:2px solid #a4bdd7;border-radius:12px;width:180px;max-width:100%}
.reply button,.next,.done,.restart,.choicebtn{min-height:48px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer}
.reply button{background:#17659d;color:white}.reply button:disabled{opacity:.5}.next,.done{background:#187552;color:white}.restart{background:#edf3fa;color:#154875}
.feedback{font-weight:750;min-height:2rem;margin:12px 0;line-height:1.4}.feedback.bad{color:#a1441f}.feedback.good{color:#147243}
.next,.done,.restart,.result,.reply.hidden,#choices.hidden{display:none}.visible{display:inline-block}.result.visible{display:block;padding:14px;border-radius:12px;background:#e4f7eb;margin:16px 0}
#choices{display:flex;gap:10px;flex-wrap:wrap}.choicebtn{background:#ebf5ff;color:#17304f;border:2px solid #aec9e5}.choicebtn.correct{background:#d8f5e2;border-color:#22834d}.choicebtn.wrong{background:#ffe2e2;border-color:#bd4343}
.footnote{font-size:.95rem;color:#345775;background:#fff8e6;border-left:4px solid #ddad43;margin-top:12px;padding:11px;border-radius:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e6a139;outline-offset:3px}
@media(max-width:700px){main{padding:6px}.practice{padding:14px}.toolbar a{padding:9px}.reply input{width:140px}}
</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Problèmes</span></nav><img class="lesson-image" src="../../images-lecons/maths/maitre-hibou-groupes-egaux.png" alt="Leçon illustrée : Résoudre un problème de groupes égaux" loading="eager"><section class="practice"><h2>À toi de jouer !</h2><p class="hint">10 questions. Vérifie ta réponse avant de passer à la suivante.</p><div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div id="subquestion" class="subquestion"></div><form id="reply" class="reply" autocomplete="off"><label for="answer">Ta réponse :</label><input id="answer" type="text" inputmode="text" required><button id="check" type="submit">Vérifier</button></form><div id="choices" class="hidden" role="group" aria-label="Choisis une réponse"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next" id="next" type="button">Question suivante →</button><div class="result" id="result"><strong>Bravo ! Tu as réussi les 10 questions.</strong><p>Tu peux maintenant valider ta leçon.</p></div><button class="done" id="done" type="button">✅ J’ai compris cette leçon</button><button class="restart" id="restart" type="button">Recommencer</button><div class="footnote">Repère le nombre de groupes et le nombre d’objets dans chaque groupe.</div></section></main><script src="../js/math-lecons.js"></script><script>(function(){'use strict';const tasks=[{"type": "choice", "q": "Dans un problème de groupes égaux, on a souvent…", "choices": ["plusieurs groupes avec le même nombre d’objets", "des objets tous différents", "une seule boîte"], "a": "plusieurs groupes avec le même nombre d’objets", "tip": "Tous les groupes ont la même quantité.", "ok": "Oui, on a des groupes égaux."}, {"type": "input", "q": "4 boîtes contiennent 3 billes chacune. Combien y a-t-il de billes en tout ?", "a": "12", "tip": "Cherche 4 groupes de 3.", "ok": "4 groupes de 3, cela fait 12."}, {"type": "input", "q": "5 rangées de 2 chaises. Combien de chaises en tout ?", "a": "10", "tip": "Addition répétée ou multiplication : 5 × 2.", "ok": "5 groupes de 2 = 10."}, {"type": "choice", "q": "Quel calcul convient pour 3 paquets de 6 gâteaux ?", "choices": ["3 × 6", "3 + 6", "6 - 3"], "a": "3 × 6", "tip": "On a 3 groupes de 6.", "ok": "Oui, 3 × 6 convient."}, {"type": "input", "q": "2 équipes ont 8 joueurs chacune. Combien de joueurs en tout ?", "a": "16", "tip": "2 groupes de 8.", "ok": "2 × 8 = 16."}, {"type": "input", "q": "6 sacs contiennent 4 billes chacun. Combien de billes en tout ?", "a": "24", "tip": "Pense à 6 × 4.", "ok": "6 groupes de 4 = 24."}, {"type": "choice", "q": "Dans “7 paniers de 5 pommes”, quel est le nombre d’objets dans chaque groupe ?", "choices": ["7", "5", "12"], "a": "5", "tip": "Chaque panier contient 5 pommes.", "ok": "Oui, chaque groupe contient 5."}, {"type": "input", "q": "3 bouquets ont 9 fleurs chacun. Combien de fleurs en tout ?", "a": "27", "tip": "Calcule 3 × 9.", "ok": "3 groupes de 9 = 27."}, {"type": "choice", "q": "Quelle phrase décrit bien un problème de groupes égaux ?", "choices": ["4 paquets de 3 crayons", "4 crayons et 3 gommes", "4 crayons puis on en enlève 3"], "a": "4 paquets de 3 crayons", "tip": "On cherche des groupes qui ont tous la même taille.", "ok": "Oui, c’est un problème de groupes égaux."}, {"type": "input", "q": "8 assiettes ont 2 biscuits chacune. Combien de biscuits en tout ?", "a": "16", "tip": "8 groupes de 2.", "ok": "8 × 2 = 16."}];const $=id=>document.getElementById(id);let i=0,passed=0;function render(){const t=tasks[i];$('counter').textContent='Question '+(i+1)+' sur 10';$('question').textContent=t.q;$('subquestion').textContent=t.sub||'';$('fill').style.width=(passed*10)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('visible');$('done').classList.remove('visible');$('result').classList.remove('visible');$('restart').classList.remove('visible');$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('reply').classList.remove('hidden');$('choices').innerHTML='';$('choices').className='hidden';if(t.type==='choice'){$('reply').classList.add('hidden');$('choices').className='';t.choices.forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='choicebtn';b.textContent=ch;b.addEventListener('click',()=>checkChoice(ch,b));$('choices').appendChild(b);});}}function finishIfNeeded(){if(i===9){$('result').classList.add('visible');$('done').classList.add('visible');$('restart').classList.add('visible');}else{$('next').classList.add('visible');}}function good(msg){$('feedback').textContent='✅ Bravo ! '+msg;$('feedback').className='feedback good';passed++;$('fill').style.width=(passed*10)+'%';finishIfNeeded();}function bad(msg){$('feedback').textContent='Essaie encore. Indice : '+msg;$('feedback').className='feedback bad';}$('reply').addEventListener('submit',function(e){e.preventDefault();const t=tasks[i];const raw=$('answer').value.trim();if(!raw)return;const normalized=raw.toLowerCase().replace(/\s+/g,'');const answers=(Array.isArray(t.a)?t.a:[t.a]).map(v=>String(v).toLowerCase().replace(/\s+/g,''));if(answers.includes(normalized)){$('answer').disabled=true;$('check').disabled=true;good(t.ok||('La bonne réponse est '+(Array.isArray(t.a)?t.a[0]:t.a)+'.'));}else bad(t.tip);});function checkChoice(choice,btn){const t=tasks[i];if(String(choice)===String(t.a)){Array.from($('choices').children).forEach(x=>x.disabled=true);btn.classList.add('correct');good(t.ok||'C’est la bonne réponse.');}else{btn.classList.add('wrong');btn.disabled=true;bad(t.tip);}}$('next').addEventListener('click',()=>{if(passed!==i+1)return;i++;render();});$('restart').addEventListener('click',()=>{i=0;passed=0;render();});$('done').addEventListener('click',function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof HibouMathLesson.complete==='function'){HibouMathLesson.complete({titre:"Résoudre un problème de groupes égaux",domaine:"Problèmes"},this)}else{this.textContent='✅ Leçon terminée';this.disabled=true;}});render();})();</script></body></html>
