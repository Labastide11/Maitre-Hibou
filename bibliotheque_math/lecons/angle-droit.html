r(let old of $('options').children)old.classList.remove('selected');b.classList.add('selected')};$('options').appendChild(b)}$('verify').hidden=false;$('next').hidden=true;$('done').hidden=true;$('restart').hidden=true;$('feedback').className='feedback';$('feedback').textContent=''}$('verify').onclick=()=>{let t=tasks[i];if(choice===null){$('feedback').textContent='Choisis une réponse.';return}if(choice===t.a){passed++;$('fill').style.width=(passed*10)+'%';$('feedback').className='feedback ok';$('feedback').textContent='Bravo ! Bonne réponse.';$('verify').hidden=true;for(let b of $('options').children){b.disabled=true;if(b.textContent===choice)b.classList.add('correct')}if(i===9){$('done').hidden=false;$('restart').hidden=false}else $('next').hidden=false}else{$('feedback').className='feedback no';$('feedback').textContent='Essaie encore. Indice : '+t.tip;for(let b of $('options').children)if(b.textContent===choice)b.classList.add('wrong')}};$('next').onclick=()=>{if(passed!==i+1)return;i++;render()};$('restart').onclick=()=>{i=0;passed=0;render()};$('done').onclick=function(){if(passed!==10)return;if(window.HibouMathLesson&&typeof window.HibouMathLesson.complete==='function')window.HibouMathLesson.complete({titre:"Reconnaître un angle droit",domaine:'Géométrie'},this);else{this.textContent='✅ Leçon terminée';this.disabled=true}};render()})();</script></body></html>
