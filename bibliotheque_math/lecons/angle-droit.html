<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconnaître un angle droit et comparer les angles — Maître Hibou</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;font:18px system-ui,Arial;color:#183452}main{max-width:1400px;margin:auto;padding:12px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.nav a{background:white;padding:10px 16px;border-radius:12px;color:#174c81;text-decoration:none;font-weight:bold}.lesson{display:block;width:100%;max-height:calc(100dvh - 90px);object-fit:contain;background:white;border-radius:18px}.exercise{width:100%;background:white;border-radius:18px;padding:clamp(15px,2vw,30px);margin:14px 0 28px}.progress{height:10px;background:#e5ecf5;border-radius:8px;overflow:hidden}.fill{width:0;height:100%;background:#27885a}.counter{font-weight:700;color:#456888;margin:14px 0 4px}h2{margin:0 0 8px}.question{font-weight:800;font-size:clamp(21px,2.5vw,29px);margin:12px 0}.diagram{border:2px solid #d3e1ee;border-radius:16px;background:#f7fbff;min-height:180px;display:grid;place-items:center;margin:12px 0;padding:10px}.diagram svg{width:min(100%,520px);height:230px;touch-action:none}.choices{display:flex;gap:12px;flex-wrap:wrap}.choices button,.primary,.next,.done,.rot{border:2px solid #aac9e4;border-radius:13px;background:#e9f4ff;color:#143756;font:700 18px system-ui;padding:12px 17px;cursor:pointer;min-height:48px}.choices button.selected{border-color:#1976b5;background:#bfe4ff}.next,.done,.primary{background:#1671a1;color:white;border:0}.next:disabled,.primary:disabled{opacity:.5}.feedback{min-height:2em;margin:12px 0;font-weight:700}.success{color:#136a41}.error{color:#a44820}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}.tools button{font-size:16px}.tools p{margin:0;color:#395d7b}.hidden{display:none!important}.result{background:#e5f7eb;padding:15px;border-radius:12px}.small{font-size:15px;color:#48617a}@media(max-width:650px){main{padding:6px}.exercise{padding:13px}.lesson{max-height:none}.nav{font-size:14px}}</style></head><body><main><nav class="nav"><a href="../index.html">← Mes leçons de maths</a><strong>Géométrie</strong></nav><img class="lesson" src="../../images-lecons/maths/maitre-hibou-angle-droit.png" alt="Illustration de la leçon : Reconnaître un angle droit et comparer les angles"><section class="exercise"><h2>À toi de jouer !</h2><p class="small">Observe le dessin, choisis une réponse, puis vérifie avant de continuer.</p><div class="progress"><div id="fill" class="fill"></div></div><div id="counter" class="counter"></div><div id="question" class="question"></div><div class="diagram"><svg id="canvas" viewBox="0 0 500 235" aria-label="Dessin à observer" role="img"></svg></div><div id="tools" class="tools hidden"><button type="button" class="rot" id="left">↶ Tourner</button><button type="button" class="rot" id="right">Tourner ↷</button><button type="button" class="rot" id="recenter">Replacer l’équerre</button><p>Fais glisser l’équerre jaune avec le doigt ou la souris.</p></div><div id="choices" class="choices"></div><p><button id="verify" class="primary" type="button">Vérifier</button></p><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" type="button" class="next hidden">Question suivante →</button><div id="result" class="result hidden"><strong>Bravo ! Tu as terminé les 10 questions.</strong></div><p><button type="button" class="done hidden" id="done">✅ J’ai compris cette leçon</button></p></section></main><script src="../js/math-lecons.js"></script><script>(()=>{'use strict';const tasks=[{"kind": "angle", "deg": 90, "rotation": 0, "answer": "droit", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 42, "rotation": 0, "answer": "aigu", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 132, "rotation": 0, "answer": "obtus", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 90, "rotation": 46, "answer": "droit", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 65, "rotation": 145, "answer": "aigu", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 115, "rotation": -30, "answer": "obtus", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 89, "rotation": 210, "answer": "aigu", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 90, "rotation": -65, "answer": "droit", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 130, "rotation": 90, "answer": "obtus", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}, {"kind": "angle", "deg": 55, "rotation": -100, "answer": "aigu", "q": "Observe cet angle : est-il aigu, droit ou obtus ?", "tip": "Place le coin de l’équerre sur le sommet. Compare l’ouverture avec son angle droit."}];let index=0,chosen='',verified=false,passed=0;const $=id=>document.getElementById(id);const svgNS='http://www.w3.org/2000/svg';let tool={x:330,y:150,angle:0};function el(name,attrs={},parent){const n=document.createElementNS(svgNS,name);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);(parent||$('canvas')).appendChild(n);return n;}function ln(x1,y1,x2,y2,color='#176aab',width=5,parent){return el('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,'stroke-linecap':'round'},parent)}function polygon(points,fill='#dcecff',stroke='#176aab'){return el('polygon',{points,fill,stroke,'stroke-width':4,'stroke-linejoin':'round'})}function renderDiagram(t){$('canvas').innerHTML='';$('tools').classList.add('hidden');if(t.kind==='angle'){const cx=170,cy=152,L=100;let a=t.rotation*Math.PI/180,b=(t.rotation+t.deg)*Math.PI/180;ln(cx,cy,cx+L*Math.cos(a),cy-L*Math.sin(a));ln(cx,cy,cx+L*Math.cos(b),cy-L*Math.sin(b));el('circle',{cx,cy,r:5,fill:'#164f84'});el('text',{x:120,y:220,'font-size':15,fill:'#395f84'}).textContent='Compare l’ouverture avec l’équerre.';$('tools').classList.remove('hidden');tool={x:345,y:130,angle:0};drawSetSquare();}else if(t.kind==='line'){ln(75,110,420,110);if(t.shape!=='droite'){el('circle',{cx:75,cy:110,r:6,fill:'#e34f83'})}if(t.shape==='segment'){el('circle',{cx:420,cy:110,r:6,fill:'#e34f83'})}if(t.shape==='droite'||t.shape==='demi-droite'){arrow(420,110,0)}if(t.shape==='droite')arrow(75,110,Math.PI);el('text',{x:225,y:170,'text-anchor':'middle','font-size':18,fill:'#345d82'}).textContent=t.shape==='segment'?'A                                     B':'Observe les extrémités et les flèches';}else{drawSym(t.shape);}}
function arrow(x,y,a){polygonArrow(x,y,a)}function polygonArrow(x,y,a){let dx=Math.cos(a),dy=Math.sin(a);el('polygon',{points:`${x},${y} ${x-18*dx-9*dy},${y-18*dy+9*dx} ${x-18*dx+9*dy},${y-18*dy-9*dx}`,fill:'#176aab',stroke:'#176aab'})}
function drawSym(s){const diag=s.includes('diag'), side=s.includes('side');ln(diag?(s.startsWith('square')?165:135):side?185:250,diag?(s.startsWith('square')?55:70):40,diag?(s.startsWith('square')?335:365):side?185:250,diag?(s.startsWith('square')?185:170):200,'#e65785',3).setAttribute('stroke-dasharray','9 6');if(s.startsWith('square'))polygon('165,55 335,55 335,185 165,185');else if(s.startsWith('rectangle'))polygon('135,70 365,70 365,170 135,170');else if(s.startsWith('triangle'))polygon('250,52 350,185 150,185');else if(s.startsWith('diamond'))polygon('250,45 350,120 250,195 150,120');else if(s.startsWith('heart'))el('path',{d:'M250 182 C220 155 155 120 178 82 C198 48 239 65 250 86 C261 65 302 48 322 82 C345 120 280 155 250 182 Z',fill:'#f8c8df',stroke:'#176aab','stroke-width':4});else if(s.startsWith('offset'))polygon('190,60 360,60 360,170 190,170');else polygon('160,60 335,60 335,105 255,105 255,182 160,182');if(s==='rectangle-diag'){/* pink axis above deliberately non-symmetry */} }
function drawSetSquare(){const old=$('setSquare');if(old)old.remove();let g=el('g',{id:'setSquare',transform:`translate(${tool.x} ${tool.y}) rotate(${tool.angle})`});el('polygon',{points:'0,0 0,-90 90,0',fill:'#e3ba45','fill-opacity':'.27',stroke:'#b17d13','stroke-width':3},g);el('path',{d:'M0,-19 H19 V0',fill:'none',stroke:'#d94a70','stroke-width':3},g);el('circle',{cx:0,cy:0,r:12,fill:'#f2d178','fill-opacity':'.3',stroke:'#aa7318','stroke-width':2},g);g.style.cursor='grab';let dragging=false;g.addEventListener('pointerdown',e=>{dragging=true;g.setPointerCapture(e.pointerId);e.preventDefault()});g.addEventListener('pointermove',e=>{if(!dragging)return;const p=$('canvas').createSVGPoint();p.x=e.clientX;p.y=e.clientY;const xy=p.matrixTransform($('canvas').getScreenCTM().inverse());tool.x=xy.x;tool.y=xy.y;g.setAttribute('transform',`translate(${tool.x} ${tool.y}) rotate(${tool.angle})`)});g.addEventListener('pointerup',()=>dragging=false);}
function reset(){const t=tasks[index];chosen='';verified=false;$('counter').textContent=`Question ${index+1} / 10`;$('fill').style.width=`${passed*10}%`;$('question').textContent=t.q;$('choices').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('done').classList.add('hidden');$('result').classList.add('hidden');renderDiagram(t);const opts=t.kind==='angle'?['aigu','droit','obtus']:t.kind==='line'?['segment','droite','demi-droite']:['oui','non'];opts.forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=v[0].toUpperCase()+v.slice(1);b.onclick=()=>{if(verified)return;chosen=v;[...$('choices').children].forEach(n=>n.classList.remove('selected'));b.classList.add('selected')};$('choices').appendChild(b)});$('verify').disabled=false;}
$('verify').onclick=()=>{if(!chosen)return;const t=tasks[index];if(chosen===t.answer){verified=true;passed++;$('fill').style.width=`${passed*10}%`;$('feedback').className='feedback success';$('feedback').textContent='Bravo ! Tu as bien observé la figure.';$('verify').disabled=true;if(index===9){$('result').classList.remove('hidden');$('done').classList.remove('hidden')}else $('next').classList.remove('hidden')}else{$('feedback').className='feedback error';$('feedback').textContent='Essaie encore. '+t.tip;}};
$('next').onclick=()=>{if(!verified)return;index++;reset()};$('left').onclick=()=>{tool.angle-=15;drawSetSquare()};$('right').onclick=()=>{tool.angle+=15;drawSetSquare()};$('recenter').onclick=()=>{tool.x=330;tool.y=130;tool.angle=0;drawSetSquare()};$('done').onclick=function(){if(passed!==10)return;if(window.HibouMathLesson?.complete)HibouMathLesson.complete({titre:"Reconnaître un angle droit et comparer les angles",domaine:'Géométrie'},this);else{this.disabled=true;this.textContent='✅ Leçon terminée'}};reset();})();</script></body></html>
