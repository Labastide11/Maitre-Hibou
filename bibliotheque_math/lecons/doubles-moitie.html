<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculer des doubles et des moitiés — Maître Hibou</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4fb;color:#17304f;font-family:system-ui,Arial,sans-serif}main{max-width:1350px;margin:auto;padding:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.toolbar a{background:white;color:#154875;padding:10px 14px;border-radius:12px;font-weight:800;text-decoration:none}.toolbar span{font-weight:800}.lesson-image{display:block;width:100%;height:auto;max-height:calc(100dvh - 85px);object-fit:contain;border-radius:16px;background:white}.practice{background:white;max-width:850px;margin:16px auto 30px;padding:24px;border-radius:20px;box-shadow:0 3px 15px #1232}.practice h2{margin:0}.intro{color:#4d647a}.bar{height:10px;border-radius:20px;background:#e1ebf4;overflow:hidden}.bar span{display:block;width:0;height:100%;background:#28885d;transition:width .2s}.count{margin-top:12px;font-weight:800;color:#426384}.question{font-size:clamp(22px,3vw,32px);font-weight:850;margin:16px 0}.answer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.answer input{width:145px;border:2px solid #a1bed7;border-radius:12px;font-size:25px;padding:10px;color:#183450}.answer button,.next,.done,.again{border:0;border-radius:12px;padding:13px 19px;font-weight:800;font-size:16px;cursor:pointer;min-height:48px}.answer button{background:#175d9c;color:white}.next{background:#247656;color:white;display:none}.done{background:#137a55;color:white;display:none}.again{background:#eaf2fa;color:#17304f;display:none;margin-left:8px}.feedback{min-height:55px;margin:12px 0;font-weight:750;font-size:18px}.feedback.good{color:#13754b}.feedback.retry{color:#9d4b12}.finish{display:none;background:#e6f5ec;padding:15px;border-radius:12px;margin:12px 0}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ec9b2b;outline-offset:3px}@media(max-width:700px){main{padding:6px}.practice{padding:15px}.lesson-image{max-height:none}.toolbar span{font-size:13px}}@media(orientation:landscape){.lesson-image{max-height:calc(100dvh - 77px)}}
</style></head><body><main><nav class="toolbar"><a href="../index.html">← Mes leçons de maths</a><span>Calcul</span></nav><img class="lesson-image" src="../images/maitre-hibou-doubles-moities.png" alt="Leçon illustrée : doubles et moitiés"><section class="practice"><h2>À toi de jouer !</h2><p class="intro">Écris ta réponse, puis vérifie. Tu passes à la suite quand tu as trouvé.</p><div class="bar"><span id="bar"></span></div><div class="count" id="count"></div><div class="question" id="question"></div><form id="form" class="answer"><label for="reply">Ta réponse :</label><input id="reply" type="number" inputmode="numeric" min="0" step="1" required><button id="check" type="submit">Vérifier</button></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button id="next" class="next" type="button">Exercice suivant →</button><div id="finish" class="finish"><strong>Bravo ! Tu as terminé les six exercices.</strong><p>Tu sais calculer des doubles et trouver des moitiés.</p></div><button id="done" class="done" type="button">✅ J’ai compris cette leçon</button><button id="again" class="again" type="button">Recommencer</button></section></main><script src="../js/math-lecons.js"></script><script>
(()=>{'use strict';const tasks=[['Quel est le double de 4 ?',8,'Ajoute 4 une deuxième fois.','4 + 4 = 8.'],['Quelle est la moitié de 10 ?',5,'Partage 10 objets en deux groupes égaux.','5 + 5 = 10.'],['Quel est le double de 7 ?',14,'Ajoute 7 une deuxième fois.','7 + 7 = 14.'],['Quelle est la moitié de 18 ?',9,'Cherche deux nombres identiques qui donnent 18.','9 + 9 = 18.'],['Quel est le double de 23 ?',46,'Double les dizaines, puis les unités.','20 + 20 = 40 et 3 + 3 = 6. Donc 46.'],['Quelle est la moitié de 46 ?',23,'Partage 40 en deux fois 20 et 6 en deux fois 3.','20 + 3 = 23. Et 23 + 23 = 46.']];const el=id=>document.getElementById(id);let i=0,passed=0;function show(){el('count').textContent='Exercice '+(i+1)+' sur '+tasks.length;el('question').textContent=tasks[i][0];el('reply').value='';el('reply').disabled=false;el('check').disabled=false;el('form').hidden=false;el('feedback').textContent='';el('feedback').className='feedback';el('next').style.display='none';el('finish').style.display='none';el('done').style.display='none';el('again').style.display='none';el('bar').style.width=(passed/tasks.length*100)+'%'}el('form').addEventListener('submit',e=>{e.preventDefault();const raw=el('reply').value.trim();if(!raw)return;const t=tasks[i];if(Number(raw)===t[1]){passed++;el('feedback').textContent='✅ Bravo ! '+t[3];el('feedback').className='feedback good';el('reply').disabled=true;el('check').disabled=true;el('bar').style.width=(passed/tasks.length*100)+'%';if(i===tasks.length-1){el('form').hidden=true;el('finish').style.display='block';el('done').style.display='inline-block';el('again').style.display='inline-block'}else el('next').style.display='inline-block'}else{el('feedback').textContent='Essaie encore. Indice : '+t[2];el('feedback').className='feedback retry';el('reply').focus();el('reply').select()}});el('next').addEventListener('click',()=>{if(passed!==i+1)return;i++;show();el('reply').focus()});el('again').addEventListener('click',()=>{i=0;passed=0;show();el('reply').focus()});el('done').addEventListener('click',function(){if(passed!==tasks.length)return;if(window.HibouMathLesson?.complete)HibouMathLesson.complete({titre:'Calculer des doubles et des moitiés',domaine:'Calcul'},this);else{this.textContent='✅ Leçon terminée';this.disabled=true}});show()})();
</script></body></html>
