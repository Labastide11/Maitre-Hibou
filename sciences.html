  :root{ --v24-nav-h: 92px; }

  body.v24-0-3-ready{
    padding-bottom: calc(var(--v24-nav-h) + env(safe-area-inset-bottom, 0px)) !important;
  }

  /* Suppression des anciens menus déroulants sous les matières */
  body.v24-0-3-ready #quickQuestions,
  body.v24-0-3-ready .quick-questions,
  body.v24-0-3-ready #v2173ActivitiesPanel,
  body.v24-0-3-ready .v2173-activities-panel{
    display:none !important;
    visibility:hidden !important;
    height:0 !important;
    min-height:0 !important;
    max-height:0 !important;
    padding:0 !important;
    margin:0 !important;
    border:0 !important;
    overflow:hidden !important;
    pointer-events:none !important;
  }

  /* Barre de matières fixée en bas : vraie navigation tablette */
  body.v24-0-3-ready .subjects-bar{
    position:fixed !important;
    left:12px !important;
    right:12px !important;
    bottom:calc(8px + env(safe-area-inset-bottom, 0px)) !important;
    z-index:300100 !important;
    width:auto !important;
    max-width:none !important;
    margin:0 !important;
    padding:8px 10px !important;
    display:grid !important;
    grid-template-columns:repeat(6,minmax(0,1fr)) !important;
    gap:8px !important;
    border:2px solid rgba(255,255,255,.88) !important;
    border-radius:24px !important;
    background:rgba(255,255,255,.95) !important;
    box-shadow:0 -8px 28px rgba(45,43,85,.18), inset 0 1px 0 rgba(255,255,255,.75) !important;
    backdrop-filter:blur(10px) !important;
    -webkit-backdrop-filter:blur(10px) !important;
    overflow:visible !important;
    white-space:normal !important;
  }

  body.v24-0-3-ready .subjects-bar .subject-btn{
    min-height:62px !important;
    min-width:0 !important;
    border-radius:18px !important;
    padding:7px 8px !important;
    justify-content:center !important;
    align-items:center !important;
    text-align:center !important;
    gap:4px !important;
    display:flex !important;
    flex-direction:column !important;
    color:white !important;
    border:3px solid rgba(255,255,255,.75) !important;
    background:linear-gradient(135deg,var(--mat,#6C63FF) 0%,var(--mat2,#8E86FF) 100%) !important;
    box-shadow:0 7px 17px var(--mat-shadow,rgba(108,99,255,.24)), inset 0 1px 0 rgba(255,255,255,.35) !important;
    cursor:pointer !important;
    line-height:1.05 !important;
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
    font-weight:1000 !important;
    text-shadow:0 2px 0 rgba(0,0,0,.14) !important;
  }
  body.v24-0-3-ready .subjects-bar .subject-btn .subject-icon,
  body.v24-0-3-ready .subjects-bar .subject-btn .v2173-subject-icon{
    font-size:22px !important;
    line-height:1 !important;
  }
  body.v24-0-3-ready .subjects-bar .subject-btn .subject-label,
  body.v24-0-3-ready .subjects-bar .subject-btn .v2173-subject-label{
    font-size:14px !important;
    font-weight:1000 !important;
    line-height:1.05 !important;
  }
  body.v24-0-3-ready .subjects-bar .v2173-chevron{display:none !important;}
  body.v24-0-3-ready .subjects-bar .subject-btn.active{
    transform:none !important;
    outline:3px solid rgba(255,255,255,.9) !important;
  }

  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="francais"]{--mat:#FF3B57;--mat2:#FF7A8C;--mat-shadow:rgba(255,59,87,.26);}
  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="maths"]{--mat:#1683F7;--mat2:#4DB0FF;--mat-shadow:rgba(22,131,247,.28);}
  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="anglais"]{--mat:#9C4DFF;--mat2:#C084FF;--mat-shadow:rgba(156,77,255,.25);}
  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="sciences"]{--mat:#24A84A;--mat2:#63D878;--mat-shadow:rgba(36,168,74,.25);}
  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="geographie"]{--mat:#FF8A00;--mat2:#FFB23F;--mat-shadow:rgba(255,138,0,.26);}
  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="histoire"]{--mat:#6C63FF;--mat2:#8E86FF;--mat-shadow:rgba(108,99,255,.24);}

  /* Correction du libellé Géographie : l'ancien pseudo-texte "Géo" est neutralisé. */
  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="geographie"] .subject-label::after,
  body.v24-0-3-ready .subjects-bar .subject-btn[data-subject="geographie"] .v2173-subject-label::after{
    content:"" !important;
    display:none !important;
  }

  /* Rééquilibrage visuel : la zone centrale respire mieux entre le bandeau haut et la barre du bas. */
  body.v24-0-3-ready.v21-final .v21-home{
    min-height:calc(100dvh - 126px - var(--v24-nav-h)) !important;
    display:flex !important;
    flex-direction:column !important;
    justify-content:flex-start !important;
    padding-top:clamp(16px,4.5vh,48px) !important;
    padding-bottom:10px !important;
  }
  body.v24-0-3-ready.v21-final .v21-hero{
    margin:0 auto 14px !important;
  }
  body.v24-0-3-ready.v21-final .v21-center{
    width:min(1220px,calc(100% - 44px)) !important;
    margin:0 auto !important;
    gap:22px !important;
    align-items:stretch !important;
  }
  body.v24-0-3-ready.v21-final .v21-treasure-card,
  body.v24-0-3-ready.v21-final .v21-profile-card{
    min-height:260px !important;
  }
  body.v24-0-3-ready.v21-final .v21-chest{
    transform:scale(.96) !important;
    margin-bottom:8px !important;
  }
