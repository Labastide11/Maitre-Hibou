<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Boîte à questions — Maître Hibou V25.8.79</title>
<style>
:root{
  --navy:#0f1e46; --navy2:#263c7a; --violet:#6d45f5; --violet2:#8b6cff;
  --gold:#ffd93d; --cream:#fffaf0; --ink:#172554; --muted:#64748b; --line:#e6ddff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f6f7ff}
body{min-height:100vh;overflow-x:hidden}
.app{width:100%;min-height:100vh;margin:0;background:var(--cream);overflow:hidden;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:50;min-height:68px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:16px;justify-content:space-between;padding:10px 22px;box-shadow:0 5px 18px rgba(15,30,70,.25)}
.top-brand{display:flex;align-items:center;gap:12px;min-width:250px}
.top h1{font-size:19px;line-height:1.1;margin:0;font-weight:1000}
.top small{display:block;color:#bfdbfe;font-weight:850;margin-top:3px}
.site-nav{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;flex-wrap:wrap}
.site-nav a,.site-nav button,.site-nav .nav-current{appearance:none;border:0;text-decoration:none;border-radius:13px;padding:10px 14px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:14px;font-weight:1000;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.site-nav a:hover,.site-nav button:hover{background:rgba(255,255,255,.22)}
.site-nav .active{background:#fff;color:#4f36d9;cursor:default;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.top-student-photo{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.95);box-shadow:0 5px 16px rgba(0,0,0,.22);overflow:hidden;display:grid;place-items:center;flex:0 0 54px}
.top-student-photo img{width:100%;height:100%;object-fit:cover;object-position:center;display:none}
.top-student-fallback{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#efe8ff,#fff);color:#5d3be8;font-size:16px;font-weight:1000;letter-spacing:.02em}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:20px;padding:20px clamp(18px,3vw,46px) 28px;background:linear-gradient(120deg,#fff6d8,#f3f8ff 48%,#fff)}
.left{border:2px dashed rgba(194,148,44,.32);border-radius:24px;background:#102044;padding:0;display:flex;align-items:stretch;justify-content:center;overflow:hidden;min-height:0}
.left img{width:100%;height:100%;min-height:0;object-fit:cover;object-position:center center;border-radius:20px;display:block}
.right{min-width:0;min-height:0;background:rgba(255,255,255,.98);border:1px solid rgba(199,210,254,.85);border-radius:24px;padding:22px 26px;overflow:auto;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(45,36,107,.08)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:2px solid #e9e4ff;padding-bottom:10px;margin-bottom:12px}
.head h2{font-size:30px;line-height:1.05;margin:0;color:#2d246b;font-weight:1000}
.head p{margin:7px 0 0;color:#695f9e;font-size:15px;line-height:1.25;font-weight:850}
.name{background:#efe8ff;color:#5d3be8;border:2px solid #dacdff;border-radius:999px;padding:8px 14px;font-weight:1000;white-space:nowrap;min-width:56px;text-align:center}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:2px 0 14px}
.step{border:2px solid #e3dcff;border-radius:14px;padding:8px 6px;text-align:center;font-weight:1000;color:#72679b;background:#fff;line-height:1.1;font-size:13px}
.step strong{display:block;font-size:16px}
.step.active{border-color:#ffbc2c;background:#fff8d6;color:#755000;box-shadow:0 8px 18px rgba(255,188,44,.18)}
.panel{border:2px solid var(--line);border-radius:18px;padding:16px;background:#fff;box-shadow:0 8px 22px rgba(69,47,154,.08);margin-bottom:12px}
.panel h3{margin:0 0 8px;color:#2d246b;font-size:24px;line-height:1.15;font-weight:1000}
.help{margin:0 0 12px;color:#6b6198;font-size:15px;line-height:1.32;font-weight:850}
textarea,input[type="text"]{width:100%;border:2px solid #ded5ff;border-radius:16px;padding:14px;font-size:20px;line-height:1.3;font-weight:900;color:#1b2854;background:#fff;outline:none}
textarea{min-height:105px;max-height:220px;resize:vertical}
textarea:focus,input[type="text"]:focus{border-color:var(--violet2);box-shadow:0 0 0 4px rgba(139,108,255,.14)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.btn{border-radius:14px;padding:13px 18px;background:#fff;color:#5d3be8;border:2px solid #dfd5ff;font-size:16px;font-weight:1000;cursor:pointer;box-shadow:0 7px 16px rgba(45,36,107,.08);min-height:48px;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;border-color:transparent}
.btn.class{background:linear-gradient(135deg,#22c55e,#14b8a6);color:#fff;border-color:transparent}
.btn.private{background:linear-gradient(135deg,#334155,#64748b);color:#fff;border-color:transparent}
.rule{margin:12px 0;background:#eef6ff;border:2px solid #bfdcff;border-radius:16px;padding:12px 14px;color:#24406d;font-size:15px;font-weight:900;line-height:1.35}
.options{display:grid;gap:10px;margin:12px 0}
.option{width:100%;text-align:left;border:2px solid #d8cdfd;border-radius:16px;background:#fff;color:#291d66;padding:13px 14px;font-size:18px;font-weight:1000;line-height:1.3;cursor:pointer;box-shadow:0 7px 16px rgba(45,36,107,.07);display:block}
.badge{display:inline-block;background:#dcfce7;color:#166534;border:2px solid #86efac;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:1000;margin-bottom:8px}
.corrected{background:#fff8d6;border:2px solid #ffd43b;border-radius:16px;padding:14px;font-size:22px;line-height:1.35;font-weight:1000;color:#473600;margin:10px 0}
.note{margin-top:auto;background:#f8fbff;border:2px solid #d9eaff;border-radius:14px;padding:10px 12px;color:#52607f;font-size:13px;font-weight:800;line-height:1.3}
.success{background:#ecfdf5;border:2px solid #86efac;border-radius:18px;padding:16px;color:#14532d;font-size:20px;font-weight:1000;line-height:1.35}
.error{background:#fff1f2;border:2px solid #fda4af;border-radius:18px;padding:14px;color:#9f1239;font-size:16px;font-weight:900;line-height:1.35}
.wait{background:#fff8d6;border:2px solid #ffd43b;border-radius:18px;padding:14px;color:#4b3a00;font-size:18px;font-weight:1000;line-height:1.35}
.copywarn{margin-top:10px;background:#fff8d6;border:2px solid #ffd43b;border-radius:16px;padding:10px 12px;color:#5c4300;font-size:15px;font-weight:900;line-height:1.35}
.copywarn.ok{background:#ecfdf5;border-color:#86efac;color:#14532d}
@media(max-width:900px){.top{padding:9px 12px;gap:8px}.top-brand{min-width:auto}.top-brand small{display:none}.site-nav{justify-content:flex-end}.site-nav a,.site-nav button,.site-nav .nav-current{padding:8px 10px;font-size:12px}.body{grid-template-columns:190px minmax(0,1fr);gap:10px;padding:10px}.left{padding:0;border-radius:18px}.left img{width:100%;height:100%;object-fit:cover}.right{padding:12px}.head h2{font-size:24px}textarea,input[type="text"]{font-size:18px;min-height:92px}.steps{gap:6px}.step{font-size:11px;padding:7px 4px}.step strong{font-size:14px}}
@media(max-width:700px){.top{align-items:flex-start;flex-wrap:wrap}.top-brand{width:100%}.site-nav{width:100%;order:3;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.top-student-photo{position:absolute;right:12px;top:8px;width:48px;height:48px;flex-basis:48px}.body{grid-template-columns:1fr;overflow:auto}.left{height:190px;min-height:190px;display:block}.left img{width:100%;height:100%;object-fit:cover;object-position:center 38%}.right{overflow:visible}.steps{grid-template-columns:repeat(5,minmax(54px,1fr));overflow:auto}.top h1{font-size:17px}.top small{font-size:12px}.head{display:block}.name{display:inline-block;margin-top:8px}.panel h3{font-size:20px}.option{font-size:16px}.corrected{font-size:18px}}

.student-inline-photo{
  width:46px;height:46px;border-radius:50%;overflow:hidden;
  border:3px solid #ded4ff;background:#fff;display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(82,61,180,.15);flex:0 0 46px;
}
.student-inline-photo img{width:100%;height:100%;object-fit:cover;display:none}
.student-inline-photo span{
  width:100%;height:100%;display:grid;place-items:center;
  background:linear-gradient(135deg,#efe8ff,#fff);color:#5d3be8;
  font-weight:1000;font-size:14px
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-brand">
      <div>
        <h1>🦉 Maître Hibou</h1>
        <small>Apprendre · s’entraîner · être curieux</small>
      </div>
    </div>
    <nav class="site-nav" aria-label="Navigation Maître Hibou">
      <button type="button" id="homeNav">🏠 <span>Accueil</span></button>
      <button type="button" id="trainNav">🧠 <span>M’entraîner</span></button>
      <button type="button" id="beltNav">🥋 <span>Passer une ceinture</span></button>
      <button type="button" id="lessonNav">📚 <span>Revoir une leçon</span></button>
      <span class="active nav-current">💬 <span>Poser une question</span></span>
    </nav>
    <div class="top-student-photo" id="topStudentPhoto" title="Élève">
      <img id="topStudentPhotoImg" alt="">
      <span class="top-student-fallback" id="topStudentFallback">👤</span>
    </div>
  </header>
  <div class="body">
    <aside class="left"><img src="page_hibou_questions.png" alt="Maître Hibou — Pose une question"></aside>
    <main class="right">
      <div class="head"><div><h2>Poser une question</h2><p>Écris comme tu peux. L’IA proposera plusieurs questions correctes, sans répondre à ta place.</p></div><div class="student-inline-photo" id="studentInlinePhoto" title="Élève">
      <img id="studentInlinePhotoImg" alt="">
      <span id="studentInlineFallback">👤</span>
    </div></div>
      <div class="steps" id="steps"></div>
      <div id="panel"></div>
      <div class="note">V25.8.79 · 🔒 La réponse IA n’est pas affichée aux élèves. Elle aide seulement le maître.</div>
    </main>
  </div>
</div>
<script>
(function(){
'use strict';

var API_URL='https://script.google.com/macros/s/AKfycbydzPTQ9ZLEPYezHou2-O4IK24ip51sLTpe9qdi2xREuQvDBKRlVqsYYDiKLrzAODc/exec';
var qs=new URLSearchParams(location.search||'');
if(qs.get('apiUrl')) API_URL=qs.get('apiUrl');

var state={
  prenom:clean(qs.get('prenom')||qs.get('eleve')||localStorage.getItem('hibou_last_prenom')||''),
  photo:clean(qs.get('photo')||''),
  returnUrl:qs.get('returnUrl')||'index.html',
  original:'', propositions:[], selected:'', corrected:'', reponseIA:'', requestId:0
};

function $(id){return document.getElementById(id)}
function clean(v){return String(v==null?'':v).replace(/\s+/g,' ').trim()}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function setStep(active){
  var labels=['J’écris','L’IA propose','Je recopie','Je choisis','J’envoie'];
  $('steps').innerHTML=labels.map(function(label,i){return '<div class="step '+(active===i+1?'active':'')+'"><strong>'+(i+1)+'</strong>'+label+'</div>'}).join('');
}
function setPanel(html){$('panel').innerHTML=html}

function returnToMaitreHibou(){
  try{
    var sameOriginReferrer = document.referrer && new URL(document.referrer).origin === location.origin;
    if(sameOriginReferrer && history.length > 1){
      history.back();
      return false;
    }
  }catch(e){}
  try{ location.href=state.returnUrl||'index.html'; }catch(e){}
  return false;
}

function goToMaitreHibouAction(action){
  try{
    if(action) localStorage.setItem('hibou_nav_after_question_v25875', action);
    else localStorage.removeItem('hibou_nav_after_question_v25875');
  }catch(e){}
  return returnToMaitreHibou();
}

function closeQuestionPage(){
  return returnToMaitreHibou();
}

function studentInitials(name){
  var parts=clean(name).split(/\s+/).filter(Boolean);
  if(!parts.length)return '👤';
  return parts.slice(0,2).map(function(p){return p.charAt(0).toUpperCase()}).join('');
}

function safePhotoFile(value){
  var file=clean(value);
  // N'accepte qu'un nom de fichier anonyme simple : ce2-01.png, ce2-17.png, etc.
  if(!/^ce2-\d{2}\.(png|jpg|jpeg|webp)$/i.test(file)) return '';
  return file;
}

function loadStudentPhoto(){
  var topWrap=$('topStudentPhoto');
  var topImg=$('topStudentPhotoImg');
  var topFallback=$('topStudentFallback');

  var inlineWrap=$('studentInlinePhoto');
  var inlineImg=$('studentInlinePhotoImg');
  var inlineFallback=$('studentInlineFallback');

  var name=state.prenom||'élève';
  var file=safePhotoFile(state.photo);
  var initials=studentInitials(name);

  function prepare(wrap,img,fallback){
    if(!wrap||!img||!fallback)return;
    wrap.title=name;
    img.alt='Photo de '+name;
    fallback.textContent=initials;

    if(!file){
      img.style.display='none';
      fallback.style.display='grid';
      return;
    }

    img.onload=function(){
      img.style.display='block';
      fallback.style.display='none';
    };
    img.onerror=function(){
      img.style.display='none';
      fallback.style.display='grid';
    };
    img.src='photos/'+file;
  }

  prepare(topWrap,topImg,topFallback);
  prepare(inlineWrap,inlineImg,inlineFallback);
}

function init(){
  document.title='Boîte à questions — Maître Hibou V25.8.79';
  loadStudentPhoto();
  $('homeNav').onclick=function(){ return goToMaitreHibouAction(''); };
  $('trainNav').onclick=function(){ return goToMaitreHibouAction('training'); };
  $('beltNav').onclick=function(){ return goToMaitreHibouAction('belt'); };
  $('lessonNav').onclick=function(){ return goToMaitreHibouAction('lesson'); };
  renderWrite();
}

function ensureName(){
  if(state.prenom)return true;
  var input=$('prenomInput');
  var v=clean(input&&input.value);
  if(!v)return false;
  state.prenom=v;
  try{localStorage.setItem('hibou_last_prenom',v)}catch(e){}
  loadStudentPhoto();
  return true;
}

function renderWrite(){
  setStep(1);
  setPanel('<section class="panel">'+
    '<h3>⭐ Étape 1 — Écris ta question</h3>'+
    '<p class="help">Écris naturellement. Ce n’est pas grave s’il y a des fautes : l’IA t’aidera à mieux formuler.</p>'+
    (!state.prenom?'<p class="help"><b>Ton prénom :</b></p><input type="text" id="prenomInput" placeholder="Écris ton prénom" autocomplete="off">':'')+
    '<textarea id="qInput" placeholder="Exemple : pourquoi les étoiles brille la nuit">'+esc(state.original)+'</textarea>'+
    '<div class="actions"><button type="button" class="btn primary" id="reformBtn">🦉 Reformuler avec l’IA</button><button type="button" class="btn" id="clearBtn">Effacer</button></div>'+
    '<div class="rule"><b>But :</b> apprendre à poser une vraie question. L’IA ne répond pas à la question.</div></section>');
  $('reformBtn').onclick=reformulate;
  $('clearBtn').onclick=function(){state.original='';$('qInput').value='';$('qInput').focus()};
}

function renderWaiting(seconds){
  setStep(2);
  setPanel('<section class="panel"><h3>🦉 Étape 2 — Maître Hibou réfléchit</h3>'+
    '<div class="wait">J’envoie ta question à l’IA…<br><br><b>Temps d’attente : '+seconds+' s</b></div>'+
    '<div class="actions"><button class="btn" type="button" id="backWrite">← Modifier ma question</button></div></section>');
  $('backWrite').onclick=renderWrite;
}

/* JSONP : adapté aux Web Apps Apps Script sans exposer la clé Gemini. */
function jsonp(params,timeoutMs){
  timeoutMs=timeoutMs||45000;
  return new Promise(function(resolve,reject){
    var cb='hibouQ_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
    var done=false;
    var script=document.createElement('script');
    var timer;

    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=null}
      if(script.parentNode)script.parentNode.removeChild(script);
    }
    function finishError(message){
      if(done)return;
      done=true; cleanup(); reject(new Error(message));
    }

    window[cb]=function(data){
      if(done)return;
      done=true; cleanup(); resolve(data||{});
    };

    params.callback=cb;
    params.t=Date.now();
    script.async=true;
    script.referrerPolicy='no-referrer';
    script.onerror=function(){finishError('Impossible de joindre le service IA de Maître Hibou.')};
    script.src=API_URL+(API_URL.indexOf('?')===-1?'?':'&')+new URLSearchParams(params).toString();
    timer=setTimeout(function(){finishError('L’IA n’a pas répondu. Réessaie dans quelques secondes.')},timeoutMs);
    document.head.appendChild(script);
  });
}

function normaliseAiResponse(data){
  data=data||{};
  if(data.data&&typeof data.data==='object') data=Object.assign({},data,data.data);

  var props=data.propositions||data.suggestions||data.reformulations||data.questions||[];
  if(typeof props==='string'){
    try{props=JSON.parse(props)}catch(e){props=props.split(/\n+/)}
  }
  if(!Array.isArray(props))props=[];
  props=props.map(clean).filter(Boolean).slice(0,4);

  return {
    success: data.success!==false && data.ok!==false,
    error: clean(data.error||data.message||''),
    propositions: props,
    reponseIA: clean(data.reponseIA||data.reponse||data.answer||'')
  };
}

function reformulate(){
  if(!ensureName()){alert('Écris ton prénom avant de poser ta question.');return}
  var input=$('qInput');
  if(input)state.original=clean(input.value);
  if(!state.original){alert('Écris d’abord une question.');return}

  var requestId=++state.requestId;
  var started=Date.now();
  renderWaiting(0);
  var interval=setInterval(function(){
    if(requestId!==state.requestId){clearInterval(interval);return}
    renderWaiting(Math.floor((Date.now()-started)/1000));
  },1000);

  jsonp({
    action:'reformulateQuestion',
    prenom:state.prenom,
    question:state.original,
    source:'maitre_hibou_v25_8_79'
  },45000).then(function(raw){
    clearInterval(interval);
    if(requestId!==state.requestId)return;

    var data=normaliseAiResponse(raw);
    if(!data.success)throw new Error(data.error||'Le service IA a refusé la demande.');
    if(!data.propositions.length)throw new Error(data.error||'L’IA n’a renvoyé aucune reformulation.');

    state.propositions=data.propositions;
    state.reponseIA=data.reponseIA||'Reformulation IA réalisée. Réponse réservée au maître.';
    renderProposals();
  }).catch(function(err){
    clearInterval(interval);
    if(requestId!==state.requestId)return;
    renderError(err&&err.message?err.message:String(err));
  });
}

function renderError(message){
  setStep(2);
  setPanel('<section class="panel"><h3>⚠️ L’IA n’a pas répondu</h3>'+
    '<div class="error">'+esc(message)+'</div>'+
    '<div class="rule"><b>Ta question reste seulement sur cette page.</b> Elle n’est pas enregistrée tant que tu n’as pas terminé l’étape 5. Tu peux relancer sans la retaper.</div>'+
    '<div class="actions"><button type="button" class="btn primary" id="retryBtn">🔁 Relancer l’IA</button><button type="button" class="btn" id="modifyBtn">← Modifier ma question</button></div></section>');
  $('retryBtn').onclick=reformulate;
  $('modifyBtn').onclick=renderWrite;
}

function renderProposals(){
  setStep(2);
  var buttons=state.propositions.map(function(p,i){return '<button class="option" type="button" data-i="'+i+'">'+esc(p)+'</button>'}).join('');
  setPanel('<section class="panel"><span class="badge">✨ Reformulation par l’IA</span>'+
    '<h3>🦉 Choisis la question qui correspond le mieux à ton idée</h3>'+
    '<p class="help">Ta phrase de départ : <b>« '+esc(state.original)+' »</b></p>'+
    '<div class="options">'+buttons+'</div>'+
    '<div class="actions"><button class="btn" type="button" id="modifyBtn">← Modifier ma question de départ</button></div></section>');
  document.querySelectorAll('.option').forEach(function(btn){
    btn.onclick=function(){state.selected=state.propositions[Number(btn.dataset.i)]||'';renderCopy()}
  });
  $('modifyBtn').onclick=renderWrite;
}

function norm(v){
  return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()
}
function copyOk(text,model){return norm(text)===norm(model)}

function renderCopy(){
  setStep(3);
  state.corrected='';
  setPanel('<section class="panel"><h3>✍️ Étape 3 — Recopie la question correctement</h3>'+
    '<div class="corrected">« '+esc(state.selected)+' »</div>'+
    '<textarea id="copyInput" placeholder="Recopie ici la question choisie."></textarea>'+
    '<div id="copyAdvice" class="copywarn">✍️ Recopie la question choisie.</div>'+
    '<div class="actions"><button type="button" class="btn primary" id="copyOk">✅ J’ai recopié ma question</button><button type="button" class="btn" id="backProps">← Revoir les propositions</button></div></section>');
  $('copyInput').oninput=function(){
    var good=copyOk(this.value,state.selected);
    $('copyAdvice').className='copywarn'+(good?' ok':'');
    $('copyAdvice').textContent=good?'✅ C’est bien recopié. Tu peux continuer.':'🦉 Compare encore avec le modèle.';
  };
  $('copyOk').onclick=function(){
    state.corrected=clean($('copyInput').value);
    if(!copyOk(state.corrected,state.selected)){$('copyInput').focus();return}
    renderVisibility();
  };
  $('backProps').onclick=renderProposals;
}

function renderVisibility(){
  setStep(4);
  setPanel('<section class="panel"><h3>👀 Étape 4 — Je choisis</h3>'+
    '<p class="help">Choisis si ta question peut être partagée avec la classe.</p>'+
    '<div class="corrected">« '+esc(state.corrected)+' »</div>'+
    '<div class="actions"><button type="button" class="btn class" id="classBtn">👥 Question de classe</button><button type="button" class="btn private" id="privateBtn">🔒 Question privée</button></div></section>');
  $('classBtn').onclick=function(){submit('classe')};
  $('privateBtn').onclick=function(){submit('privée')};
}

function notifyJournal(vis){
  var payload={
    type:'hibou_question_posee',
    event_id:'question-'+clean(state.prenom||'eleve').toLowerCase()+'-'+Date.now(),
    prenom:state.prenom||'',
    matiere:'Boîte à questions',
    questionCorrigee:state.corrected||'',
    questionOriginale:state.original||'',
    question:state.corrected||state.original||'',
    visibilite:vis||'',
    source:'maitre_hibou_v25_8_79',
    date_iso:new Date().toISOString()
  };
  try{localStorage.setItem('hibou_question_event',JSON.stringify(payload))}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(payload,'*')}catch(e){}
  try{window.dispatchEvent(new CustomEvent('hibou:question-saved',{detail:payload}))}catch(e){}
}

function submit(vis){
  setStep(5);
  setPanel('<section class="panel"><h3>📨 Étape 5 — J’envoie</h3><div class="wait">J’enregistre ta question dans le journal du maître…</div></section>');
  jsonp({
    action:'appendQuestion',
    prenom:state.prenom,
    matiere:'Boîte à questions',
    questionOriginale:state.original,
    questionCorrigee:state.corrected,
    reponseIA:state.reponseIA,
    visibilite:vis,
    statut:'nouvelle',
    pointsCuriosite:'1',
    source:'maitre_hibou_v25_8_79'
  },30000).then(function(raw){
    var data=normaliseAiResponse(raw);
    if(raw&&raw.success===false)throw new Error(raw.error||'Erreur pendant l’enregistrement.');
    notifyJournal(vis);
    renderSuccess(vis);
  }).catch(function(err){
    setPanel('<section class="panel"><h3>⚠️ Enregistrement impossible</h3>'+
      '<div class="error">'+esc(err&&err.message?err.message:String(err))+'</div>'+
      '<div class="actions"><button type="button" class="btn primary" id="retrySave">🔁 Réessayer</button><button type="button" class="btn" id="backVisibility">← Revenir au choix</button></div></section>');
    $('retrySave').onclick=function(){submit(vis)};
    $('backVisibility').onclick=renderVisibility;
  });
}

function renderSuccess(vis){
  setStep(5);
  setPanel('<section class="panel"><div class="success">✅ Ta question a été enregistrée.<br>Merci, '+esc(state.prenom||'élève')+' !</div>'+
    '<div class="rule"><b>Question envoyée :</b><br>« '+esc(state.corrected)+' »<br><br><b>Visibilité :</b> '+esc(vis)+'</div>'+
    '<div class="actions"><button type="button" class="btn primary" id="againBtn">📦 Poser une autre question</button><button type="button" class="btn" id="backBtn">Retour à Maître Hibou</button></div></section>');
  $('againBtn').onclick=function(){state.original='';state.propositions=[];state.selected='';state.corrected='';state.reponseIA='';renderWrite()};
  $('backBtn').onclick=closeQuestionPage;
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
