<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les messages clairs — Maître Hibou EVAR</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fc;color:#153658;font:16px system-ui,Arial,sans-serif}header{padding:20px 20px 16px;background:#173d69;color:white}header h1{font-size:clamp(24px,3vw,34px);margin:0 0 8px}header p{margin:0;line-height:1.4}.shell{padding:16px clamp(10px,2vw,30px) 30px;max-width:1600px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:15px}.tile{border:1px solid #d5e3f1;border-radius:18px;overflow:hidden;background:white;box-shadow:0 5px 12px #14385916;padding:0;text-align:left;display:flex;flex-direction:column;cursor:pointer;color:#153658;max-width:300px}.tile:focus-visible{outline:3px solid #00aeb5}.tile img{width:100%;aspect-ratio:1.55;object-fit:cover;object-position:top;display:block}.tile strong{padding:11px 12px 4px;font-size:16px;min-height:53px}.tile span{padding:0 12px 13px;font-size:13px;color:#386282}.view{position:fixed;inset:0;background:#09192feE;z-index:999;display:none;flex-direction:column}.view.open{display:flex}.toolbar{display:flex;gap:8px;align-items:center;padding:9px;background:#102f51;color:#fff}.toolbar strong{flex:1;font-size:clamp(13px,2vw,19px)}.toolbar button{border:0;border-radius:12px;background:#fff;color:#17365f;font:700 15px system-ui;padding:9px 13px;cursor:pointer}.picture{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:12px}.picture img{max-width:100%;max-height:100%;object-fit:contain;display:block;cursor:zoom-in}.picture.zoom img{max-height:none;max-width:none;width:180%;cursor:zoom-out}.note{margin:14px 0;color:#4c6681}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile strong{font-size:13px;min-height:58px}.toolbar button{padding:8px}}</style></head><body><header><h1>Le message clair — Nos romans-photos</h1><p>Choisis une histoire pour apprendre à parler sans blesser et trouver des solutions.</p></header><main class="shell"><div class="grid"><button class="tile" type="button" data-i="0" aria-label="Afficher : On se moque de moi"><img loading="lazy" src="images-evar/messages-clairs/01_moqueries.webp" alt="Affiche On se moque de moi"><strong>On se moque de moi</strong><span>Voir l’affiche en grand ↗</span></button>
<button class="tile" type="button" data-i="1" aria-label="Afficher : On me donne un surnom"><img loading="lazy" src="images-evar/messages-clairs/02_surnom.webp" alt="Affiche On me donne un surnom"><strong>On me donne un surnom</strong><span>Voir l’affiche en grand ↗</span></button>
<button class="tile" type="button" data-i="2" aria-label="Afficher : On me gêne pour travailler"><img loading="lazy" src="images-evar/messages-clairs/03_travail.webp" alt="Affiche On me gêne pour travailler"><strong>On me gêne pour travailler</strong><span>Voir l’affiche en grand ↗</span></button>
<button class="tile" type="button" data-i="3" aria-label="Afficher : On me bouscule"><img loading="lazy" src="images-evar/messages-clairs/04_bousculade.webp" alt="Affiche On me bouscule"><strong>On me bouscule</strong><span>Voir l’affiche en grand ↗</span></button>
<button class="tile" type="button" data-i="4" aria-label="Afficher : On refuse de jouer avec moi"><img loading="lazy" src="images-evar/messages-clairs/05_exclusion.webp" alt="Affiche On refuse de jouer avec moi"><strong>On refuse de jouer avec moi</strong><span>Voir l’affiche en grand ↗</span></button>
<button class="tile" type="button" data-i="5" aria-label="Afficher : Mon message clair ne fonctionne pas"><img loading="lazy" src="images-evar/messages-clairs/07_message_refuse.webp" alt="Affiche Mon message clair ne fonctionne pas"><strong>Mon message clair ne fonctionne pas</strong><span>Voir l’affiche en grand ↗</span></button>
<button class="tile" type="button" data-i="6" aria-label="Afficher : Quand faut-il prévenir un adulte ?"><img loading="lazy" src="images-evar/messages-clairs/08_prevenir_adulte.webp" alt="Affiche Quand faut-il prévenir un adulte ?"><strong>Quand faut-il prévenir un adulte ?</strong><span>Voir l’affiche en grand ↗</span></button></div><p class="note">En cas de violence, de menace ou de danger, préviens directement un adulte de confiance.</p></main><section class="view" id="view" role="dialog" aria-modal="true" aria-label="Affiche agrandie"><div class="toolbar"><button id="prev" type="button" aria-label="Affiche précédente">←</button><strong id="name"></strong><button id="next" type="button" aria-label="Affiche suivante">→</button><button id="close" type="button">✕ Fermer</button></div><div class="picture" id="picture"><img id="big" alt="Affiche en grand"></div></section><script>
const data=[{title:'On se moque de moi',src:'images-evar/messages-clairs/01_moqueries.webp'},{title:'On me donne un surnom',src:'images-evar/messages-clairs/02_surnom.webp'},{title:'On me gêne pour travailler',src:'images-evar/messages-clairs/03_travail.webp'},{title:'On me bouscule',src:'images-evar/messages-clairs/04_bousculade.webp'},{title:'On refuse de jouer avec moi',src:'images-evar/messages-clairs/05_exclusion.webp'},{title:'Mon message clair ne fonctionne pas',src:'images-evar/messages-clairs/07_message_refuse.webp'},{title:'Quand faut-il prévenir un adulte ?',src:'images-evar/messages-clairs/08_prevenir_adulte.webp'}];let index=0;const view=document.getElementById('view'),big=document.getElementById('big'),picture=document.getElementById('picture');let previousFocus=null;
function show(i){index=(i+data.length)%data.length;big.src=data[index].src;big.alt=data[index].title;document.getElementById('name').textContent=(index+1)+' / '+data.length+' — '+data[index].title;picture.classList.remove('zoom')}
function openImage(i){previousFocus=document.activeElement;show(i);view.classList.add('open');document.getElementById('close').focus()}
function closeImage(){view.classList.remove('open');big.removeAttribute('src');if(previousFocus)previousFocus.focus()}
document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>openImage(+b.dataset.i)));
document.getElementById('next').addEventListener('click',()=>show(index+1));document.getElementById('prev').addEventListener('click',()=>show(index-1));document.getElementById('close').addEventListener('click',closeImage);big.addEventListener('click',()=>picture.classList.toggle('zoom'));document.addEventListener('keydown',e=>{if(!view.classList.contains('open'))return;if(e.key==='Escape')closeImage();if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});
</script></body></html>
