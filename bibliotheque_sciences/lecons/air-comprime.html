<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’air peut être comprimé — Maître Hibou Sciences CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf4fc;color:#173553;font:18px system-ui,Arial,sans-serif}main{width:100%;padding:clamp(8px,1.2vw,18px)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;gap:14px}header a{color:#134d84;text-decoration:none;font-weight:800}.lesson-image{width:100%;height:auto;max-width:100%;display:block;border-radius:12px}.quiz{width:100%;padding:clamp(15px,2vw,28px);background:#fff;border-radius:18px;margin:15px 0 32px;box-shadow:0 3px 15px #19365320}h1{font-size:clamp(22px,2.3vw,33px);margin:0 0 8px}.bar{height:13px;background:#dceaf4;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#4eac74;transition:width .2s}.question{font-size:clamp(21px,2.5vw,30px);font-weight:800;margin:14px 0 18px}.answers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}button{cursor:pointer;border:0;border-radius:13px;padding:13px 17px;font:700 18px system-ui,Arial;min-height:50px}button:focus-visible{outline:3px solid #e5a21c;outline-offset:2px}.choice{background:#e8f3ff;color:#173553;border:2px solid #bdd7ee;text-align:left}.choice:disabled{cursor:default}.choice.wrong{background:#ffe5e5;border-color:#d37770}.choice.right{background:#d5f5df;border-color:#4eaa71}#next,#done{margin-top:15px;background:#148355;color:#fff}#restart{margin-top:15px;background:#edf1f5}#feedback{min-height:30px;font-weight:750;margin:14px 0 0}#feedback.error{color:#a73627}#feedback.success{color:#167848}.hidden{display:none!important}.note{color:#526d86;font-size:16px}.final{font-size:21px;font-weight:800;color:#167848}</style></head><body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header><img class="lesson-image" src="../../images-lecons/sciences/maitre-hibou-air-comprime.png" alt="Affiche illustrée : L’air peut être comprimé"><section class="quiz"><h1>À toi d’expérimenter !</h1><p class="note">Réponds à 10 questions. Une bonne réponse est nécessaire pour passer à la suivante.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="counter"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="hidden">Question suivante →</button><button id="done" class="hidden">J’ai compris cette leçon ✓</button><button id="restart" class="hidden">Recommencer</button><p id="result" class="final"></p></section></main><script>const tasks=[{"q": "Que signifie « comprimer l’air » ?", "choices": ["Lui faire occuper moins de place", "Le transformer en eau", "Le faire disparaître"], "a": "Lui faire occuper moins de place", "hint": "On réduit le volume de l’air."}, {"q": "Avec quel objet peut-on observer l’air comprimé ?", "choices": ["Une seringue sans aiguille", "Une règle en bois", "Un cahier"], "a": "Une seringue sans aiguille", "hint": "On peut boucher son embout avec un doigt."}, {"q": "Dans une seringue bouchée, quand on pousse le piston…", "choices": ["L’air occupe moins de place", "L’air disparaît", "L’air devient solide"], "a": "L’air occupe moins de place", "hint": "On sent une résistance."}, {"q": "Pourquoi le piston résiste-t-il quand l’embout est bouché ?", "choices": ["L’air enfermé résiste à la compression", "Il n’y a rien dans la seringue"], "a": "L’air enfermé résiste à la compression", "hint": "Il reste de l’air à l’intérieur."}, {"q": "Avec une seringue ouverte, l’air peut-il sortir ?", "choices": ["Oui", "Non"], "a": "Oui", "hint": "L’air n’est plus enfermé."}, {"q": "Quand on relâche le piston d’une seringue contenant de l’air comprimé…", "choices": ["L’air peut se détendre et repousser le piston", "L’air est perdu pour toujours"], "a": "L’air peut se détendre et repousser le piston", "hint": "L’air tend à reprendre davantage de volume."}, {"q": "Peut-on comprimer facilement de l’eau dans une seringue ?", "choices": ["Non, très difficilement", "Oui, autant que l’air"], "a": "Non, très difficilement", "hint": "Un liquide est beaucoup moins compressible que l’air."}, {"q": "Dans un ballon souple que l’on presse, l’air à l’intérieur…", "choices": ["Peut être comprimé", "Devient du verre"], "a": "Peut être comprimé", "hint": "On réduit un peu l’espace qu’il occupe."}, {"q": "Une pompe de vélo sert à…", "choices": ["Comprimer et envoyer de l’air dans le pneu", "Fabriquer de l’eau"], "a": "Comprimer et envoyer de l’air dans le pneu", "hint": "Elle pousse de l’air dans la chambre à air ou le pneu."}, {"q": "Une seringue bouchée utilisée en classe doit être…", "choices": ["Sans aiguille", "Avec une aiguille pointue"], "a": "Sans aiguille", "hint": "On utilise uniquement une seringue sans aiguille pour cette expérience."}];let index=0,correct=0;const el=id=>document.getElementById(id);function show(){const t=tasks[index];el('counter').textContent=`Question ${index+1} sur ${tasks.length}`;el('question').textContent=t.q;el('feedback').textContent='';el('feedback').className='';el('next').classList.add('hidden');el('done').classList.add('hidden');el('restart').classList.add('hidden');el('answers').innerHTML='';t.choices.forEach(value=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.onclick=()=>choose(value,b);el('answers').appendChild(b);});el('fill').style.width=`${correct*100/tasks.length}%`;}function choose(value,b){if(value!==tasks[index].a){b.disabled=true;b.classList.add('wrong');el('feedback').className='error';el('feedback').textContent='Essaie encore ! Indice : '+tasks[index].hint;return;}correct++;el('fill').style.width=`${correct*100/tasks.length}%`;b.classList.add('right');for(const btn of el('answers').children)btn.disabled=true;el('feedback').className='success';el('feedback').textContent='Bravo ! Bonne réponse.';if(index===tasks.length-1){el('done').classList.remove('hidden');el('restart').classList.remove('hidden');}else el('next').classList.remove('hidden');}el('next').onclick=()=>{if(correct!==index+1)return;index++;show();};el('restart').onclick=()=>{index=0;correct=0;el('result').textContent='';show();};el('done').onclick=()=>{if(correct!==tasks.length)return;el('result').textContent='Bravo ! Tu as compris cette leçon.';el('done').disabled=true;el('done').textContent='Leçon terminée ✓';};show();</script></body></html>
