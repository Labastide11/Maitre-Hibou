<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L’air peut être comprimé — Maître Hibou Sciences CE2</title>
<style>
:root{--ink:#173553;--blue:#2269a4;--pale:#eaf4fc;--green:#15784d;--line:#c5d9e8}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font:18px/1.48 system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{width:100%;max-width:1120px;margin:auto;padding:clamp(8px,1.4vw,20px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 2px 14px;font-size:clamp(13px,2vw,16px)}header a{color:#134d84;text-decoration:none;font-weight:800}.lesson-image{width:100%;height:auto;display:block;border-radius:14px}.quiz{background:white;border-radius:20px;margin:18px 0 35px;padding:clamp(16px,3vw,34px);box-shadow:0 3px 16px #1936531c}h1{margin:0 0 5px;font-size:clamp(23px,3vw,34px)}h2{font-size:clamp(20px,2.5vw,27px);margin:12px 0}p{margin:8px 0 14px}.sub{color:#526d86;font-size:16px}.progress{background:#deebf5;border-radius:99px;height:12px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#2c9b72;transition:width .25s}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:750;font-size:15px}.star{color:#a36a15}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:10px;margin:15px 0}button,select{font:inherit}button{cursor:pointer;min-height:48px;border-radius:12px;border:2px solid transparent;padding:10px 15px;font-weight:750;touch-action:manipulation}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #e4a92a;outline-offset:3px}.option{color:var(--ink);background:#edf6ff;border-color:#bcd7ec;text-align:left}.option[aria-pressed=true]{background:#c9e6ff;border-color:#186aa6}.primary{background:#177b53;color:white}.secondary{background:#e6f0f7;color:var(--ink)}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.controls button{flex:1 1 175px}.feedback{margin:13px 0;padding:12px 14px;border-radius:12px;background:#eaf3fa;font-weight:650}.feedback.good{background:#dff5e7;color:#12683f}.feedback.bad{background:#fff2db;color:#78511b}.feedback:empty{display:none}.hidden{display:none!important}.graphic{background:#f0f8fd;border:1px solid #c5dfee;border-radius:16px;padding:10px;margin:14px 0}.graphic svg{display:block;width:100%;max-height:250px;touch-action:none;user-select:none}.graphic svg .piston{cursor:ew-resize;touch-action:none}.small{font-size:14px;color:#506981}.range{width:100%;accent-color:#1f78aa;height:36px}.pair{display:grid;grid-template-columns:minmax(95px,1fr) minmax(120px,1.3fr);align-items:center;gap:12px;margin:12px 0}.pair select{min-width:0;width:100%;background:#f0f7fc;color:var(--ink);padding:10px 8px;border:2px solid #c0d8eb;border-radius:10px}.sequence{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.sequence button{background:#e5f3ff;border-color:#c4dced}.selected-order{background:#edf5ee;padding:12px;border-radius:12px;min-height:48px}.final{background:#e3f5ea;border-radius:14px;padding:20px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.two .graphic{margin:0}.two svg{max-height:160px}.prompt{font-weight:720}#quiz-body{min-height:160px}@media(max-width:520px){.two{grid-template-columns:1fr}.pair{grid-template-columns:1fr;gap:4px}.quiz{padding:16px}header strong{font-size:13px}}@media(prefers-reduced-motion:reduce){.progress>div{transition:none}}
</style></head>
<body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header>
<img class="lesson-image" src="../../images-lecons/sciences/maitre-hibou-air-comprime.png" alt="Leçon illustrée : L’air peut être comprimé">
<section class="quiz" aria-labelledby="heading"><h1 id="heading">Je m’entraîne</h1><p class="sub">10 activités, de la manipulation au défi final. Observe, cherche, puis vérifie.</p>
<div class="progress" role="progressbar" aria-label="Exercices réussis" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><div id="fill" style="width:0%"></div></div>
<div class="meta"><span id="counter">Exercice 1 sur 10</span><span class="star" id="level">★</span></div><h2 id="question"></h2><div id="quiz-body"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div class="controls"><button id="check" class="primary">Vérifier</button><button id="next" class="primary hidden">Exercice suivant →</button><button id="reset" class="secondary hidden">Recommencer</button></div>
</section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let index=0, solved=0, attempts=0, selected='', pressed=false, released=false, position=263, chosenOrder=[], choicesMap={}, phase=0;
const exercises=[
 ['Je manipule une seringue','★'],['J’observe ce qui change','★'],['Je prévois ce qui va se passer','★'],['L’air disparaît-il ?','★★'],['Je remets l’expérience dans l’ordre','★★'],['J’associe chaque observation','★★'],['Je complète la conclusion','★★'],['Je compare deux seringues','★★★'],['Je reconnais une autre situation','★★★'],['Défi Maître Hibou','★★★']
];
function button(label,id){return `<button type="button" class="option" data-answer="${id}" aria-pressed="false">${label}</button>`}
function choiceHtml(options){return `<div class="choices">${options.map(([label,id])=>button(label,id)).join('')}</div>`}
function syringeSVG(head=263,interact=false){const x=Number(head);const w=x-66;const dots=Array.from({length:20},(_,i)=>{const xx=76+((i*37)%173)/173*Math.max(18,w-22), yy=64+((i*29)%49);return `<circle cx="${xx.toFixed(1)}" cy="${yy}" r="3.1" fill="#2284af"/>`}).join('');return `<svg viewBox="0 0 390 180" role="img" aria-label="Seringue sans aiguille, embout bouché à gauche. Le piston est à droite${interact?', déplaçable horizontalement':''}."><rect x="14" y="78" width="27" height="16" rx="3" fill="#9aaeba"/><rect x="9" y="71" width="9" height="30" rx="3" fill="#dc9f80"/><text x="13" y="120" font-size="10" fill="#55718b">Bouché</text><rect x="44" y="50" width="252" height="75" rx="7" fill="#fff" stroke="#698ba3" stroke-width="3"/><rect x="65" y="54" width="${w}" height="67" fill="#bde9f8" opacity=".82"/>${dots}<rect x="${x}" y="48" width="15" height="79" rx="3" fill="#597689"/><rect x="${x+15}" y="84" width="${350-(x+15)}" height="8" fill="#8ca4b3"/><rect x="350" y="64" width="12" height="48" rx="3" fill="#607b8d"/>${interact?`<rect class="piston" x="${x-10}" y="34" width="${Math.max(0,376-(x-10))}" height="105" fill="transparent" tabindex="0" role="slider" aria-label="Position du piston" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((263-x)/126*100)}"/>`:''}<text x="${66+w/2}" y="145" fill="#286388" font-size="13" text-anchor="middle">Air</text><text x="190" y="20" text-anchor="middle" font-size="13" fill="#365d76">${x<190?'Air comprimé':'Air peu comprimé'}</text></svg>`}
function render(){attempts=0;selected='';phase=0;chosenOrder=[];choicesMap={};$('feedback').textContent='';$('feedback').className='feedback';$('check').classList.remove('hidden');$('next').classList.add('hidden');$('reset').classList.add('hidden');$('check').disabled=false;$('counter').textContent=`Exercice ${index+1} sur 10`;$('level').textContent=exercises[index][1];$('question').textContent=exercises[index][0];let h='';
switch(index){
case 0:position=263;pressed=false;released=false;h='<p>Avec ton doigt ou ta souris, <strong>pousse le piston vers la gauche</strong>, puis ramène-le vers la droite.</p><div class="graphic" id="syringe"></div><p class="small">Tu peux aussi utiliser le curseur sous la seringue.</p><input id="piston-range" class="range" aria-label="Pousser le piston" type="range" min="0" max="100" value="0"><p id="observation" class="prompt">Observe : l’air reste dans la seringue.</p>';break;
case 1:h='<p>Quand tu enfonces le piston d’une seringue bouchée, que remarques-tu ?</p>'+choiceHtml([['L’air occupe moins de place.','less'],['L’air disparaît.','gone'],['L’air devient de l’eau.','water']]);break;
case 2:h='<p>Tu as comprimé l’air dans une seringue bouchée. Que va-t-il se passer si tu relâches le piston ?</p>'+choiceHtml([['L’air se détend et peut repousser le piston.','back'],['Le piston reste forcément immobile.','stop'],['L’air disparaît définitivement.','lost']]);break;
case 3:h='<p>Vrai ou faux : quand on comprime l’air, une partie de l’air disparaît.</p>'+choiceHtml([['Vrai','true'],['Faux','false']]);break;
case 4:h='<p>Touche les trois actions <strong>dans le bon ordre</strong>.</p><div class="sequence" id="order-buttons"></div><div id="order-result" class="selected-order">Ton ordre : …</div><button type="button" id="order-undo" class="secondary">Effacer mon dernier choix</button>';break;
case 5:h='<p>Pour chaque situation, choisis la bonne explication.</p>'+pairHtml([['Je bouche l’embout.','L’air ne peut plus sortir.'],['Je pousse le piston.','L’air occupe moins de place.'],['Je relâche le piston.','L’air se détend.']],['L’air se détend.','L’air ne peut plus sortir.','L’air occupe moins de place.']);break;
case 6:h='<p>Complète la phrase avec les bons mots.</p><div class="pair"><label for="blank0">Quand je pousse le piston, l’air occupe</label><select id="blank0"><option value="">Choisis…</option><option>moins de place</option><option>plus de place</option><option>aucune place</option></select></div><div class="pair"><label for="blank1">L’air est toujours</label><select id="blank1"><option value="">Choisis…</option><option>absent</option><option>présent</option><option>liquide</option></select></div>';break;
case 7:h='<p>Les deux seringues sont bouchées et contiennent la même quantité d’air. Dans laquelle l’air occupe-t-il le moins de place ?</p><div class="two"><div class="graphic"><strong>Seringue A</strong>'+syringeSVG(259)+'</div><div class="graphic"><strong>Seringue B</strong>'+syringeSVG(139)+'</div></div>'+choiceHtml([['Seringue A','a'],['Seringue B','b'],['C’est pareil','same']]);break;
case 8:h='<p>Quelle situation utilise aussi la compression de l’air ?</p>'+choiceHtml([['J’actionne une pompe pour gonfler un pneu.','pump'],['Je taille un crayon.','pencil'],['Je feuillette un livre.','book']]);break;
case 9:h='<p><strong>Défi :</strong> tu bouches une seringue sans aiguille. Tu pousses son piston, puis tu le relâches. Quelle explication est la bonne ?</p>'+choiceHtml([['L’air reste enfermé, occupe moins de place puis se détend.','correct'],['L’air disparaît quand je pousse le piston.','missing'],['L’air se transforme en eau avant de revenir.','water']]);break;
}
$('quiz-body').innerHTML=h;document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.answer;document.querySelectorAll('[data-answer]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));}));if(index===0)initSyringe();if(index===4)initOrder();}
function pairHtml(rows,options){return rows.map((r,i)=>`<div class="pair"><label for="pair${i}">${r[0]}</label><select id="pair${i}"><option value="">Choisis…</option>${options.map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}
function initSyringe(){const container=$('syringe');function redraw(){container.innerHTML=syringeSVG(position,true);let slider=container.querySelector('.piston');slider.addEventListener('pointerdown',start);slider.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setPiston(position+(e.key==='ArrowLeft'?-12:12));}});$('piston-range').value=Math.round((263-position)/126*100);$('observation').textContent=position<210?'L’air occupe moins de place, mais il est toujours présent.':'L’air occupe davantage de place.'}
function setPiston(x){position=Math.max(137,Math.min(263,x));if(position<193)pressed=true;if(pressed&&position>244)released=true;redraw()}
function start(e){e.preventDefault();const svg=container.querySelector('svg'),box=svg.getBoundingClientRect();const pointerToX=ev=>{const x=(ev.clientX-box.left)/box.width*390;setPiston(x)};function move(ev){pointerToX(ev)}function end(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end)}window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true});window.addEventListener('pointercancel',end,{once:true});pointerToX(e)}
$('piston-range').addEventListener('input',e=>setPiston(263-Number(e.target.value)*1.26));redraw()}
function initOrder(){const items=[['Pousser le piston',1],['Boucher l’embout',0],['Relâcher le piston',2]];const wrapper=$('order-buttons');function draw(){wrapper.innerHTML='';items.filter(i=>!chosenOrder.includes(i[1])).forEach(([label,n])=>{const b=document.createElement('button');b.textContent=label;b.type='button';b.onclick=()=>{chosenOrder.push(n);draw()};wrapper.appendChild(b)});$('order-result').textContent='Ton ordre : '+(chosenOrder.length?chosenOrder.map(n=>['Boucher l’embout','Pousser le piston','Relâcher le piston'][n]).join(' → '):'…')}$('order-undo').onclick=()=>{chosenOrder.pop();draw()};draw()}
const keys=['','less','back','false','','','', 'b','pump','correct'];
const hints=['Pousse le piston vers la gauche, puis ramène-le vers la droite.','La seringue reste bouchée : l’air peut-il partir ?','L’air comprimé exerce une pression sur le piston.','Compte les particules : aucune ne disparaît.','Avant de pousser le piston, il faut enfermer l’air.','Demande-toi si l’air peut sortir, se comprime ou se détend.','L’air ne disparaît pas quand son volume diminue.','Regarde l’espace bleu dans les deux seringues.','Cherche l’objet qui pousse de l’air dans un pneu.','Rappelle-toi les trois étapes de la manipulation.'];
function valid(){switch(index){case 0:return pressed&&released;case 4:return chosenOrder.length===3&&chosenOrder.join(',')==='0,1,2';case 5:return ['L’air ne peut plus sortir.','L’air occupe moins de place.','L’air se détend.'].every((v,i)=>$('pair'+i).value===v);case 6:return $('blank0').value==='moins de place'&&$('blank1').value==='présent';default:return selected===keys[index]}}
function answerGiven(){switch(index){case 0:return pressed||released;case 4:return chosenOrder.length===3;case 5:return [0,1,2].every(i=>$('pair'+i).value!=='');case 6:return $('blank0').value!==''&&$('blank1').value!=='';default:return selected!==''}}
function check(){if(!answerGiven()){$('feedback').textContent=index===0?'Commence par déplacer le piston.':'Choisis une réponse avant de vérifier.';$('feedback').className='feedback bad';return}if(!valid()){attempts++;$('feedback').className='feedback bad';$('feedback').textContent=(attempts===1?'Observe encore. Indice : ':'Réessaie. Aide : ')+hints[index];return}solved=index+1;$('fill').style.width=solved*10+'%';$('progress').setAttribute('aria-valuenow',String(solved));$('feedback').className='feedback good';$('feedback').textContent=['Bravo ! Tu as comprimé puis détendu l’air.','Exact ! L’air occupe moins de place.','Oui ! L’air peut repousser le piston.','Exact ! L’air ne disparaît pas.','Bravo ! Tu as retrouvé les étapes.','Toutes les associations sont correctes !','Bravo ! Tu connais la conclusion.','Exact : l’air est davantage comprimé dans B.','Oui ! La pompe comprime l’air.','Bravo ! Tu sais expliquer l’expérience.'][index];$('check').classList.add('hidden');if(index===9)end();else $('next').classList.remove('hidden')}
function end(){$('next').classList.add('hidden');$('feedback').textContent='Bravo ! Tu as terminé les 10 exercices.';$('quiz-body').innerHTML='<div class="final"><h2>Défi réussi !</h2><p>Tu as réussi les 10 activités. Tu sais que l’air peut être comprimé : il occupe alors moins de place, sans disparaître.</p><p>Tu peux maintenant expliquer cette expérience à quelqu’un.</p></div>';$('reset').classList.remove('hidden')}
$('check').onclick=check;$('next').onclick=()=>{index++;render()};$('reset').onclick=()=>{index=0;solved=0;$('fill').style.width='0%';$('progress').setAttribute('aria-valuenow','0');render();window.scrollTo({top:document.querySelector('.quiz').offsetTop,behavior:'smooth'})};render();
</script></body></html>
