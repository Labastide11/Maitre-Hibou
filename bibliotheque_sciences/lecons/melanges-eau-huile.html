<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’eau et l’huile ne se mélangent pas — Maître Hibou Sciences CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf4fc;color:#173553;font:18px system-ui,Arial,sans-serif}main{width:100%;padding:clamp(8px,1.2vw,18px)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;gap:14px}header a{color:#134d84;text-decoration:none;font-weight:800}.lesson-image{width:100%;height:auto;max-width:100%;display:block;border-radius:12px}.quiz{width:100%;padding:clamp(15px,2vw,28px);background:#fff;border-radius:18px;margin:15px 0 32px;box-shadow:0 3px 15px #19365320}h1{font-size:clamp(22px,2.3vw,33px);margin:0 0 8px}.bar{height:13px;background:#dceaf4;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#4eac74;transition:width .2s}.question{font-size:clamp(21px,2.5vw,30px);font-weight:800;margin:14px 0 18px}.answers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}button{cursor:pointer;border:0;border-radius:13px;padding:13px 17px;font:700 18px system-ui,Arial;min-height:50px}button:focus-visible{outline:3px solid #e5a21c;outline-offset:2px}.choice{background:#e8f3ff;color:#173553;border:2px solid #bdd7ee;text-align:left}.choice:disabled{cursor:default}.choice.wrong{background:#ffe5e5;border-color:#d37770}.choice.right{background:#d5f5df;border-color:#4eaa71}#next,#done{margin-top:15px;background:#148355;color:#fff}#restart{margin-top:15px;background:#edf1f5}#feedback{min-height:30px;font-weight:750;margin:14px 0 0}#feedback.error{color:#a73627}#feedback.success{color:#167848}.hidden{display:none!important}.note{color:#526d86;font-size:16px}.final{font-size:21px;font-weight:800;color:#167848}</style></head><body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header><img class="lesson-image" src="../../images-lecons/sciences/maitre-hibou-melanges-eau-huile.png" alt="Affiche illustrée : L’eau et l’huile ne se mélangent pas"><section class="quiz"><h1>À toi d’expérimenter !</h1><p class="note">Réponds à 10 questions. Une bonne réponse est nécessaire pour passer à la suivante.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="counter"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="hidden">Question suivante →</button><button id="done" class="hidden">J’ai compris cette leçon ✓</button><button id="restart" class="hidden">Recommencer</button><p id="result" class="final"></p></section></main><script>const tasks=[{"q": "Quel liquide est au-dessus après le repos ?", "choices": ["L’huile", "L’eau", "Les deux disparaissent"], "a": "L’huile", "hint": "Observe les deux couches dans le verre."}, {"q": "Au départ, dans cette expérience, on utilise…", "choices": ["De l’eau et de l’huile", "Du lait et du sable", "Du jus et du sucre"], "a": "De l’eau et de l’huile", "hint": "Regarde le titre de la leçon."}, {"q": "Lorsque l’on verse l’huile dans l’eau, on observe…", "choices": ["Deux couches", "Un seul liquide uniforme", "Un solide"], "a": "Deux couches", "hint": "Les liquides restent séparés."}, {"q": "Que se passe-t-il si on agite le récipient fermé ?", "choices": ["L’huile forme de petites gouttes", "L’eau disparaît", "L’huile se transforme en glace"], "a": "L’huile forme de petites gouttes", "hint": "Observe le mélange juste après l’agitation."}, {"q": "Après quelques minutes de repos…", "choices": ["Les liquides se séparent à nouveau", "Ils deviennent du lait", "Ils restent toujours parfaitement mélangés"], "a": "Les liquides se séparent à nouveau", "hint": "Regarde la dernière photo."}, {"q": "L’huile est-elle au-dessus ou en dessous de l’eau ?", "choices": ["Au-dessus", "En dessous"], "a": "Au-dessus", "hint": "Regarde les étiquettes eau et huile."}, {"q": "L’eau et l’huile sont…", "choices": ["Deux liquides différents", "Deux gaz", "Deux solides"], "a": "Deux liquides différents", "hint": "Les deux peuvent couler."}, {"q": "Quand les gouttes d’huile remontent, elles…", "choices": ["Se regroupent en une couche", "Deviennent du sable", "Disparaissent"], "a": "Se regroupent en une couche", "hint": "Elles forment à nouveau la couche supérieure."}, {"q": "Peut-on les mélanger durablement simplement en remuant ?", "choices": ["Non", "Oui"], "a": "Non", "hint": "Après le repos, elles se séparent."}, {"q": "Quelle conclusion correspond à notre observation ?", "choices": ["L’eau et l’huile ne restent pas mélangées", "L’huile se dissout complètement", "L’eau devient jaune pour toujours"], "a": "L’eau et l’huile ne restent pas mélangées", "hint": "Observe les couches après quelques minutes."}];let index=0,correct=0;const el=id=>document.getElementById(id);function show(){const t=tasks[index];el('counter').textContent=`Question ${index+1} sur ${tasks.length}`;el('question').textContent=t.q;el('feedback').textContent='';el('feedback').className='';el('next').classList.add('hidden');el('done').classList.add('hidden');el('restart').classList.add('hidden');el('answers').innerHTML='';t.choices.forEach(value=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.onclick=()=>choose(value,b);el('answers').appendChild(b);});el('fill').style.width=`${correct*100/tasks.length}%`;}function choose(value,b){if(value!==tasks[index].a){b.disabled=true;b.classList.add('wrong');el('feedback').className='error';el('feedback').textContent='Essaie encore ! Indice : '+tasks[index].hint;return;}correct++;el('fill').style.width=`${correct*100/tasks.length}%`;b.classList.add('right');for(const btn of el('answers').children)btn.disabled=true;el('feedback').className='success';el('feedback').textContent='Bravo ! Bonne réponse.';if(index===tasks.length-1){el('done').classList.remove('hidden');el('restart').classList.remove('hidden');}else el('next').classList.remove('hidden');}el('next').onclick=()=>{if(correct!==index+1)return;index++;show();};el('restart').onclick=()=>{index=0;correct=0;el('result').textContent='';show();};el('done').onclick=()=>{if(correct!==tasks.length)return;el('result').textContent='Bravo ! Tu as compris cette leçon.';el('done').disabled=true;el('done').textContent='Leçon terminée ✓';};show();</script></body></html>
