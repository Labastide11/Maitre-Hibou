<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transparent, translucide ou opaque ? — Maître Hibou Sciences CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf4fc;color:#173553;font:18px system-ui,Arial,sans-serif}main{width:100%;padding:clamp(8px,1.2vw,18px)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;gap:14px}header a{color:#134d84;text-decoration:none;font-weight:800}.lesson-image{width:100%;height:auto;max-width:100%;display:block;border-radius:12px}.quiz{width:100%;padding:clamp(15px,2vw,28px);background:#fff;border-radius:18px;margin:15px 0 32px;box-shadow:0 3px 15px #19365320}h1{font-size:clamp(22px,2.3vw,33px);margin:0 0 8px}.bar{height:13px;background:#dceaf4;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#4eac74;transition:width .2s}.question{font-size:clamp(21px,2.5vw,30px);font-weight:800;margin:14px 0 18px}.answers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}button{cursor:pointer;border:0;border-radius:13px;padding:13px 17px;font:700 18px system-ui,Arial;min-height:50px}button:focus-visible{outline:3px solid #e5a21c;outline-offset:2px}.choice{background:#e8f3ff;color:#173553;border:2px solid #bdd7ee;text-align:left}.choice:disabled{cursor:default}.choice.wrong{background:#ffe5e5;border-color:#d37770}.choice.right{background:#d5f5df;border-color:#4eaa71}#next,#done{margin-top:15px;background:#148355;color:#fff}#restart{margin-top:15px;background:#edf1f5}#feedback{min-height:30px;font-weight:750;margin:14px 0 0}#feedback.error{color:#a73627}#feedback.success{color:#167848}.hidden{display:none!important}.note{color:#526d86;font-size:16px}.final{font-size:21px;font-weight:800;color:#167848}</style></head><body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header><img class="lesson-image" src="../../images-lecons/sciences/maitre-hibou-transparent-translucide-opaque.png" alt="Affiche illustrée : Transparent, translucide ou opaque ?"><section class="quiz"><h1>À toi d’expérimenter !</h1><p class="note">Réponds à 10 questions. Une bonne réponse est nécessaire pour passer à la suivante.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="counter"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="hidden">Question suivante →</button><button id="done" class="hidden">J’ai compris cette leçon ✓</button><button id="restart" class="hidden">Recommencer</button><p id="result" class="final"></p></section></main><script>const tasks=[{"q": "À travers quel matériau voit-on nettement ?", "choices": ["Un verre transparent", "Un carton", "Une planche de bois"], "a": "Un verre transparent", "hint": "Transparent signifie que l’on peut voir à travers."}, {"q": "Quel matériau laisse passer la lumière mais montre les objets flous ?", "choices": ["Translucide", "Opaque", "Métallique"], "a": "Translucide", "hint": "On voit flou à travers."}, {"q": "Un objet opaque…", "choices": ["Ne laisse pas passer la lumière", "Laisse tout voir", "Est toujours mou"], "a": "Ne laisse pas passer la lumière", "hint": "Le carton est un exemple."}, {"q": "Une fenêtre en verre clair est souvent…", "choices": ["Transparente", "Opaque", "Translucide"], "a": "Transparente", "hint": "On voit nettement à travers."}, {"q": "Un rideau fin qui laisse passer de la lumière sans voir nettement est…", "choices": ["Translucide", "Opaque", "Transparent"], "a": "Translucide", "hint": "La lumière passe, mais l’image est floue."}, {"q": "Une porte en bois est…", "choices": ["Opaque", "Transparente", "Translucide"], "a": "Opaque", "hint": "Peut-on voir à travers le bois ?"}, {"q": "Une vitre dépolie est généralement…", "choices": ["Translucide", "Opaque", "Parfaitement transparente"], "a": "Translucide", "hint": "Elle laisse passer la lumière, mais on voit flou."}, {"q": "Une règle en plastique transparent laisse…", "choices": ["Passer la lumière", "Toujours une ombre noire", "Passer seulement le son"], "a": "Passer la lumière", "hint": "Le plastique transparent permet de voir à travers."}, {"q": "Avec quoi peut-on bloquer la lumière ?", "choices": ["Du carton", "Du verre clair", "De l’eau propre"], "a": "Du carton", "hint": "Choisis un matériau opaque."}, {"q": "Pour classer un matériau, je regarde…", "choices": ["S’il laisse passer la lumière et ce que je vois à travers", "Seulement sa couleur", "Seulement sa taille"], "a": "S’il laisse passer la lumière et ce que je vois à travers", "hint": "Transparent, translucide et opaque concernent le passage de la lumière."}];let index=0,correct=0;const el=id=>document.getElementById(id);function show(){const t=tasks[index];el('counter').textContent=`Question ${index+1} sur ${tasks.length}`;el('question').textContent=t.q;el('feedback').textContent='';el('feedback').className='';el('next').classList.add('hidden');el('done').classList.add('hidden');el('restart').classList.add('hidden');el('answers').innerHTML='';t.choices.forEach(value=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.onclick=()=>choose(value,b);el('answers').appendChild(b);});el('fill').style.width=`${correct*100/tasks.length}%`;}function choose(value,b){if(value!==tasks[index].a){b.disabled=true;b.classList.add('wrong');el('feedback').className='error';el('feedback').textContent='Essaie encore ! Indice : '+tasks[index].hint;return;}correct++;el('fill').style.width=`${correct*100/tasks.length}%`;b.classList.add('right');for(const btn of el('answers').children)btn.disabled=true;el('feedback').className='success';el('feedback').textContent='Bravo ! Bonne réponse.';if(index===tasks.length-1){el('done').classList.remove('hidden');el('restart').classList.remove('hidden');}else el('next').classList.remove('hidden');}el('next').onclick=()=>{if(correct!==index+1)return;index++;show();};el('restart').onclick=()=>{index=0;correct=0;el('result').textContent='';show();};el('done').onclick=()=>{if(correct!==tasks.length)return;el('result').textContent='Bravo ! Tu as compris cette leçon.';el('done').disabled=true;el('done').textContent='Leçon terminée ✓';};show();</script></body></html>
