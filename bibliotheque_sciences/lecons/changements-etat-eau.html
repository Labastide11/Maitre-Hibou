<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les changements d’état de l’eau — Maître Hibou Sciences CE2</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#163756;background:#edf5fb}*{box-sizing:border-box}body{margin:0}main{max-width:1600px;margin:auto;padding:clamp(8px,1.4vw,20px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 3px 15px;font-size:clamp(13px,1.4vw,17px)}.top a{font-weight:800;color:#156194;text-decoration:none}.lesson{width:100%;height:auto;display:block;border-radius:15px;box-shadow:0 5px 21px #23456017}.board{margin:18px 0 28px;border-radius:22px;background:white;box-shadow:0 7px 28px #16446a14;padding:clamp(15px,2.8vw,32px)}.board h1{font-size:clamp(24px,3vw,36px);margin:0 0 7px;color:#113c6b}.sub{margin:0 0 17px;color:#536e85;line-height:1.4}.tracker{display:flex;align-items:center;gap:12px;font-weight:750;font-size:14px}.meter{flex:1;background:#e0edf8;border-radius:999px;height:11px;overflow:hidden}.meter>span{height:100%;display:block;background:#13a78d;width:0;transition:width .25s}.activity{margin:20px 0;padding:clamp(12px,2.1vw,23px);border:1px solid #dce9f2;background:#f8fbff;border-radius:19px;min-height:300px}.activity h2{font-size:clamp(21px,2.4vw,29px);margin:0 0 10px;line-height:1.3}.hint-text{color:#506d87;margin:6px 0 14px;font-size:16px}.choices,.tokens{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.opt,.chip{font:700 17px system-ui;color:#183957;border:2px solid #c9deed;background:#fff;border-radius:14px;padding:13px 16px;min-height:52px;cursor:pointer;text-align:left}.opt:hover,.chip:hover{background:#eaf6fe}.opt[aria-pressed=true],.chip[aria-pressed=true]{background:#d9f5f0;border-color:#098f83}.opt:focus-visible,.chip:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #e4a329;outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.primary,.secondary{min-height:49px;border:0;border-radius:13px;padding:12px 19px;font:800 16px system-ui;cursor:pointer}.primary{background:#126aa7;color:white}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#dfeef8;color:#174b70}.feedback{border-radius:13px;padding:13px 15px;margin-top:13px;font-weight:650;line-height:1.5;min-height:0}.feedback:empty{display:none}.feedback.good{background:#e2f7eb;color:#19653f}.feedback.bad{background:#fff3d9;color:#765015}.phase{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.stars{font-size:13px;color:#8b6b10;font-weight:800}.stage-visual{background:linear-gradient(145deg,#e6f5ff,#fcffff);border:2px solid #d0e7f5;border-radius:17px;padding:10px;margin:10px 0}.stage-visual svg{display:block;max-width:540px;width:100%;height:auto;margin:auto}.stage-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.stage-actions button{font:750 15px system-ui;min-height:51px;padding:9px;border:2px solid #b8d5ea;border-radius:12px;background:#fff;color:#1a507b;cursor:pointer}.stage-actions button:disabled{opacity:.4;cursor:not-allowed}.current{font-weight:750;text-align:center;margin:4px 0}.sequence{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border:2px dashed #bfd8ea;border-radius:12px;background:#fff;min-height:63px}.sequence .chip{background:#d9f2ff}.mini-label{font-size:14px;color:#536e85;font-weight:750;margin-top:13px}.blank{min-height:49px;padding:10px 13px;border:2px solid #bfd3e4;border-radius:12px;font:18px system-ui;max-width:100%;width:350px}.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.match label{display:flex;align-items:center;gap:8px;background:#fff;padding:9px;border-radius:11px;border:1px solid #dae7f3}.match select{font:16px system-ui;padding:10px;min-width:0;width:100%;border:2px solid #c9deed;border-radius:9px}.selection{background:#e4f1fb;padding:11px;border-radius:10px;margin-top:9px}.outro{text-align:center;padding:25px 8px}.outro h2{font-size:30px}.hidden{display:none!important}@media(min-width:800px){.stage-actions{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:540px){.board{padding:13px}.activity{padding:12px}.stage-actions{grid-template-columns:repeat(2,minmax(0,1fr))}.match{grid-template-columns:1fr}.opt{width:100%}.top strong{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main><header class="top"><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header>
<img class="lesson" src="../../images-lecons/sciences/maitre-hibou-changements-etat-eau.png" alt="Leçon illustrée : les changements d’état de l’eau, la fusion, la solidification, l’évaporation et la condensation">
<section class="board" aria-label="Dix exercices interactifs"><h1>Je m’entraîne avec Maître Hibou</h1><p class="sub">Observe, manipule et cherche. Tu peux recevoir un indice avant de réessayer.</p>
<div class="tracker"><span id="counter">Exercice 1 / 10</span><div class="meter" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><span id="progressfill"></span></div></div>
<div class="activity" id="activity"></div><div class="actions" id="bottomActions"><button class="primary" id="check" type="button">Vérifier ma réponse</button><button class="primary hidden" id="next" type="button">Exercice suivant →</button><button class="secondary" id="restart" type="button">Recommencer</button></div>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div></section></main>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id),activity=$('activity'),feedback=$('feedback');
let index=0,completed=0,selection=null,tryCount=0,solved=false,water='liquid',visited=new Set(),sequence=[],selectSet=new Set();
const tasks=[
{title:'Je manipule les changements d’état',star:1,type:'sim',prompt:'Clique sur les quatre transformations pour observer ce qui arrive à l’eau. Commence par la glace.',hint:'Fais passer la glace en eau, l’eau en glace, l’eau en vapeur, puis la vapeur en eau.'},
{title:'La glace fond',star:1,type:'qcm',prompt:'Quand un glaçon fond, il devient…',options:['de l’eau liquide','de la vapeur d’eau','de l’air'],answer:0,hint:'Observe la première photographie de la leçon : que trouve-t-on dans le bol ?'},
{title:'L’eau se solidifie',star:1,type:'qcm',prompt:'On met de l’eau liquide au congélateur. Que devient-elle ?',options:['De la glace','De la vapeur','Du brouillard'],answer:0,hint:'Le congélateur refroidit l’eau jusqu’à ce qu’elle devienne solide.'},
{title:'Quel changement est-ce ?',star:2,type:'qcm',prompt:'La glace passe de l’état solide à l’état liquide. Comment s’appelle ce changement ?',options:['La solidification','La fusion','La condensation'],answer:1,hint:'Le nom de ce changement commence par F.'},
{title:'Je remets les étapes dans l’ordre',star:2,type:'sequence',prompt:'Remets dans l’ordre ce qui se passe lorsqu’un glaçon fond.',items:['Le glaçon est solide.','On réchauffe le glaçon.','Il devient de l’eau liquide.'],hint:'Avant d’être chauffé, le glaçon est encore solide.'},
{title:'J’associe les mots et les changements',star:2,type:'match',prompt:'Choisis la transformation qui correspond à chaque situation.',items:[['La glace devient liquide','Fusion'],['L’eau devient glace','Solidification'],['L’eau liquide devient vapeur','Évaporation'],['La vapeur devient liquide','Condensation']],hint:'Cherche le sens des flèches sur la leçon : solide, liquide ou gazeux.'},
{title:'Je complète la phrase',star:2,type:'fill',prompt:'Quand la vapeur d’eau se refroidit et redevient liquide, c’est la…',answer:['condensation'],hint:'C’est le quatrième changement présenté sur l’affiche.'},
{title:'La vapeur est-elle visible ?',star:3,type:'qcm',prompt:'Au-dessus de la casserole, on voit un petit nuage blanc. De quoi est-il surtout formé ?',options:['De fines gouttelettes d’eau liquide','De vapeur d’eau invisible','De petits morceaux de glace'],answer:0,hint:'La vapeur d’eau est invisible. Quand elle refroidit, de minuscules gouttes apparaissent.'},
{title:'Je retrouve toutes les bonnes situations',star:3,type:'multi',prompt:'Choisis toutes les situations où l’eau liquide devient solide.',options:['Un bac à glaçons placé au congélateur','Un glaçon posé au soleil','Une flaque d’eau qui gèle en hiver','De l’eau qui bout dans une casserole'],answer:[0,2],hint:'Cherche les situations où l’eau refroidit et forme de la glace.'},
{title:'Défi Maître Hibou',star:3,type:'qcm',prompt:'Des gouttes apparaissent à l’extérieur d’un verre très froid. Que s’est-il passé ?',options:['La vapeur d’eau de l’air s’est condensée en gouttes','L’eau du verre a traversé le verre','Le verre a fabriqué de l’eau'],answer:0,hint:'L’air contient de la vapeur d’eau invisible. Que se passe-t-il lorsqu’elle touche une surface froide ?'}
];
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\"':'&quot;',"'":'&#39;'}[c]));
const normal=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').trim().replace(/\s+/g,' ');
function setFeed(msg,good){feedback.className='feedback '+(good?'good':'bad');feedback.textContent=msg;}
function render(){const t=tasks[index]; selection=null;tryCount=0;solved=false;sequence=[];selectSet=new Set();if(index===0){water='solid';visited=new Set();}feedback.textContent='';feedback.className='feedback';$('check').classList.remove('hidden');$('check').disabled=false;$('next').classList.add('hidden');$('next').textContent=index===9?'Voir mon bilan →':'Exercice suivant →';$('counter').textContent='Exercice '+(index+1)+' / 10';$('progressfill').style.width=(completed/10*100)+'%';$('progress').setAttribute('aria-valuenow',completed);
activity.innerHTML='<div class="phase"><span class="stars">'+'★'.repeat(t.star)+'☆'.repeat(3-t.star)+'</span><span>Sciences · CE2</span></div><h2>'+safe(t.title)+'</h2><p class="hint-text">'+safe(t.prompt)+'</p><div id="control"></div>';
if(t.type==='sim'){renderSim();}
if(t.type==='qcm'){renderChoices(t.options,false);}
if(t.type==='multi'){renderChoices(t.options,true);}
if(t.type==='sequence'){renderSequence();}
if(t.type==='match'){renderMatches();}
if(t.type==='fill'){$('control').innerHTML='<label for="entry" class="mini-label">Écris le mot qui manque :</label><div><input class="blank" id="entry" type="text" autocomplete="off" spellcheck="false" placeholder="Ton mot…"></div>';}
}
function renderChoices(options,multiple){$('control').innerHTML='<div class="choices" role="group" aria-label="Réponses possibles">'+options.map((v,i)=>'<button type="button" class="opt" data-val="'+i+'" aria-pressed="false">'+safe(v)+'</button>').join('')+'</div>';$('control').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{let k=Number(b.dataset.val);if(multiple){if(selectSet.has(k))selectSet.delete(k);else selectSet.add(k);}else selection=k;$('control').querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',String(multiple?selectSet.has(+x.dataset.val):selection===+x.dataset.val)));}));}
function renderSequence(){const items=tasks[index].items;let order=[2,0,1];$('control').innerHTML='<div class="mini-label">Appuie sur les phrases dans le bon ordre :</div><div id="sequence" class="sequence" aria-live="polite">À toi de choisir…</div><div class="tokens" id="tokens">'+order.map(i=>'<button class="chip" data-key="'+i+'" type="button">'+safe(items[i])+'</button>').join('')+'</div><button class="secondary" id="clearseq" type="button">Effacer mon ordre</button>';function display(){const area=$('sequence');area.textContent=sequence.length?sequence.map(i=>items[i]).join('  →  '):'À toi de choisir…';$('tokens').querySelectorAll('.chip').forEach(b=>b.disabled=sequence.includes(+b.dataset.key));}$('tokens').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{sequence.push(+b.dataset.key);display();}));$('clearseq').addEventListener('click',()=>{sequence=[];display();});}
function renderMatches(){const options=['— Choisis —','Condensation','Solidification','Fusion','Évaporation'];$('control').innerHTML='<div class="match">'+tasks[index].items.map((pair,i)=>'<label><span>'+safe(pair[0])+'</span><select aria-label="Transformation pour '+safe(pair[0])+'" data-row="'+i+'">'+options.map((v,j)=>'<option value="'+(j? v:'')+'">'+v+'</option>').join('')+'</select></label>').join('')+'</div>';}
const transforms=[{name:'Fusion',from:'solid',to:'liquid',verb:'On chauffe la glace : elle fond et devient liquide.',symbol:'☀️'},{name:'Solidification',from:'liquid',to:'solid',verb:'On refroidit l’eau : elle devient de la glace.',symbol:'❄️'},{name:'Évaporation',from:'liquid',to:'gas',verb:'L’eau s’évapore : elle passe à l’état gazeux.',symbol:'☀️'},{name:'Condensation',from:'gas',to:'liquid',verb:'La vapeur d’eau refroidit : elle redevient liquide.',symbol:'❄️'}];
function renderSim(){const names={solid:'Glace · solide',liquid:'Eau · liquide',gas:'Vapeur d’eau · gazeux'};$('control').innerHTML='<div class="stage-visual"><svg viewBox="0 0 460 240" role="img" aria-label="Schéma montrant les états de l’eau"><defs><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#d2f5ff" stop-opacity=".7"/><stop offset="1" stop-color="#70bbdd" stop-opacity=".25"/></linearGradient></defs><path d="M124 54 L138 202 Q230 218 322 202 L336 54" fill="none" stroke="#537caa" stroke-width="7" stroke-linecap="round"/><path d="M139 125 L149 196 Q230 209 311 196 L321 125 Z" id="waterFill" fill="url(#glass)"/><g id="cubes"><rect x="159" y="134" width="65" height="52" rx="8" fill="#8fe0ff" stroke="#55a1ce" stroke-width="3" transform="rotate(-12 190 158)"/><rect x="227" y="140" width="59" height="48" rx="7" fill="#c4efff" stroke="#55a1ce" stroke-width="3" transform="rotate(10 253 164)"/></g><g id="droplets"><path d="M230 114 C220 135 213 144 213 157 A18 18 0 0 0 249 157 C249 144 240 132 230 114" fill="#50b8ef" opacity=".7"/></g><g id="gasDots"><circle cx="162" cy="74" r="5" fill="#78c5e1"/><circle cx="210" cy="50" r="5" fill="#78c5e1"/><circle cx="263" cy="77" r="5" fill="#78c5e1"/><circle cx="314" cy="45" r="5" fill="#78c5e1"/><circle cx="183" cy="113" r="5" fill="#78c5e1"/><circle cx="280" cy="116" r="5" fill="#78c5e1"/></g><text x="230" y="25" text-anchor="middle" fill="#15486f" font-size="18" font-weight="700" id="stateName"></text><text x="230" y="228" text-anchor="middle" fill="#446c87" font-size="13">Schéma simplifié</text></svg><p class="current" id="simNote"></p></div><div class="stage-actions" id="transformButtons"></div><p class="mini-label" id="visitCount"></p>';
const buttons=$('transformButtons');transforms.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=t.symbol+' '+t.name;b.disabled=water!==t.from;b.addEventListener('click',()=>{water=t.to;visited.add(i);updateSim(t.verb);});buttons.appendChild(b);});updateSim('Essaie les transformations en cliquant sur leurs boutons.');}
function updateSim(note){$('cubes').style.display=water==='solid'?'':'none';$('waterFill').style.display=water==='liquid'?'':'none';$('droplets').style.display=water==='liquid'?'':'none';$('gasDots').style.display=water==='gas'?'':'none';$('stateName').textContent={solid:'Glace — état solide',liquid:'Eau — état liquide',gas:'Vapeur d’eau — état gazeux'}[water];$('simNote').textContent=note;$('visitCount').textContent='Transformations explorées : '+visited.size+' / 4';$('transformButtons').querySelectorAll('button').forEach((b,i)=>b.disabled=solved||water!==transforms[i].from);}
function validate(){if(solved)return;const t=tasks[index];let right=false,hasValue=true;
if(t.type==='sim'){right=visited.size===4;hasValue=visited.size>0;}
if(t.type==='qcm'){right=selection===t.answer;hasValue=selection!==null;}
if(t.type==='multi'){right=selectSet.size===t.answer.length&&t.answer.every(x=>selectSet.has(x));hasValue=selectSet.size>0;}
if(t.type==='sequence'){right=sequence.join(',')==='0,1,2';hasValue=sequence.length===3;}
if(t.type==='match'){const v=[...$('control').querySelectorAll('select')].map(x=>x.value);right=v.every((x,i)=>x===t.items[i][1]);hasValue=v.every(Boolean);}
if(t.type==='fill'){const v=normal($('entry').value);right=t.answer.some(a=>normal(a)===v);hasValue=!!v;}
if(!hasValue){setFeed(t.type==='sim'?'Explore les quatre transformations avant de vérifier.':'Complète ta réponse avant de vérifier.',false);return;}
if(right){solved=true;completed=index+1;$('progressfill').style.width=(completed*10)+'%';$('progress').setAttribute('aria-valuenow',completed);$('check').classList.add('hidden');$('next').classList.remove('hidden');$('control').querySelectorAll('button, select, input').forEach(el=>el.disabled=true);setFeed(index===0?'Bravo ! Tu as expérimenté les quatre changements d’état.':index===9?'Bravo ! Tu as réussi le défi final.':'Bravo, belle réussite ! Tu peux continuer.',true);}else{tryCount++;setFeed('Pas encore. Indice : '+t.hint+' Prends le temps d’observer et réessaie.',false);}
}
function next(){if(!solved)return;if(index===9){showEnd();return;}index++;render();activity.scrollIntoView({behavior:'smooth',block:'start'});}
function showEnd(){activity.innerHTML='<div class="outro"><div style="font-size:54px" aria-hidden="true">🦉</div><h2>Bravo, explorateur !</h2><p>Tu as terminé les 10 exercices sur les changements d’état de l’eau.</p><p>Tu sais reconnaître la <strong>fusion</strong>, la <strong>solidification</strong>, l’<strong>évaporation</strong> et la <strong>condensation</strong>.</p><p class="hint-text">Je retiens : chauffer ou refroidir l’eau peut la faire changer d’état.</p></div>';$('counter').textContent='10 / 10 exercices réussis';$('check').classList.add('hidden');$('next').classList.add('hidden');setFeed('Parcours terminé !',true);}
$('check').addEventListener('click',validate);$('next').addEventListener('click',next);$('restart').addEventListener('click',()=>{index=0;completed=0;render();});render();
})();
</script></body></html>
