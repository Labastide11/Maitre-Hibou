<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les changements d’état de l’eau — Maître Hibou Sciences CE2</title><style>*{box-sizing:border-box}body{margin:0;color:#19365e;font-family:system-ui,Arial,sans-serif;background:#eff6fc}main{max-width:none;width:100%;padding:clamp(8px,1.2vw,20px);margin:auto}.back{display:inline-flex;padding:9px 14px;color:#245b97;text-decoration:none;background:white;border-radius:12px;font-weight:700;margin-bottom:12px}.poster{display:block;width:100%;height:auto;max-height:none;border-radius:16px;box-shadow:0 4px 14px #20375326}.practice{width:100%;margin-top:18px;background:white;border-radius:20px;padding:clamp(18px,3vw,32px);box-shadow:0 4px 14px #20375312}.practice h1{font-size:clamp(23px,3vw,36px);margin:0 0 8px}.practice p{line-height:1.5}.progress{height:13px;border-radius:10px;background:#deebf3;overflow:hidden}.fill{height:100%;background:#37a96d;transition:width .2s}.meta{margin:13px 0;font-weight:750}.question{font-size:clamp(21px,2.7vw,32px);font-weight:800;margin:15px 0}button{font:inherit;cursor:pointer;touch-action:manipulation;border-radius:12px;min-height:47px;padding:10px 15px;border:2px solid #bdcfe5;background:#edf5ff;color:#163e71;font-weight:750}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}.selected{background:#d9e8ff;border-color:#2578ce}.feedback{font-weight:750;min-height:32px;margin:13px 0;font-size:18px}.bad{color:#ae3636}.good{color:#18884e}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary{background:#2264a8;color:white;border-color:#2264a8}.continue{background:#238256;color:white;border-color:#238256}.finish{display:none;background:#eaf9ef;border:2px solid #7cce98;padding:20px;border-radius:18px}.finish strong{font-size:26px}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:9px;margin:12px 0}.column{border-radius:12px;background:#f1f7ff;border:2px dashed #cbd7e8;padding:10px;min-height:100px}.column h3{margin:0 0 8px}.tile{display:inline-flex;flex-direction:column;align-items:center;gap:4px;max-width:180px;margin:5px;padding:8px;border:2px solid #c4d6ea;background:white;border-radius:12px;font-weight:700}.tile span{font-size:28px}.tile.selected{border-color:#1776d4;background:#dcefff}.bank{background:#f9fbff;border-radius:12px;padding:8px}.small{color:#526b86;font-size:15px}.ordering{display:flex;gap:9px;flex-wrap:wrap;min-height:70px;padding:10px;background:#fff8e9;border:2px dashed #e1c785;border-radius:12px}.ordering button{background:#fff}.is-hidden{display:none!important}button:focus-visible{outline:3px solid #f7ab31;outline-offset:2px}button:disabled{opacity:.6;cursor:default}</style></head><body><main><a class="back" href="../index.html">← Sciences CE2</a><img class="poster" src="../../images-lecons/sciences/maitre-hibou-changements-etat-eau.png" alt="Affiche de la leçon : Les changements d’état de l’eau"><section class="practice"><div id="work"><h1>À toi de jouer !</h1><p>Observe la leçon, puis réussis les 10 exercices. Tu peux corriger avant de continuer.</p><div class="progress"><div class="fill" id="fill"></div></div><div class="meta" id="count"></div><div class="question" id="question"></div><div id="area"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="primary" id="check" type="button">Vérifier</button><button class="continue is-hidden" id="next" type="button">Question suivante →</button></div></div><div class="finish" id="finish"><strong>Bravo, tu as réussi les 10 exercices !</strong><p>Tu peux valider ta leçon.</p><button class="continue" id="done" type="button">J’ai compris cette leçon</button></div></section></main><script>(()=>{'use strict';const Q=[["choix", "Quand un glaçon devient de l’eau liquide, c’est…", ["la fusion", "la solidification", "la condensation"], "la fusion", "La fusion fait passer de solide à liquide."], ["choix", "Quand l’eau devient de la glace, c’est…", ["la solidification", "la fusion", "l’évaporation"], "la solidification", "L’eau passe de l’état liquide à l’état solide."], ["choix", "Quand l’eau liquide se transforme en vapeur d’eau, c’est…", ["l’évaporation", "la solidification", "la fusion"], "l’évaporation", "L’évaporation correspond au passage de liquide à gazeux."], ["choix", "Quand la vapeur d’eau forme des gouttes sur une vitre froide, c’est…", ["la condensation", "la fusion", "la solidification"], "la condensation", "La condensation transforme la vapeur d’eau en eau liquide."], ["ordre", "Remets ces étapes dans l’ordre pour faire puis faire fondre un glaçon.", [["1", "Eau liquide"], ["2", "Au congélateur : la glace se forme"], ["3", "On sort le glaçon"], ["4", "Le glaçon fond"]], null, "On congèle d’abord l’eau, puis la glace peut fondre."], ["vrai", "L’évaporation peut se produire sans faire bouillir l’eau.", null, "Vrai", "Une flaque peut s’évaporer à température ambiante."], ["classe", "Classe chaque changement d’état.", [["🧊→💧", "Un glaçon fond", "Fusion"], ["💧→🧊", "L’eau gèle", "Solidification"], ["💧→♨️", "Une flaque sèche", "Évaporation"], ["♨️→💧", "De la buée apparaît sur un miroir froid", "Condensation"]], null, "Fusion, solidification, évaporation et condensation sont les quatre changements étudiés."], ["choix", "Que faut-il généralement faire pour transformer de la glace en eau liquide ?", ["la réchauffer", "la refroidir", "la cacher"], "la réchauffer", "La glace fond lorsqu’elle reçoit de la chaleur."], ["vrai", "La buée visible est de la vapeur d’eau gazeuse.", null, "Faux", "La buée est formée de petites gouttelettes d’eau liquide."], ["choix", "Que devient l’eau liquide d’un bac à glaçons dans le congélateur ?", ["de la glace", "de la vapeur invisible", "de la pluie"], "de la glace", "Elle se solidifie en refroidissant."]];let at=0,correct=0,selection=null;const $=id=>document.getElementById(id), area=$('area'),btnCheck=$('check'),btnNext=$('next'),fb=$('feedback');
function button(label,cls,handler){const b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls||'';b.onclick=handler;return b;}
function render(){const q=Q[at];selection=null;$('count').textContent=`Question ${at+1} / ${Q.length}`;$('question').textContent=q[1];$('fill').style.width=`${correct*100/Q.length}%`;fb.textContent='';fb.className='feedback';btnNext.classList.add('is-hidden');btnCheck.disabled=false;area.replaceChildren();if(q[0]==='choix'||q[0]==='vrai'){const opts=q[0]==='vrai'?['Vrai','Faux']:q[2];const wrapper=document.createElement('div');wrapper.className='answers';for(const x of opts){wrapper.append(button(x,'',()=>{selection=x;wrapper.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.textContent===x));}));}area.append(wrapper);}
else if(q[0]==='classe'){const tiles=q[2];const bank=document.createElement('div');bank.className='bank';bank.innerHTML='<b>Images à classer : sélectionne une image puis sa colonne.</b>';const cols=document.createElement('div');cols.className='columns';const cats=[...new Set(tiles.map(t=>t[2]))];let chosen=null;const placed=new Map();for(const t of tiles){const tile=button('', 'tile',()=>{chosen=t[1];area.querySelectorAll('.tile').forEach(x=>x.classList.toggle('selected',x===tile));});tile.append(Object.assign(document.createElement('span'),{textContent:t[0]}),document.createTextNode(t[1]));tile.dataset.name=t[1];bank.append(tile);}for(const cat of cats){const col=document.createElement('div');col.className='column';col.append(Object.assign(document.createElement('h3'),{textContent:cat}));col.append(button('Placer ici','',()=>{if(!chosen)return;placed.set(chosen,cat);const tilesAll=area.querySelectorAll('.tile');tilesAll.forEach(x=>{if(x.dataset.name===chosen){col.append(x);x.classList.remove('selected');}});chosen=null;}));cols.append(col);}area.append(bank,cols);selection=()=>({placed,tiles});}
else if(q[0]==='ordre'){const items=q[2],bank=document.createElement('div'),result=document.createElement('div');bank.className='bank';result.className='ordering';const answer=[];bank.append(Object.assign(document.createElement('b'),{textContent:'Clique les étapes dans le bon ordre : '}));for(const item of [...items].reverse()){const tile=button(item[1],'',()=>{if(answer.includes(item[0]))return;answer.push(item[0]);result.append(tile);});bank.append(tile);}area.append(bank,Object.assign(document.createElement('p'),{textContent:'Ton ordre :'}),result,button('Effacer ma réponse','',()=>{answer.length=0;render();}));selection=()=>answer;}}
function verify(){const q=Q[at];let ok=false;if(q[0]==='choix'||q[0]==='vrai')ok=selection===q[3];if(q[0]==='classe'&&typeof selection==='function'){const {placed,tiles}=selection();ok=placed.size===tiles.length&&tiles.every(t=>placed.get(t[1])===t[2]);}if(q[0]==='ordre'&&typeof selection==='function'){const submitted=selection();ok=submitted.length===q[2].length&&submitted.every((id,i)=>id===q[2][i][0]);}if(ok){correct++;$('fill').style.width=`${correct*100/Q.length}%`;fb.textContent='Bravo ! '+q[4];fb.className='feedback good';btnCheck.disabled=true;btnNext.textContent=at===Q.length-1?'Terminer la leçon':'Question suivante →';btnNext.classList.remove('is-hidden');}else{fb.textContent='Réessaie. Indice : '+q[4];fb.className='feedback bad';}}
btnCheck.onclick=verify;btnNext.onclick=()=>{at++;if(at===Q.length){$('work').classList.add('is-hidden');$('finish').style.display='block';return;}render();};$('done').onclick=()=>{$('done').disabled=true;$('done').textContent='✓ Leçon terminée';};render();})();</script></body></html>
