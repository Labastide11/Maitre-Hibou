<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les trois états de l’eau — Maître Hibou CE2</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#173657;background:#ecf4fd}*{box-sizing:border-box}body{margin:0}main{width:100%;max-width:1600px;margin:auto;padding:clamp(9px,1.8vw,22px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0 15px;font-size:clamp(13px,1.3vw,16px)}header a{color:#165b97;font-weight:800;text-decoration:none}.poster{display:block;width:100%;height:auto;border-radius:13px;box-shadow:0 3px 18px #1c3b6020}.app{margin:22px auto 40px;padding:clamp(16px,3vw,34px);background:white;border-radius:24px;box-shadow:0 8px 32px #1c3b6020;max-width:1150px}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:9px;align-items:center}.top h1{font-size:clamp(23px,3vw,34px);margin:0}.sub{margin:8px 0 16px;color:#536b80;font-size:16px}.count{font-weight:800;color:#175a84}.progress{height:12px;background:#e1eaf6;border-radius:20px;overflow:hidden;margin:12px 0 23px}.progress div{height:100%;background:#23a479;transition:width .2s}h2{font-size:clamp(21px,2.6vw,29px);margin:0 0 7px}.prompt{font-size:clamp(17px,1.9vw,21px);line-height:1.5;margin:8px 0 19px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}.choice,.action,.chip{font:700 17px system-ui;min-height:52px;padding:12px 17px;border-radius:14px;border:2px solid #cadced;background:#eaf3ff;color:#163d64;cursor:pointer;text-align:left}.choice[aria-pressed="true"],.chip[aria-pressed="true"]{background:#d1f3e7;border-color:#159c7e}.choice:focus-visible,.action:focus-visible,.chip:focus-visible{outline:3px solid #f1ae27;outline-offset:2px}.choice:disabled,.chip:disabled{cursor:default;opacity:.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.action{background:#0868a1;color:#fff;text-align:center;border-color:#0868a1}.action.secondary{background:#f0f5fa;border-color:#d7e3ed;color:#174567}.action:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:26px;margin-top:17px;padding:11px 14px;border-radius:12px;font-size:17px;line-height:1.45;font-weight:650}.feedback:empty{display:none}.feedback.good{background:#e0f7e9;color:#125d3a}.feedback.bad{background:#fff1df;color:#854c13}.hidden{display:none!important}.sim{max-width:660px;margin:9px auto 20px;padding:18px 15px;background:#f1f8fe;border:2px solid #d9e9f8;border-radius:20px}.sim svg{width:100%;max-height:220px;display:block}.statebar{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px}.chip{flex:1 1 145px;text-align:center;font-size:15px}.observation{font-size:17px;text-align:center;margin:13px 0 0}.tags{display:flex;gap:10px;flex-wrap:wrap}.tag{padding:10px 14px;border:1px solid #c9dbea;background:#f1f7fd;border-radius:12px}.slots{display:grid;gap:8px;margin:12px 0}.slot{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #cddfea;border-radius:12px;padding:9px 12px}.slot button{padding:10px;min-height:43px;cursor:pointer;border:1px solid #bdd5eb;border-radius:9px;background:#f6fafe;color:#164c7a;font-weight:700}.input{width:min(100%,450px);padding:15px;border:2px solid #b4cce3;border-radius:12px;font-size:20px}.summary{font-size:20px;line-height:1.6}.small{color:#5d7185;font-size:14px}@media(max-width:500px){.app{border-radius:16px}.choice,.action{width:100%}.slot{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header><img class="poster" src="../../images-lecons/sciences/maitre-hibou-trois-etats-eau.png" alt="Leçon illustrée : Les trois états de l’eau, solide, liquide et gazeux"><section class="app" aria-label="Exercices interactifs"><div class="top"><h1>Je m’entraîne avec Maître Hibou</h1><span class="count" id="counter">Exercice 1 / 10</span></div><p class="sub">J’observe, je manipule, puis je relève des défis de plus en plus difficiles.</p><div class="progress" aria-label="Progression"><div id="bar"></div></div><h2 id="title"></h2><p class="prompt" id="prompt"></p><div id="work"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="action" id="check">Vérifier</button><button class="action hidden" id="next">Exercice suivant →</button><button class="action secondary" id="restart">Recommencer</button></div><p class="small">Tu peux réessayer : une erreur aide à apprendre !</p></section></main>
<script>
(()=>{'use strict';
const exercises=[
{kind:'sim',title:'Je manipule les trois états',prompt:'Choisis « glace », « eau liquide » puis « vapeur d’eau ». Observe les particules et les changements. Visite les trois états avant de vérifier.',hint:'Utilise les trois boutons sous le dessin.'},
{kind:'single',title:'J’observe la glace',prompt:'Un glaçon posé sur une table garde sa forme. Dans quel état est l’eau ?',options:['Solide','Liquide','Gazeux'],answer:0,hint:'La glace est dure et garde sa forme.'},
{kind:'single',title:'J’observe l’eau dans un verre',prompt:'Tu verses de l’eau dans un verre. Quelle phrase est juste ?',options:['Elle garde toujours la forme d’un cube.','Elle prend la forme du verre.','Elle disparaît immédiatement.'],answer:1,hint:'Regarde l’eau liquide sur ta leçon.'},
{kind:'single',title:'Je cherche ce qui est invisible',prompt:'Quelle phrase est correcte au sujet de la vapeur d’eau ?',options:['La vraie vapeur d’eau est invisible.','La vapeur d’eau est toujours un nuage blanc.','La vapeur d’eau est un morceau de glace.'],answer:0,hint:'La vapeur d’eau gazeuse est invisible. Le nuage blanc au-dessus d’une casserole est formé de minuscules gouttelettes d’eau.'},
{kind:'order',title:'Je remets dans l’ordre',prompt:'On sort un glaçon du congélateur, puis on le laisse fondre. Choisis les deux étapes dans l’ordre.',items:['L’eau devient liquide.','Au départ, l’eau est solide.'],answer:[1,0],hint:'Commence par le glaçon avant qu’il fonde.'},
{kind:'match',title:'J’associe les exemples',prompt:'Choisis l’état de l’eau correspondant à chaque exemple.',items:['Un glaçon','La pluie','La vapeur d’eau invisible'],options:['Liquide','Gazeux','Solide'],answer:[2,0,1],hint:'Le glaçon est dur ; la pluie s’écoule ; la vapeur d’eau est un gaz.'},
{kind:'single',title:'Je comprends la forme de l’eau',prompt:'On verse la même eau liquide dans une assiette, puis dans une bouteille. Que se passe-t-il ?',options:['Elle prend la forme des deux récipients.','Elle devient solide dans la bouteille.','Elle garde la forme du verre précédent.'],answer:0,hint:'L’eau liquide n’a pas de forme propre.'},
{kind:'multi',title:'Je reconnais l’eau solide',prompt:'Choisis TOUS les exemples d’eau solide.',options:['La neige','Une rivière','Les glaçons','La gelée blanche sur une plante'],answer:[0,2,3],hint:'Cherche les exemples froids où l’eau est sous forme de glace.'},
{kind:'fill',title:'Je complète la leçon',prompt:'Complète avec UN mot : « L’eau liquide s’________ et prend la forme du récipient. »',answer:['écoule','ecoule','s’écoule','s\'ecoule'],hint:'Le mot se trouve dans la partie « Je retiens ».'},
{kind:'match',title:'Défi Maître Hibou',prompt:'Tu expliques les trois états à un camarade. Associe chaque observation à la bonne explication.',items:['L’eau prend la forme du verre.','Un glaçon conserve sa forme.','La vapeur d’eau se mélange à l’air.'],options:['État gazeux','État solide','État liquide'],answer:[2,1,0],hint:'Solide : forme propre. Liquide : s’écoule. Gaz : se mélange à l’air.'}
];
let index=0,completed=new Set(),tries=0,selected=null,visited=new Set(),state='solide',order=[],pair={},checked=false;
const $=id=>document.getElementById(id),work=$('work'),feedback=$('feedback');
function button(label,cls='choice'){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;return b}
function selectionButtons(options,multiple){const wrap=document.createElement('div');wrap.className='answers';options.forEach((s,i)=>{let b=button(s);b.setAttribute('aria-pressed','false');b.onclick=()=>{if(checked)return;if(multiple){if(!Array.isArray(selected))selected=[];selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]}else selected=i;Array.from(wrap.children).forEach((x,k)=>x.setAttribute('aria-pressed',String(multiple?selected.includes(k):selected===k)))};wrap.appendChild(b)});work.appendChild(wrap)}
function makeSim(){const wrap=document.createElement('div');wrap.className='sim';wrap.innerHTML='<svg viewBox="0 0 340 185" role="img" aria-label="Représentation simplifiée des états de l’eau"><path d="M76 38 V163 H264 V38" fill="none" stroke="#547d9c" stroke-width="6" stroke-linecap="round"/><g id="particles"></g></svg><div class="statebar" id="states"></div><p class="observation" id="observation"></p>';work.appendChild(wrap);const container=wrap.querySelector('#particles'),bar=wrap.querySelector('#states'),obs=wrap.querySelector('#observation');function draw(){container.innerHTML='';for(let i=0;i<28;i++){let x,y;if(state==='solide'){x=110+(i%7)*19;y=82+Math.floor(i/7)*19}else if(state==='liquide'){x=95+(i*43%145);y=94+(i*29%63)}else{x=88+(i*61%163);y=18+(i*37%139)}const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','5');c.setAttribute('fill',state==='solide'?'#68a9ed':state==='liquide'?'#268dd6':'#b27ace');container.appendChild(c)}obs.textContent=state==='solide'?'Les particules sont proches et organisées : la glace garde sa forme.':state==='liquide'?'Les particules restent proches et peuvent se déplacer : l’eau s’écoule.':'Les particules sont très espacées : la vapeur d’eau invisible se mélange à l’air.';Array.from(bar.children).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)))}[['solide','1. Glace'],['liquide','2. Eau liquide'],['gazeux','3. Vapeur d’eau']].forEach(([id,label])=>{let b=button(label,'chip');b.dataset.state=id;b.onclick=()=>{if(checked)return;state=id;visited.add(id);draw()};bar.appendChild(b)});visited.add('solide');draw()}
function makeOrder(t){const wrap=document.createElement('div');wrap.className='slots';const note=document.createElement('p');note.className='small';note.textContent='Touche les phrases dans le bon ordre.';work.append(note,wrap);function update(){wrap.innerHTML='';t.items.forEach((v,i)=>{const row=document.createElement('div');row.className='slot';row.textContent=v;const b=button(order.includes(i)?'Annuler':`Choisir ${order.length+1}`,'chip');b.disabled=checked||(!order.includes(i)&&order.length>=t.items.length);b.onclick=()=>{order=order.includes(i)?order.filter(n=>n!==i):[...order,i];update()};const orderLabel=document.createElement('strong');orderLabel.textContent=order.includes(i)?`${order.indexOf(i)+1}.`:'—';row.prepend(orderLabel);row.appendChild(b);wrap.appendChild(row)})}update()}
function makeMatch(t){const wrap=document.createElement('div');wrap.className='slots';t.items.forEach((v,i)=>{let row=document.createElement('label');row.className='slot';const name=document.createElement('strong');name.textContent=v;const sel=document.createElement('select');sel.className='input';sel.style.fontSize='16px';sel.style.padding='9px';sel.setAttribute('aria-label','État correspondant à '+v);sel.innerHTML='<option value="">Choisir un état…</option>'+t.options.map((o,k)=>`<option value="${k}">${o}</option>`).join('');sel.onchange=()=>pair[i]=sel.value===''?undefined:Number(sel.value);row.append(name,sel);wrap.appendChild(row)});work.appendChild(wrap)}
function show(){const t=exercises[index];tries=0;selected=null;visited=new Set();state='solide';order=[];pair={};checked=false;feedback.textContent='';feedback.className='feedback';$('counter').textContent=`Exercice ${index+1} / ${exercises.length}`;$('bar').style.width=`${completed.size*10}%`;$('title').textContent=t.title;$('prompt').textContent=t.prompt;work.replaceChildren();$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').textContent=index===9?'Voir mon bilan →':'Exercice suivant →';if(t.kind==='sim')makeSim();else if(t.kind==='single'||t.kind==='multi')selectionButtons(t.options,t.kind==='multi');else if(t.kind==='order')makeOrder(t);else if(t.kind==='match')makeMatch(t);else if(t.kind==='fill'){const a=document.createElement('input');a.className='input';a.placeholder='Écris le mot…';a.autocomplete='off';a.setAttribute('aria-label','Mot à compléter');a.addEventListener('input',()=>selected=a.value);work.appendChild(a)}}
function check(){if(checked)return;const t=exercises[index];let ready=false,correct=false;if(t.kind==='sim'){ready=visited.size===3;correct=ready}else if(t.kind==='single'){ready=selected!==null;correct=selected===t.answer}else if(t.kind==='multi'){ready=Array.isArray(selected)&&selected.length>0;correct=ready&&selected.length===t.answer.length&&selected.every(x=>t.answer.includes(x))}else if(t.kind==='order'){ready=order.length===t.items.length;correct=ready&&order.every((n,i)=>n===t.answer[i])}else if(t.kind==='match'){ready=Object.values(pair).filter(x=>x!==undefined).length===t.items.length;correct=ready&&t.answer.every((n,i)=>pair[i]===n)}else if(t.kind==='fill'){ready=!!String(selected||'').trim();correct=ready&&t.answer.includes(String(selected).trim().toLowerCase())}if(!ready){feedback.textContent='Termine d’abord ton activité, puis vérifie.';feedback.className='feedback bad';return}if(!correct){tries++;feedback.textContent=(tries===1?'Essaie encore ! Indice : ':'Regarde bien la leçon. ')+t.hint;feedback.className='feedback bad';return}checked=true;completed.add(index);$('bar').style.width=`${completed.size*10}%`;feedback.textContent=tries?'Bravo, tu as trouvé en cherchant !':'Bravo, belle réussite !';feedback.className='feedback good';$('check').classList.add('hidden');$('next').classList.remove('hidden');work.querySelectorAll('button,select,input').forEach(x=>x.disabled=true)}
function finish(){const a=$('title');a.textContent='Bravo, explorateur de sciences !';$('prompt').textContent='Tu as terminé les 10 exercices sur les trois états de l’eau.';work.innerHTML='<p class="summary">Tu sais reconnaître l’eau <strong>solide</strong>, <strong>liquide</strong> et <strong>gazeuse</strong>, et expliquer ce qui les distingue.</p><p>Souviens-toi : la vapeur d’eau est invisible. Le « nuage blanc » près d’une casserole contient de minuscules gouttelettes d’eau liquide.</p>';$('counter').textContent='10 / 10 terminés';$('bar').style.width='100%';feedback.textContent='';$('check').classList.add('hidden');$('next').classList.add('hidden')}
$('check').onclick=check;$('next').onclick=()=>{if(index===9){finish();return}index++;show()};$('restart').onclick=()=>{index=0;completed.clear();show()};show();
})();
</script></body></html>
