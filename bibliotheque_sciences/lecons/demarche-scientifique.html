<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La démarche scientifique — Maître Hibou Sciences CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf4fc;color:#173553;font:18px system-ui,Arial,sans-serif}main{width:100%;padding:clamp(8px,1.2vw,18px)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;gap:14px}header a{color:#134d84;text-decoration:none;font-weight:800}.lesson-image{width:100%;height:auto;max-width:100%;display:block;border-radius:12px}.quiz{width:100%;padding:clamp(15px,2vw,28px);background:#fff;border-radius:18px;margin:15px 0 32px;box-shadow:0 3px 15px #19365320}h1{font-size:clamp(22px,2.3vw,33px);margin:0 0 8px}.bar{height:13px;background:#dceaf4;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#4eac74;transition:width .2s}.question{font-size:clamp(21px,2.5vw,30px);font-weight:800;margin:14px 0 18px}.answers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}button{cursor:pointer;border:0;border-radius:13px;padding:13px 17px;font:700 18px system-ui,Arial;min-height:50px}button:focus-visible{outline:3px solid #e5a21c;outline-offset:2px}.choice{background:#e8f3ff;color:#173553;border:2px solid #bdd7ee;text-align:left}.choice:disabled{cursor:default}.choice.wrong{background:#ffe5e5;border-color:#d37770}.choice.right{background:#d5f5df;border-color:#4eaa71}#next,#done{margin-top:15px;background:#148355;color:#fff}#restart{margin-top:15px;background:#edf1f5}#feedback{min-height:30px;font-weight:750;margin:14px 0 0}#feedback.error{color:#a73627}#feedback.success{color:#167848}.hidden{display:none!important}.note{color:#526d86;font-size:16px}.final{font-size:21px;font-weight:800;color:#167848}</style></head><body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header><img class="lesson-image" src="../../images-lecons/sciences/maitre-hibou-demarche-scientifique.png" alt="Affiche illustrée : La démarche scientifique"><section class="quiz"><h1>À toi d’expérimenter !</h1><p class="note">Réponds à 10 questions. Une bonne réponse est nécessaire pour passer à la suivante.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="counter"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="hidden">Question suivante →</button><button id="done" class="hidden">J’ai compris cette leçon ✓</button><button id="restart" class="hidden">Recommencer</button><p id="result" class="final"></p></section></main><script>const tasks=[{"q": "Quelle est la première étape d’une recherche scientifique ?", "choices": ["Faire une conclusion", "Poser une question", "Ranger le matériel"], "a": "Poser une question", "hint": "On cherche d’abord ce qu’on veut comprendre."}, {"q": "Une hypothèse, c’est…", "choices": ["Une réponse possible à vérifier", "Une réponse toujours vraie", "Un dessin décoratif"], "a": "Une réponse possible à vérifier", "hint": "On imagine ce qui pourrait se passer."}, {"q": "Que fait-on pour vérifier une hypothèse ?", "choices": ["On devine", "On expérimente", "On copie"], "a": "On expérimente", "hint": "On réalise une expérience."}, {"q": "Après une expérience, que doit-on faire ?", "choices": ["Observer le résultat", "Changer la question", "Tout oublier"], "a": "Observer le résultat", "hint": "Je regarde ce qui s’est réellement passé."}, {"q": "Quelle phrase est une observation ?", "choices": ["L’huile reste au-dessus de l’eau.", "Je crois que l’huile va disparaître.", "J’espère qu’elle se mélange."], "a": "L’huile reste au-dessus de l’eau.", "hint": "Une observation décrit ce que l’on voit."}, {"q": "Dans quel ordre réalise-t-on la démarche ?", "choices": ["Question → hypothèse → expérience → observation → conclusion", "Conclusion → question → expérience", "Expérience → conclusion → hypothèse"], "a": "Question → hypothèse → expérience → observation → conclusion", "hint": "Commence par la question."}, {"q": "Si mon hypothèse est fausse, que dois-je faire ?", "choices": ["Cacher le résultat", "Observer et expliquer ce qui s’est passé", "Dire que j’avais raison"], "a": "Observer et expliquer ce qui s’est passé", "hint": "Une expérience permet d’apprendre, même si on s’est trompé."}, {"q": "Quel matériel peut aider à observer ?", "choices": ["Une loupe", "Une gomme", "Une règle de grammaire"], "a": "Une loupe", "hint": "Il sert à regarder un objet de plus près."}, {"q": "L’eau et l’huile se séparent : c’est…", "choices": ["Une observation", "Une hypothèse", "Une question"], "a": "Une observation", "hint": "C’est ce qu’on constate après l’expérience."}, {"q": "Une conclusion doit s’appuyer sur…", "choices": ["Les résultats observés", "Une idée inventée", "Le hasard"], "a": "Les résultats observés", "hint": "Je conclus avec ce que l’expérience a montré."}];let index=0,correct=0;const el=id=>document.getElementById(id);function show(){const t=tasks[index];el('counter').textContent=`Question ${index+1} sur ${tasks.length}`;el('question').textContent=t.q;el('feedback').textContent='';el('feedback').className='';el('next').classList.add('hidden');el('done').classList.add('hidden');el('restart').classList.add('hidden');el('answers').innerHTML='';t.choices.forEach(value=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.onclick=()=>choose(value,b);el('answers').appendChild(b);});el('fill').style.width=`${correct*100/tasks.length}%`;}function choose(value,b){if(value!==tasks[index].a){b.disabled=true;b.classList.add('wrong');el('feedback').className='error';el('feedback').textContent='Essaie encore ! Indice : '+tasks[index].hint;return;}correct++;el('fill').style.width=`${correct*100/tasks.length}%`;b.classList.add('right');for(const btn of el('answers').children)btn.disabled=true;el('feedback').className='success';el('feedback').textContent='Bravo ! Bonne réponse.';if(index===tasks.length-1){el('done').classList.remove('hidden');el('restart').classList.remove('hidden');}else el('next').classList.remove('hidden');}el('next').onclick=()=>{if(correct!==index+1)return;index++;show();};el('restart').onclick=()=>{index=0;correct=0;el('result').textContent='';show();};el('done').onclick=()=>{if(correct!==tasks.length)return;el('result').textContent='Bravo ! Tu as compris cette leçon.';el('done').disabled=true;el('done').textContent='Leçon terminée ✓';};show();</script></body></html>
