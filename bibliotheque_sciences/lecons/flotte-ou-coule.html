<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flotte ou coule ? — Sciences CE2 • Maître Hibou</title>
<style>
:root{--blue:#123c70;--teal:#008f97;--soft:#eef7fd;--ink:#173553;--good:#136f46;--bad:#a64125}*{box-sizing:border-box}body{margin:0;background:#eaf3fa;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:17px}main{width:100%;max-width:1660px;margin:auto;padding:clamp(8px,1.5vw,20px)}header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 2px 14px;font-size:15px}header a{color:#145787;font-weight:800;text-decoration:none}.lesson{display:block;width:100%;border-radius:14px;height:auto}.activity{margin-top:18px;background:white;border:1px solid #d4e7f3;border-radius:21px;padding:clamp(15px,2.5vw,29px);box-shadow:0 6px 18px #12304b13}h1{font-size:clamp(25px,3vw,36px);margin:0 0 7px;color:#103c69}.sub{color:#536e84;font-size:15px;margin:0 0 20px}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:15px}.progress{height:12px;background:#e4edf5;border-radius:30px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:#1c9f87;transition:width .2s;width:0}.prompt{font-weight:850;font-size:clamp(21px,2.5vw,29px);margin:8px 0 17px}.hint-text{font-size:15px;color:#5d7184}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}.choice,.object,.action{min-height:52px;padding:13px 16px;border-radius:13px;border:2px solid #c9ddeb;background:#f1f8fd;text-align:left;font-size:17px;font-weight:750;color:#153b60;cursor:pointer;touch-action:manipulation}.choice:hover,.object:hover{border-color:#159eaa}.choice:focus-visible,.object:focus-visible,button:focus-visible{outline:3px solid #e9aa31;outline-offset:2px}.choice.selected,.object.selected{background:#d7f9f6;border-color:#00949a}.choice:disabled,.object:disabled{cursor:default}.action{background:#086a82;border-color:#086a82;color:white;text-align:center}.action:disabled{background:#ccd9e0;border-color:#ccd9e0;color:#4c6473;cursor:not-allowed}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{margin-top:14px;min-height:0;font-size:16px;font-weight:700}.feedback.success{color:var(--good)}.feedback.error{color:var(--bad)}.feedback.info{color:#1b627f}.muted{color:#61778c}.badge{display:inline-block;background:#e5f6f2;color:#176e5b;padding:5px 12px;border-radius:30px;font-size:13px;font-weight:900}.experiment{background:#eff9fe;border:1px solid #d4e9f4;border-radius:18px;padding:12px;margin-bottom:16px}.scene{width:100%;max-width:540px;margin:auto;display:block;touch-action:manipulation}.object-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.object{display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;font-size:14px;gap:5px;padding:8px}.object .symbol{font-size:30px}.object[aria-pressed=true]{outline:3px solid #0f9ca3;background:#dff8f6}.group-label{font-size:14px;font-weight:850;margin-top:11px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:22px;padding:9px 14px;background:#e8eff9;border:1px solid #c1d4e8;color:#143b61;cursor:pointer;font-weight:800}.chip.active{background:#d8f8f2;border:2px solid #178c81;padding:8px 13px}.small{font-size:14px;color:#526c82}.arrange{display:flex;flex-wrap:wrap;gap:10px}.arrange button{background:#edf5fe;border:2px solid #c8ddef;border-radius:12px;padding:13px 16px;font-size:16px;color:#153d68;font-weight:750;min-height:50px;cursor:pointer}.sequence{background:#edf8f5;border-radius:10px;padding:12px;margin:10px 0;min-height:44px}.result{background:#ecf8f3;border-radius:18px;padding:20px;text-align:center;margin:8px auto;max-width:640px}.result strong{font-size:25px}.hidden{display:none!important}@media(max-width:620px){.object-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.activity{border-radius:14px}.choice{font-size:16px}}
</style></head><body><main>
<header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header>
<img class="lesson" src="../../images-lecons/sciences/maitre-hibou-flotte-ou-coule.png" alt="Leçon illustrée Flotte ou coule ? : observation des objets qui restent à la surface de l’eau ou tombent au fond, influence de la matière et de la forme.">
<section class="activity" aria-label="Exercices interactifs"><h1>Je m'entraîne : flotte ou coule ?</h1><p class="sub">Observe, manipule, fais des essais puis relève le défi Maître Hibou. Une activité à la fois.</p>
<div class="meta"><span id="counter">Exercice 1 sur 10</span><span id="stars" class="badge">★ Découverte</span></div><div class="progress"><div id="bar"></div></div><div class="prompt" id="question"></div><div id="work"></div><div id="feedback" class="feedback" aria-live="polite" role="status"></div><div class="nav"><button class="action hidden" id="check">Vérifier ma réponse</button><button class="action hidden" id="next">Exercice suivant →</button><button class="action hidden" id="restart">Recommencer les 10 exercices</button></div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let step=0,done=false,attempts=0,selection=null,expObject=null,expTested=new Set(),expPredictions={},sequence=[],classAnswers={},assoc={},challAnswers={};
const items=[{id:'bois',label:'Morceau de bois',symbol:'🪵',float:true},{id:'pierre',label:'Pierre',symbol:'🪨',float:false},{id:'liege',label:'Bouchon de liège',symbol:'🟤',float:true},{id:'ecrou',label:'Écrou métallique',symbol:'🔩',float:false},{id:'plume',label:'Plume',symbol:'🪶',float:true},{id:'verre',label:'Bille en verre',symbol:'🔵',float:false}];
const titles=['Je fais une expérience','J’observe ce qui flotte','J’observe ce qui coule','Vrai ou faux ?','Je remets les étapes en ordre','J’associe les observations','La forme peut tout changer','Je classe quatre objets','Je réfléchis comme un scientifique','Le défi de Maître Hibou'];
const q=['Choisis un objet, prévois ce qu’il fera, puis teste-le dans l’eau.','Quel objet reste à la surface de l’eau ?','Quel objet tombe au fond de l’eau ?','Un objet qui flotte reste à la surface de l’eau.','Dans quel ordre réalise-t-on une expérience ?','Choisis l’explication qui convient pour chaque observation.','Une boule de pâte à modeler peut couler. La même pâte en forme de petit bateau peut flotter. Pourquoi ?','Classe les objets selon ce qui se passe dans notre expérience.','Peut-on connaître à coup sûr le résultat en regardant seulement la couleur d’un objet ?','Tu as une pierre, un bouchon de liège et une clé en métal. Que prévois-tu ?'];
function el(tag,props={},text){const n=document.createElement(tag);Object.entries(props).forEach(([k,v])=>{if(k==='class')n.className=v;else if(k==='onclick')n.addEventListener('click',v);else n.setAttribute(k,v)});if(text!=null)n.textContent=text;return n}
function feedback(msg,type='info'){$('feedback').textContent=msg;$('feedback').className='feedback '+type}
function render(){done=false;attempts=0;selection=null;sequence=[];assoc={};classAnswers={};challAnswers={};expObject=null;expTested=new Set();expPredictions={};$('work').replaceChildren();$('counter').textContent=`Exercice ${step+1} sur 10`;$('stars').textContent=step<3?'★ Découverte':step<7?'★★ Je comprends':'★★★ Défi';$('bar').style.width=`${step*10}%`;$('question').textContent=q[step];feedback('');$('check').classList.add('hidden');$('next').classList.add('hidden');$('restart').classList.add('hidden');if(step===0)renderExperiment();else if([1,2,3,6,8].includes(step))renderChoice();else if(step===4)renderOrder();else if(step===5)renderAssociations();else if(step===7)renderClassification();else if(step===9)renderChallenge()}
function success(text){if(done)return;done=true;feedback('Bravo ! '+text,'success');$('bar').style.width=`${(step+1)*10}%`;$('check').classList.add('hidden');if(step<9){$('next').textContent='Exercice suivant →';$('next').classList.remove('hidden')}else{showFinal()}}
function error(hint){attempts++;feedback('Essaie encore. Indice : '+hint,'error')}
function options(values,checkFn){let a=el('div',{class:'answers'});values.forEach(v=>{let b=el('button',{class:'choice',type:'button',onclick:()=>{if(done)return;a.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selection=v.value;$('check').classList.remove('hidden');feedback('')}},v.label);a.appendChild(b)});$('work').appendChild(a);$('check').onclick=()=>{if(done)return;checkFn(selection)};}
function renderChoice(){const configs={1:{values:['Une plume','Une pierre','Une clé en métal'],answer:'Une plume',hint:'Elle est légère et reste à la surface dans notre expérience.'},2:{values:['Un bouchon de liège','Une pierre','Un morceau de bois'],answer:'Une pierre',hint:'Cet objet tombe au fond du récipient.'},3:{values:['Vrai','Faux'],answer:'Vrai',hint:'Flotter signifie rester à la surface.'},6:{values:['Parce que la forme change la manière dont l’objet déplace l’eau','Parce que la pâte devient du bois','Parce que l’eau disparaît'],answer:'Parce que la forme change la manière dont l’objet déplace l’eau',hint:'La matière est la même dans les deux cas ; sa forme change.'},8:{values:['Oui, toujours','Non, il faut expérimenter','Oui, si l’objet est bleu'],answer:'Non, il faut expérimenter',hint:'La couleur ne suffit pas pour savoir si un objet flotte.'}};let c=configs[step];options(c.values.map(x=>({label:x,value:x})),v=>v===c.answer?success(step===6?'La forme d’un objet peut modifier sa capacité à flotter.':'Tu as bien observé.'):error(c.hint))}
function renderExperiment(){const w=$('work');const instr=el('p',{class:'small'},'Teste au moins trois objets : le bois, la pierre et le liège. L’embout du récipient reste immobile : c’est l’objet qui entre dans l’eau.');w.appendChild(instr);let scene=el('div',{class:'experiment'}),svgNS='http://www.w3.org/2000/svg';scene.innerHTML=`<svg class="scene" viewBox="0 0 520 250" role="img" aria-label="Bac transparent contenant de l’eau. L’objet sélectionné entre dans le bac lorsque l’élève lance l’essai."><defs><linearGradient id="aqua" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#76d7ef" stop-opacity=".4"/><stop offset="1" stop-color="#2c9fd4" stop-opacity=".62"/></linearGradient></defs><path d="M86 46 V222 Q86 230 98 230 H421 Q433 230 433 218 V46" fill="#ffffff" fill-opacity=".24" stroke="#789aab" stroke-width="6"/><path d="M92 108 Q260 100 428 108 V221 Q428 224 419 224 H99 Q92 224 92 220Z" fill="url(#aqua)"/><path d="M93 108 Q260 97 428 108" stroke="#0e8bbc" stroke-width="4" fill="none"/><g id="water-object" visibility="hidden" transform="translate(260 45)"><circle r="22" fill="#e8bb7c" stroke="#816247" stroke-width="3"/></g><text x="260" y="247" text-anchor="middle" font-size="15" fill="#365970">Bac d’eau</text></svg>`;w.appendChild(scene);const grid=el('div',{class:'object-grid'});[items[0],items[1],items[2]].forEach(it=>{let b=el('button',{class:'object',type:'button','aria-pressed':'false',onclick:()=>{expObject=it;predicted=null;predictWrap.querySelectorAll('button').forEach(n=>n.classList.remove('active'));grid.querySelectorAll('button').forEach(z=>z.setAttribute('aria-pressed',String(z===b)));$('#water-object').removeAttribute('visibility');$('#water-object').innerHTML=svgSymbol(it);$('#water-object').setAttribute('transform','translate(260 45)');predStatus.textContent=`À ton avis, ${it.label.toLowerCase()} : flotte ou coule ?`;predStatus.classList.remove('hidden');predictWrap.classList.remove('hidden');testBtn.classList.remove('hidden');testBtn.disabled=true;feedback('');}},null);b.appendChild(el('span',{class:'symbol'},it.symbol));b.appendChild(document.createTextNode(it.label));grid.appendChild(b)});w.appendChild(grid);const predStatus=el('p',{class:'group-label hidden'},'');w.appendChild(predStatus);const predictWrap=el('div',{class:'chips hidden'});const testBtn=el('button',{class:'action hidden',type:'button'},'Je teste dans l’eau');let predicted=null;['Il flotte','Il coule'].forEach((label,i)=>{let b=el('button',{class:'chip',type:'button',onclick:()=>{predicted=i===0;predictWrap.querySelectorAll('button').forEach(n=>n.classList.remove('active'));b.classList.add('active');testBtn.disabled=false}},label);predictWrap.appendChild(b)});w.appendChild(predictWrap);w.appendChild(el('div',{class:'nav'}));w.lastChild.appendChild(testBtn);let testedLabel=el('p',{class:'small'},'Objets testés : 0 / 3');w.appendChild(testedLabel);testBtn.onclick=()=>{if(!expObject||predicted===null||done)return;const it=expObject;const obj=$('water-object');obj.style.transition='transform .8s ease';obj.setAttribute('transform',`translate(260 ${it.float?94:202})`);expTested.add(it.id);testedLabel.textContent=`Objets testés : ${expTested.size} / 3`;feedback(`${it.label} : ${it.float?'il flotte à la surface.':'il coule au fond.'} ${predicted===it.float?'Ta prévision était juste !':'Tu as découvert un résultat différent de ta prévision.'}`,'info');if(expTested.size===3){success('Tu as testé et observé trois objets différents.')}else {testBtn.disabled=true;predicted=null;predictWrap.querySelectorAll('button').forEach(n=>n.classList.remove('active'));}}}
function svgSymbol(it){if(it.id==='pierre')return '<ellipse rx="27" ry="17" fill="#82878c" stroke="#4e5960" stroke-width="3"/>';if(it.id==='liege')return '<rect x="-28" y="-15" width="56" height="30" rx="9" fill="#c9a278" stroke="#896344" stroke-width="3"/>';return '<rect x="-32" y="-18" width="64" height="36" rx="4" fill="#ce9d5f" stroke="#9b703c" stroke-width="3"/>'}
function renderOrder(){let work=$('work');work.appendChild(el('p',{class:'small'},'Touche les étapes dans le bon ordre.'));let labels=[{id:'obs',text:'J’observe le résultat.'},{id:'choix',text:'Je choisis un objet.'},{id:'depose',text:'Je le dépose dans l’eau.'}];const list=el('div',{class:'arrange'}),out=el('div',{class:'sequence'},'Ton ordre : —');labels.forEach(item=>{let btn=el('button',{type:'button',onclick:()=>{if(done||sequence.includes(item.id))return;sequence.push(item.id);btn.disabled=true;out.textContent='Ton ordre : '+sequence.map(id=>labels.find(x=>x.id===id).text).join(' → ');$('check').classList.remove('hidden');}},item.text);list.appendChild(btn)});work.appendChild(list);work.appendChild(out);let reset=el('button',{class:'chip',type:'button',onclick:()=>{if(done)return;sequence=[];list.querySelectorAll('button').forEach(b=>b.disabled=false);out.textContent='Ton ordre : —';feedback('');}},'Effacer mon ordre');work.appendChild(reset);$('check').onclick=()=>sequence.join(',')==='choix,depose,obs'?success('Tu connais les étapes de l’expérience.'):error('D’abord, on choisit un objet. Tu peux effacer ton ordre et recommencer.')}
function renderAssociations(){const w=$('work');w.appendChild(el('p',{class:'small'},'Choisis une explication pour chaque observation.'));const itemsA=[['Un bouchon reste à la surface.','flotte'],['Une pierre tombe au fond.','coule'],['La pâte en forme de bateau reste en haut.','forme']];const opts=[['forme','La forme peut aider à flotter.'],['coule','L’objet coule.'],['flotte','L’objet flotte.']];itemsA.forEach((it,i)=>{const row=el('div',{class:'group-label'},it[0]);w.appendChild(row);let sel=el('select',{style:'width:100%;max-width:480px;min-height:49px;padding:10px;border:2px solid #cadeed;border-radius:10px;font:inherit;color:#173553;'});sel.appendChild(el('option',{value:''},'Choisis une explication…'));opts.forEach(([value,label])=>sel.appendChild(el('option',{value},label)));sel.onchange=()=>{assoc[i]=sel.value;$('check').classList.remove('hidden')};w.appendChild(sel)});$('check').onclick=()=>itemsA.every((it,i)=>assoc[i]===it[1])?success('Tu sais relier une observation à une explication.'):error('Rappelle-toi : flotter = rester à la surface ; couler = aller au fond.')}
function renderClassification(){const w=$('work');w.appendChild(el('p',{class:'small'},'Dans les expériences de la leçon, chaque objet flotte ou coule.'));const tests=[items[4],items[3],items[0],items[5]];tests.forEach((it,i)=>{w.appendChild(el('p',{class:'group-label'},`${it.symbol} ${it.label}`));const g=el('div',{class:'chips'});['Flotte','Coule'].forEach(v=>{const b=el('button',{class:'chip',type:'button',onclick:()=>{if(done)return;classAnswers[i]=v;g.querySelectorAll('button').forEach(n=>n.classList.remove('active'));b.classList.add('active');$('check').classList.remove('hidden')}},v);g.appendChild(b)});w.appendChild(g)});$('check').onclick=()=>tests.every((it,i)=>classAnswers[i]===(it.float?'Flotte':'Coule'))?success('Tu as bien classé les quatre objets.'):error('Regarde la partie « Exemples » de la leçon. Tu peux modifier tes choix.')}
function renderChallenge(){const w=$('work');w.appendChild(el('p',{class:'small'},'Réponds aux trois questions avant de vérifier.'));const tests=[{label:'Le bouchon de liège',a:'Flotte'},{label:'La pierre',a:'Coule'},{label:'La clé en métal',a:'Coule'}];tests.forEach((it,i)=>{w.appendChild(el('p',{class:'group-label'},it.label));const g=el('div',{class:'chips'});['Flotte','Coule'].forEach(v=>{let b=el('button',{class:'chip',type:'button',onclick:()=>{if(done)return;challAnswers[i]=v;g.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('check').classList.remove('hidden')}},v);g.appendChild(b)});w.appendChild(g)});$('check').onclick=()=>tests.every((it,i)=>challAnswers[i]===it.a)?success('Tu sais prévoir, observer et expliquer.'):error('Le liège reste à la surface. La pierre et la clé tombent au fond dans notre expérience.')}
function showFinal(){const w=$('work');w.replaceChildren();$('question').textContent='Bravo, tu as terminé les 10 exercices !';const r=el('div',{class:'result'});r.appendChild(el('strong',{},'Mission sciences réussie !'));r.appendChild(el('p',{},'Tu sais observer un objet qui flotte ou qui coule. Tu sais aussi que sa matière et sa forme peuvent jouer un rôle.'));r.appendChild(el('p',{class:'small'},'Tu peux maintenant raconter une expérience à ton enseignant.'));w.appendChild(r);$('restart').classList.remove('hidden')}
$('next').addEventListener('click',()=>{if(!done||step>=9)return;step++;render();document.querySelector('.activity').scrollIntoView({behavior:'smooth',block:'start'})});$('restart').addEventListener('click',()=>{step=0;render();document.querySelector('.activity').scrollIntoView({behavior:'smooth',block:'start'})});render();
})();
</script></body></html>
