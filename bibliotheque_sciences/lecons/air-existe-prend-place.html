<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’air existe et prend de la place — Maître Hibou Sciences CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf4fc;color:#173553;font:18px system-ui,Arial,sans-serif}main{width:100%;padding:clamp(8px,1.2vw,18px)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;gap:14px}header a{color:#134d84;text-decoration:none;font-weight:800}.lesson-image{width:100%;height:auto;max-width:100%;display:block;border-radius:12px}.quiz{width:100%;padding:clamp(15px,2vw,28px);background:#fff;border-radius:18px;margin:15px 0 32px;box-shadow:0 3px 15px #19365320}h1{font-size:clamp(22px,2.3vw,33px);margin:0 0 8px}.bar{height:13px;background:#dceaf4;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#4eac74;transition:width .2s}.question{font-size:clamp(21px,2.5vw,30px);font-weight:800;margin:14px 0 18px}.answers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}button{cursor:pointer;border:0;border-radius:13px;padding:13px 17px;font:700 18px system-ui,Arial;min-height:50px}button:focus-visible{outline:3px solid #e5a21c;outline-offset:2px}.choice{background:#e8f3ff;color:#173553;border:2px solid #bdd7ee;text-align:left}.choice:disabled{cursor:default}.choice.wrong{background:#ffe5e5;border-color:#d37770}.choice.right{background:#d5f5df;border-color:#4eaa71}#next,#done{margin-top:15px;background:#148355;color:#fff}#restart{margin-top:15px;background:#edf1f5}#feedback{min-height:30px;font-weight:750;margin:14px 0 0}#feedback.error{color:#a73627}#feedback.success{color:#167848}.hidden{display:none!important}.note{color:#526d86;font-size:16px}.final{font-size:21px;font-weight:800;color:#167848}</style></head><body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header><img class="lesson-image" src="../../images-lecons/sciences/maitre-hibou-air-existe-place.png" alt="Affiche illustrée : L’air existe et prend de la place"><section class="quiz"><h1>À toi d’expérimenter !</h1><p class="note">Réponds à 10 questions. Une bonne réponse est nécessaire pour passer à la suivante.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="counter"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="hidden">Question suivante →</button><button id="done" class="hidden">J’ai compris cette leçon ✓</button><button id="restart" class="hidden">Recommencer</button><p id="result" class="final"></p></section></main><script>const tasks=[{"q": "Peut-on voir l’air directement ?", "choices": ["Oui, toujours", "Non, il est invisible"], "a": "Non, il est invisible", "hint": "Même invisible, il est bien présent."}, {"q": "Que contient un ballon gonflé à l’air ?", "choices": ["De l’air", "Du sable", "Du bois"], "a": "De l’air", "hint": "Souffler remplit le ballon."}, {"q": "Quand on souffle dans un ballon, il…", "choices": ["Se gonfle", "Disparaît", "Devient de l’eau"], "a": "Se gonfle", "hint": "L’air prend de la place à l’intérieur."}, {"q": "Un sac qui paraît vide peut contenir…", "choices": ["De l’air", "Du feu", "Du métal"], "a": "De l’air", "hint": "L’air est invisible."}, {"q": "Pourquoi l’eau n’entre-t-elle pas facilement dans un verre retourné et plongé bien droit ?", "choices": ["L’air y occupe déjà la place", "Le verre devient lourd", "L’eau disparaît"], "a": "L’air y occupe déjà la place", "hint": "De l’air est emprisonné dans le verre."}, {"q": "L’air peut-il faire bouger une balle légère ?", "choices": ["Oui, si on souffle", "Non, jamais"], "a": "Oui, si on souffle", "hint": "On peut sentir les effets de l’air en mouvement."}, {"q": "L’air prend-il de la place ?", "choices": ["Oui", "Non"], "a": "Oui", "hint": "Le ballon gonfle grâce à l’air."}, {"q": "Quand le vent fait bouger des feuilles, on observe…", "choices": ["Un effet de l’air", "L’air qui devient solide"], "a": "Un effet de l’air", "hint": "Le vent est de l’air en mouvement."}, {"q": "Que prouve le ballon gonflé ?", "choices": ["L’air existe et occupe un espace", "L’air n’existe pas"], "a": "L’air existe et occupe un espace", "hint": "Il grossit quand on y met de l’air."}, {"q": "Quel mot décrit le mieux l’air ?", "choices": ["Invisible", "En bois", "Toujours coloré"], "a": "Invisible", "hint": "On ne le voit pas directement."}];let index=0,correct=0;const el=id=>document.getElementById(id);function show(){const t=tasks[index];el('counter').textContent=`Question ${index+1} sur ${tasks.length}`;el('question').textContent=t.q;el('feedback').textContent='';el('feedback').className='';el('next').classList.add('hidden');el('done').classList.add('hidden');el('restart').classList.add('hidden');el('answers').innerHTML='';t.choices.forEach(value=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.onclick=()=>choose(value,b);el('answers').appendChild(b);});el('fill').style.width=`${correct*100/tasks.length}%`;}function choose(value,b){if(value!==tasks[index].a){b.disabled=true;b.classList.add('wrong');el('feedback').className='error';el('feedback').textContent='Essaie encore ! Indice : '+tasks[index].hint;return;}correct++;el('fill').style.width=`${correct*100/tasks.length}%`;b.classList.add('right');for(const btn of el('answers').children)btn.disabled=true;el('feedback').className='success';el('feedback').textContent='Bravo ! Bonne réponse.';if(index===tasks.length-1){el('done').classList.remove('hidden');el('restart').classList.remove('hidden');}else el('next').classList.remove('hidden');}el('next').onclick=()=>{if(correct!==index+1)return;index++;show();};el('restart').onclick=()=>{index=0;correct=0;el('result').textContent='';show();};el('done').onclick=()=>{if(correct!==tasks.length)return;el('result').textContent='Bravo ! Tu as compris cette leçon.';el('done').disabled=true;el('done').textContent='Leçon terminée ✓';};show();</script></body></html>
