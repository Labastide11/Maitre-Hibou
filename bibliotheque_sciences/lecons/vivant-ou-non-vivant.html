<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vivant ou non vivant ? — Sciences CE2 · Maître Hibou</title><style>
:root{--ink:#14365a;--blue:#165989;--green:#147d59;--bg:#edf5fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,Arial,sans-serif}main{width:100%;max-width:1450px;padding:clamp(8px,1.5vw,20px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:9px}header a{color:#145689;text-decoration:none;font-weight:800}header span{font-weight:800;color:#376387}img.poster{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 5px 22px #133d681e}.quiz{margin-top:16px;background:#fff;border-radius:19px;padding:clamp(15px,2.5vw,30px);box-shadow:0 5px 18px #19395715}.quiz h1{font-size:clamp(23px,3vw,32px);margin:0}.muted{color:#55718a}.progress{height:12px;border-radius:20px;background:#e1edf6;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:#17a27c;transition:width .25s}.step{font-size:14px;font-weight:800;color:#477491}.question{font-size:clamp(20px,2.3vw,27px);margin:10px 0 5px;font-weight:850}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin:16px 0}.choice,.action,.sortarea{font:inherit;cursor:pointer;border-radius:12px}.choice{border:2px solid #bad0e4;background:#f3f9fe;text-align:left;font-weight:750;padding:14px}.choice:hover,.choice:focus-visible,.imagecard:focus-visible,.sortarea:focus-visible{outline:3px solid #6ac9e4;outline-offset:2px}.choice.selected{border-color:#18846f;background:#e3f8ee}.feedback{min-height:33px;font-weight:800;margin:12px 0;color:#125b49}.feedback.error{color:#ac4634}.action{border:0;padding:12px 19px;min-height:47px;color:white;background:#176b9e;font-weight:850}.action.primary{background:#16845f}.action:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.hidden{display:none!important}.grid-sort{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:13px 0}.sortarea{border:3px dashed #a8c3d7;min-height:172px;background:#f6faf </style></head><body><main><header><a href="../index.html">← Mes leçons de sciences</a><span>Maître Hibou · CE2</span></header><img class="poster" src="../../images-lecons/sciences/maitre-hibou-vivant-non-vivant.png" alt="Affiche Vivant ou non vivant ? : êtres vivants et objets non vivants"><section class="quiz"><h1>À toi de jouer !</h1><p class="muted">10 exercices interactifs. Observe, réponds et vérifie avant de continuer.</p><div class="progress" aria-label="Progression"><div class="bar" id="bar"></div></div><div class="step" id="step"></div><div class="question" id="question"></div><p class="muted" id="subtitle"></p><div id="activity"></div><p id="feedback" class="feedback" aria-live="polite"></p><div class="actions"><button id="check" class="action" type="button">Vérifier</button><button id="next" class="action primary hidden" type="button">Question suivante →</button><button id="finish" class="action primary hidden" type="button">J’ai compris cette leçon</button><button id="again" class="action hidden" type="button">Recommencer</button></div><p class="help">Pour l’exercice de classement : tu peux glisser les images avec la souris, ou toucher une image puis toucher sa colonne sur une tablette.</p></section></main>
<script>
(function(){'use strict';
const questions=[{"type": "sort", "title": "Classe les images", "sub": "Place les 12 images dans la bonne colonne. Sur tablette, touche une image puis touche une colonne.", "items": ["chien", "pierre", "chat", "eau", "arbre", "chaise", "coccinelle", "velo", "tournesol", "ballon", "enfant", "crayon"], "hint": "Le vivant naît, grandit, se nourrit et suit un cycle de vie."}, {"type": "choice", "q": "Lequel est un être vivant ?", "options": ["Une voiture", "Un arbre", "Un caillou"], "answer": "Un arbre", "hint": "Pense à ce qui pousse et a besoin d’eau."}, {"type": "choice", "q": "Pourquoi le vélo n’est-il pas vivant ?", "options": ["Parce qu’il n’a pas de roues", "Parce qu’il ne grandit pas et ne se reproduit pas", "Parce qu’il roule"], "answer": "Parce qu’il ne grandit pas et ne se reproduit pas", "hint": "Bouger ne suffit pas pour être vivant."}, {"type": "choice", "q": "Lequel peut grandir en étant vivant ?", "options": ["Une graine qui germe", "Un ballon qui gonfle", "Une pierre qui roule"], "answer": "Une graine qui germe", "hint": "Grandir chez un être vivant est différent de gonfler."}, {"type": "choice", "q": "Une grenouille est-elle vivante ?", "options": ["Oui, elle naît et grandit", "Non, car elle vit dans l’eau", "Non, car elle saute"], "answer": "Oui, elle naît et grandit", "hint": "Regarde son cycle de vie."}, {"type": "choice", "q": "Une voiture avance. Est-elle vivante ?", "options": ["Oui, puisqu’elle bouge", "Oui, puisqu’elle consomme du carburant", "Non, elle ne suit pas un cycle de vie"], "answer": "Non, elle ne suit pas un cycle de vie", "hint": "Se déplacer ne suffit pas."}, {"type": "choice", "q": "Un tournesol est vivant parce que…", "options": ["il pousse et a besoin d’eau", "il a une couleur jaune", "il est planté dans la terre"], "answer": "il pousse et a besoin d’eau", "hint": "Cherche une caractéristique commune aux plantes et aux animaux."}, {"type": "choice", "q": "Quel duo contient seulement des êtres vivants ?", "options": ["Chat et arbre", "Chien et ballon", "Fleur et caillou"], "answer": "Chat et arbre", "hint": "Dans chaque duo, vérifie les deux éléments."}, {"type": "choice", "q": "La pierre est-elle vivante ?", "options": ["Oui, car elle est naturelle", "Non, elle ne se nourrit pas et ne se reproduit pas", "Oui, car elle peut devenir plus grosse"], "answer": "Non, elle ne se nourrit pas et ne se reproduit pas", "hint": "Naturel ne veut pas toujours dire vivant."}, {"type": "choice", "q": "Quelle phrase résume la leçon ?", "options": ["Tout ce qui bouge est vivant", "Tout ce qui vient de la nature est vivant", "Un être vivant suit un cycle de vie"], "answer": "Un être vivant suit un cycle de vie", "hint": "Pense aux étapes de la vie : naissance, croissance et reproduction."}],catalog=[{"id": "chien", "label": "Chien", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/chien.webp"}, {"id": "chat", "label": "Chat", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/chat.webp"}, {"id": "arbre", "label": "Arbre", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/arbre.webp"}, {"id": "tournesol", "label": "Tournesol", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/tournesol.webp"}, {"id": "oiseau", "label": "Oiseau", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/oiseau.webp"}, {"id": "grenouille", "label": "Grenouille", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/grenouille.webp"}, {"id": "coccinelle", "label": "Coccinelle", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/coccinelle.webp"}, {"id": "enfant", "label": "Enfant", "kind": "vivant", "src": "../../images-lecons/sciences/vivant-cartes/enfant.webp"}, {"id": "pierre", "label": "Pierre", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/pierre.webp"}, {"id": "eau", "label": "Eau", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/eau.webp"}, {"id": "sable", "label": "Sable", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/sable.webp"}, {"id": "chaise", "label": "Chaise", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/chaise.webp"}, {"id": "velo", "label": "Vélo", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/velo.webp"}, {"id": "voiture", "label": "Voiture", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/voiture.webp"}, {"id": "ballon", "label": "Ballon", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/ballon.webp"}, {"id": "crayon", "label": "Crayon", "kind": "non", "src": "../../images-lecons/sciences/vivant-cartes/crayon.webp"}],byid=Object.fromEntries(catalog.map(x=>[x.id,x]));
const $=id=>document.getElementById(id);let n=0,selected=null,passed=false,places={},choice=null,completed=false;
function el(tag,cl,txt){let e=document.createElement(tag);if(cl)e.className=cl;if(txt!==undefined)e.textContent=txt;return e;}
function reset(){n=0;completed=false;$('finish').textContent='J’ai compris cette leçon';$('finish').disabled=false;render();}
function render(){const q=questions[n];passed=false;selected=null;places={};choice=null;$('step').textContent='Exercice '+(n+1)+' / 10';$('bar').style.width=(n/10*100)+'%';$('question').textContent=q.q||q.title;$('subtitle').textContent=q.sub||'';$('feedback').textContent='';$('feedback').className='feedback';$('activity').replaceChildren();$('check').classList.remove('hidden');$('check').disabled=true;$('next').classList.add('hidden');$('finish').classList.add('hidden');$('again').classList.add('hidden');if(q.type==='sort')initSort(q);else initChoice(q);}
function initChoice(q){const box=el('div','choices');q.options.forEach(label=>{const b=el('button','choice',label);b.type='button';b.onclick=()=>{if(passed)return;choice=label;[...box.children].forEach(c=>c.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;};box.append(b);});$('activity').append(box);}
function initSort(q){const outer=el('div');const grid=el('div','grid-sort');const pool=el('div','pool');pool.id='pool';const areas={};for(const [kind,title] of [['vivant','🌱 Vivant'],['non','🪨 Non vivant']]){const area=el('button','sortarea');area.type='button';area.dataset.kind=kind;area.append(el('strong','',title));const content=el('div','dropcontent');area.append(content);area.onclick=e=>{if(passed)return;if(selected){places[selected]=kind;selected=null;drawSort(q,areas,pool);}};area.ondragover=e=>e.preventDefault();area.ondrop=e=>{e.preventDefault();if(passed)return;const id=e.dataTransfer.getData('text/plain');if(byid[id]){places[id]=kind;selected=null;drawSort(q,areas,pool);}};grid.append(area);areas[kind]=content;}outer.append(grid,el('p','help','À classer : 12 images. Tu peux toucher une carte pour la sélectionner.'));outer.append(pool);$('activity').append(outer);drawSort(q,areas,pool);}
function drawSort(q,areas,pool){pool.replaceChildren();Object.values(areas).forEach(x=>x.replaceChildren());q.items.forEach(id=>{const it=byid[id],b=el('button','imagecard'+(selected===id?' active':''));b.type='button';b.draggable=true;const img=el('img');img.src=it.src;img.alt=it.label;img.loading='eager';b.append(img,el('span','',it.label));b.setAttribute('aria-label',it.label+', '+(places[id]||'non classé'));b.onclick=e=>{e.stopPropagation();if(passed)return;if(selected===id)selected=null;else selected=id;drawSort(q,areas,pool);};b.ondragstart=e=>{if(passed){e.preventDefault();return;}e.dataTransfer.setData('text/plain',id);};(places[id]?areas[places[id]]:pool).append(b);});$('check').disabled=!q.items.every(id=>places[id]);}
$('check').onclick=()=>{if(passed)return;const q=questions[n];if(q.type==='sort'){const bad=q.items.filter(id=>places[id]!==byid[id].kind);if(bad.length){$('feedback').textContent='Il reste '+bad.length+' image'+(bad.length>1?'s':'')+' à corriger. Regarde les images et réessaie.';$('feedback').className='feedback error';// Return incorrect cards to the pool so student can try again
bad.forEach(id=>delete places[id]);const areas={'vivant':document.querySelector('[data-kind="vivant"] .dropcontent'),'non':document.querySelector('[data-kind="non"] .dropcontent')};drawSort(q,areas,$('pool'));return;}success('Bravo ! Les 12 images sont bien classées.');}else if(choice===q.answer){success('Bonne réponse !');}else{$('feedback').textContent='Essaie encore. Indice : '+q.hint;$('feedback').className='feedback error';choice=null;document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));$('check').disabled=true;}};
function success(message){passed=true;$('feedback').textContent='✅ '+message;$('feedback').className='feedback';$('bar').style.width=((n+1)/10*100)+'%';$('check').classList.add('hidden');$('next').classList.toggle('hidden',n===9);$('finish').classList.toggle('hidden',n!==9);}
$('next').onclick=()=>{if(passed&&n<9){n++;render();}};
$('finish').onclick=()=>{if(!passed||n!==9)return;completed=true;$('finish').textContent='✅ Leçon réussie !';$('finish').disabled=true;$('again').classList.remove('hidden');const target=window.HibouScienceLesson||window.HibouLesson||null;if(target&&typeof target.complete==='function'){try{target.complete({titre:'Vivant ou non vivant ?',domaine:'Vivant'},$('finish'));}catch(e){console.warn('Suivi non disponible',e);}}};
$('again').onclick=reset;render();})();
</script></body></html>
