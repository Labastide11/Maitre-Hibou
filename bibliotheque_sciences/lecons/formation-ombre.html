<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comment se forme une ombre ? — Maître Hibou Sciences CE2</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf4fc;color:#173553;font:18px system-ui,Arial,sans-serif}main{width:100%;padding:clamp(8px,1.2vw,18px)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;gap:14px}header a{color:#134d84;text-decoration:none;font-weight:800}.lesson-image{width:100%;height:auto;max-width:100%;display:block;border-radius:12px}.quiz{width:100%;padding:clamp(15px,2vw,28px);background:#fff;border-radius:18px;margin:15px 0 32px;box-shadow:0 3px 15px #19365320}h1{font-size:clamp(22px,2.3vw,33px);margin:0 0 8px}.bar{height:13px;background:#dceaf4;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#4eac74;transition:width .2s}.question{font-size:clamp(21px,2.5vw,30px);font-weight:800;margin:14px 0 18px}.answers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}button{cursor:pointer;border:0;border-radius:13px;padding:13px 17px;font:700 18px system-ui,Arial;min-height:50px}button:focus-visible{outline:3px solid #e5a21c;outline-offset:2px}.choice{background:#e8f3ff;color:#173553;border:2px solid #bdd7ee;text-align:left}.choice:disabled{cursor:default}.choice.wrong{background:#ffe5e5;border-color:#d37770}.choice.right{background:#d5f5df;border-color:#4eaa71}#next,#done{margin-top:15px;background:#148355;color:#fff}#restart{margin-top:15px;background:#edf1f5}#feedback{min-height:30px;font-weight:750;margin:14px 0 0}#feedback.error{color:#a73627}#feedback.success{color:#167848}.hidden{display:none!important}.note{color:#526d86;font-size:16px}.final{font-size:21px;font-weight:800;color:#167848}</style></head><body><main><header><a href="../index.html">← Sciences CE2</a><strong>Maître Hibou · Sciences</strong></header><img class="lesson-image" src="../../images-lecons/sciences/maitre-hibou-formation-ombre.png" alt="Affiche illustrée : Comment se forme une ombre ?"><section class="quiz"><h1>À toi d’expérimenter !</h1><p class="note">Réponds à 10 questions. Une bonne réponse est nécessaire pour passer à la suivante.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="counter"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="hidden">Question suivante →</button><button id="done" class="hidden">J’ai compris cette leçon ✓</button><button id="restart" class="hidden">Recommencer</button><p id="result" class="final"></p></section></main><script>const tasks=[{"q": "Pour créer une ombre sur un écran, il faut…", "choices": ["Une lumière et un objet opaque", "Deux verres transparents sans lumière", "Seulement de l’eau"], "a": "Une lumière et un objet opaque", "hint": "Pense à la lampe et à la figurine."}, {"q": "Que fait un objet opaque à la lumière ?", "choices": ["Il la bloque", "Il la transforme en eau", "Il la rend plus chaude"], "a": "Il la bloque", "hint": "C’est pour cela qu’une zone sombre apparaît."}, {"q": "Où se forme l’ombre de la figurine ?", "choices": ["Sur l’écran derrière elle", "À l’intérieur de la lampe", "Toujours au plafond"], "a": "Sur l’écran derrière elle", "hint": "Regarde la photo de l’expérience."}, {"q": "Quelle est une source de lumière dans l’expérience ?", "choices": ["La lampe", "La figurine", "La feuille blanche"], "a": "La lampe", "hint": "C’est l’objet qui éclaire."}, {"q": "Qu’est-ce qu’un écran dans cette expérience ?", "choices": ["Une feuille blanche derrière l’objet", "Le câble de la lampe", "Le bureau seul"], "a": "Une feuille blanche derrière l’objet", "hint": "On y voit l’ombre projetée."}, {"q": "Pourquoi observe-t-on l’ombre ?", "choices": ["L’objet empêche la lumière de passer", "L’objet crée une autre lampe", "L’écran absorbe l’objet"], "a": "L’objet empêche la lumière de passer", "hint": "L’ombre est une zone privée de lumière directe."}, {"q": "Au soleil, ton corps peut-il former une ombre ?", "choices": ["Oui", "Non"], "a": "Oui", "hint": "Ton corps bloque une partie de la lumière du Soleil."}, {"q": "Un arbre peut-il produire une ombre ?", "choices": ["Oui", "Non"], "a": "Oui", "hint": "Le tronc et les feuilles arrêtent de la lumière."}, {"q": "Peut-on changer la taille de l’ombre en déplaçant la lampe ?", "choices": ["Oui", "Non"], "a": "Oui", "hint": "Observe la différence lorsque la lampe se rapproche ou s’éloigne de l’objet."}, {"q": "Quelle phrase résume la leçon ?", "choices": ["Une ombre apparaît quand un objet opaque bloque la lumière", "Une ombre est une tache de peinture", "Une ombre n’existe que la nuit"], "a": "Une ombre apparaît quand un objet opaque bloque la lumière", "hint": "Rappelle-toi les trois éléments : lampe, objet et écran."}];let index=0,correct=0;const el=id=>document.getElementById(id);function show(){const t=tasks[index];el('counter').textContent=`Question ${index+1} sur ${tasks.length}`;el('question').textContent=t.q;el('feedback').textContent='';el('feedback').className='';el('next').classList.add('hidden');el('done').classList.add('hidden');el('restart').classList.add('hidden');el('answers').innerHTML='';t.choices.forEach(value=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.onclick=()=>choose(value,b);el('answers').appendChild(b);});el('fill').style.width=`${correct*100/tasks.length}%`;}function choose(value,b){if(value!==tasks[index].a){b.disabled=true;b.classList.add('wrong');el('feedback').className='error';el('feedback').textContent='Essaie encore ! Indice : '+tasks[index].hint;return;}correct++;el('fill').style.width=`${correct*100/tasks.length}%`;b.classList.add('right');for(const btn of el('answers').children)btn.disabled=true;el('feedback').className='success';el('feedback').textContent='Bravo ! Bonne réponse.';if(index===tasks.length-1){el('done').classList.remove('hidden');el('restart').classList.remove('hidden');}else el('next').classList.remove('hidden');}el('next').onclick=()=>{if(correct!==index+1)return;index++;show();};el('restart').onclick=()=>{index=0;correct=0;el('result').textContent='';show();};el('done').onclick=()=>{if(correct!==tasks.length)return;el('result').textContent='Bravo ! Tu as compris cette leçon.';el('done').disabled=true;el('done').textContent='Leçon terminée ✓';};show();</script></body></html>
